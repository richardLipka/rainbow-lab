/**
 * rays.js -- turns the current control state into a set of traced rays.
 *
 * Every ray in the application comes from here, so the 2-D scene, the graph
 * and the readout panel can never disagree about what is being shown.
 */


/** A demonstrably off-caustic impact parameter for the "ordinary ray" case. */
const NON_CAUSTIC_B = 0.35;

/** Trace one ray with the canonical geometry: beam along +x, droplet at origin. */
function traceOne(lambda, n, k, b, radius = 1) {
  const path = O.traceRay({
    origin: O.vec(-6 * radius, b * radius, 0),
    dir: O.vec(1, 0, 0),
    center: O.vec(0, 0, 0),
    radius,
    n,
    reflections: k,
    exitLength: 6 * radius,
  });
  return {
    lambda,
    n,
    k,
    b,
    path,
    classification: path.classification,
    color: O.rgbCss(lambda),
  };
}

/**
 * The full set of rays implied by the current state.
 * role:
 *   'main'   the ray the user is steering
 *   'fan'    the surrounding fan that shows the caustic piling up
 *   'demo0'  Case 1 from the brief: zero internal reflections
 *   'demoNC' Case 2: one internal reflection at a non-rainbow impact parameter
 */
function buildRays() {
  const idx = indexModel();
  const lambdas = activeLambdas();
  const orders = activeOrders();
  const out = [];

  for (const k of orders) {
    for (const lambda of lambdas) {
      const n = idx(lambda);
      const r = traceOne(lambda, n, k, state.impact);
      r.role = 'main';
      out.push(r);

      if (state.fanCount > 0) {
        for (let i = 0; i < state.fanCount; i++) {
          const b = (i + 0.5) / state.fanCount;
          if (Math.abs(b - state.impact) < 1e-6) continue;
          const f = traceOne(lambda, n, k, b);
          f.role = 'fan';
          out.push(f);
        }
      }
    }
  }

  if (state.showNonRainbow) {
    const lambda = lambdas.includes(650) ? 650 : lambdas[0];
    const n = idx(lambda);
    if (!orders.includes(0)) {
      const r0 = traceOne(lambda, n, 0, state.impact);
      r0.role = 'demo0';
      r0.noteKey = 'explNoReflection';
      out.push(r0);
    }
    const rn = traceOne(lambda, n, 1, NON_CAUSTIC_B);
    rn.role = 'demoNC';
    rn.noteKey = 'explNonCaustic';
    out.push(rn);
  }

  return out;
}

/** How far (in degrees) this ray sits from the extremum of its own family. */
function distanceFromExtremum(ray) {
  if (ray.k < 1 || ray.path.antisolar === null) return null;
  const geo = O.rainbowGeometry(ray.n, ray.k);
  if (!geo) return null;
  return ray.path.antisolar * O.DEG - geo.antisolarDeg;
}

/**
 * Display colour for a wavelength.
 *
 * With white light selected and dispersion turned down, the six sampled
 * wavelengths all take the same path, so they are drawn white and overlap into
 * a single beam. As dispersion rises they separate AND gain their colour --
 * which is the honest visual statement that the colours of a rainbow exist
 * only because n depends on wavelength.
 */
function colorFor(lambda, alpha = 1) {
  const c = O.wavelengthToRGB(lambda);
  let { r, g, b } = c;
  if (state.wavelength === 'white') {
    const m = Math.min(1, state.dispersion * 2.5);
    r = Math.round(r * m + 255 * (1 - m));
    g = Math.round(g * m + 255 * (1 - m));
    b = Math.round(b * m + 255 * (1 - m));
  }
  return alpha >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
}

/** Named colour id for a wavelength, if it is one of the six. */
function colorIdFor(lambda) {
  const c = O.NAMED_COLORS.find((x) => x.lambda === lambda);
  return c ? c.id : null;
}

/* ============ src/dropletView.js ============ */

/**
 * dropletView.js -- Mode A: cross-section of a single spherical droplet.
 *
 * Nothing in here knows any optics: it renders the polylines that
 * optics.traceRay() produced. Dragging changes the impact parameter, which
 * re-runs the trace.
 */





const SEG_LABELS = ['R0', 'R1', 'R2', 'R3', 'R4', 'R5'];

function createDropletView(canvas) {
  let layout = null;
  let hover = null;

  function project(p) {
    return { x: layout.cx + p.x * layout.s, y: layout.cy - p.y * layout.s };
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);

    const s = Math.min(w * 0.19, h * 0.34);
    layout = { cx: w * 0.47, cy: h * 0.5, s, w, h };

    drawBackground(ctx, w, h);
    drawDroplet(ctx);
    drawSun(ctx, w, h);

    const rays = buildRays();
    // fans first, main rays on top
    const order = { fan: 0, demo0: 1, demoNC: 1, main: 2 };
    rays.sort((a, b) => order[a.role] - order[b.role]);
    for (const ray of rays) drawRay(ctx, ray);

    const main = rays.filter((r) => r.role === 'main');
    if (main.length) {
      const ref = main[main.length - 1];
      if (state.show.angles) drawAngles(ctx, ref);
      if (state.show.labels) drawSegmentLabels(ctx, ref);
      if (state.show.angles && ref.path.dirOut) drawExitAngle(ctx, ref);
      if (state.show.normals) for (const r of main) drawNormals(ctx, r);
    }
    drawImpactHandle(ctx);
    drawLegend(ctx, w, h, rays);
  }

  function drawBackground(ctx, w, h) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#080b14');
    g.addColorStop(1, '#0d1220');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // optical axis through the droplet centre
    strokePath(
      ctx,
      [{ x: 0, y: layout.cy }, { x: w, y: layout.cy }],
      'rgba(120,140,180,0.18)',
      1,
      [4, 6]
    );
    if (state.show.labels) {
      label(ctx, t('antisolarPoint'), 14, layout.cy - 13, {
        color: '#8fa4c8', bg: false, font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif',
      });
    }
  }

  function drawDroplet(ctx) {
    const { cx, cy, s } = layout;
    const g = ctx.createRadialGradient(cx - s * 0.35, cy - s * 0.35, s * 0.1, cx, cy, s);
    g.addColorStop(0, 'rgba(120,190,255,0.16)');
    g.addColorStop(1, 'rgba(60,110,190,0.06)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,190,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // centre mark
    ctx.fillStyle = 'rgba(160,200,255,0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
    ctx.fill();

    if (state.show.labels) {
      const idx = indexModel();
      const lam = state.wavelength === 'white' ? 589 : state.wavelength;
      label(ctx, `${t('raindrop')} · n = ${num(idx(lam), 3)}`, cx, cy + s + 16, {
        align: 'center', color: '#9fc4ee',
      });
      label(ctx, `R = ${num(state.dropletRadiusMm, 2)} mm`, cx, cy + s + 34, {
        align: 'center', color: '#6f86ab', bg: false, font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }
  }

  function drawSun(ctx, w, h) {
    const y = layout.cy - state.impact * layout.s;
    ctx.save();
    const g = ctx.createRadialGradient(24, y, 2, 24, y, 16);
    g.addColorStop(0, 'rgba(255,238,180,0.95)');
    g.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(24, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.arc(24, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (state.show.labels) {
      label(ctx, t('sunLabel'), 24, y - 24, { align: 'center', color: '#ffe9a8' });
    }
  }

  function rayAlpha(ray) {
    if (ray.role === 'fan') return 0.24;
    if (ray.role === 'demo0' || ray.role === 'demoNC') return 0.75;
    return 1;
  }

  function drawRay(ctx, ray) {
    const p = ray.path;
    if (!p.hit && !p.miss) return;
    const a = rayAlpha(ray);
    const selected =
      state.selectedRay &&
      state.selectedRay.k === ray.k &&
      Math.abs(state.selectedRay.b - ray.b) < 1e-9 &&
      state.selectedRay.lambda === ray.lambda;

    const base = colorFor(ray.lambda, a);
    const dashed = ray.role === 'demo0' || ray.role === 'demoNC';

    for (const seg of p.segments) {
      const A = project(seg.a);
      const B = project(seg.b);
      let width = ray.role === 'fan' ? 1 : 1.9;
      if (selected) width += 1.6;
      let style = base;
      if (seg.medium === 'water') {
        style = colorFor(ray.lambda, Math.min(1, a * 0.95));
        width += 0.2;
      }
      if (seg.kind === 'incident' && ray.role !== 'fan') {
        style = state.wavelength === 'white' ? `rgba(255,246,214,${a})` : base;
      }
      strokePath(ctx, [A, B], style, width, dashed && seg.kind !== 'internal' ? [5, 4] : null);
    }

    if (p.dirOut && p.segments.length) {
      const last = p.segments[p.segments.length - 1];
      arrowHead(ctx, project(last.a), project(last.b), base, ray.role === 'fan' ? 4 : 7);
    }

    if (ray.role !== 'fan') {
      for (const v of p.vertices) {
        const q = project(v.point);
        ctx.fillStyle = v.type === 'reflection' ? '#ffd166' : '#8be0ff';
        ctx.beginPath();
        ctx.arc(q.x, q.y, selected ? 3.6 : 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (ray.noteKey && state.show.labels) {
      const last = p.segments[p.segments.length - 1];
      const q = project(last.b);
      const txt = t(ray.noteKey);
      label(ctx, txt.length > 62 ? txt.slice(0, 60) + '…' : txt,
        Math.min(q.x, layout.w - 12), q.y + (ray.k === 0 ? 16 : -16), {
        align: 'right', color: '#c3b6ff', font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif',
      });
    }
  }

  function drawNormals(ctx, ray) {
    for (const v of ray.path.vertices) {
      const a = project(v.point);
      const nEnd = O.vadd(v.point, O.vmul(v.normal, 0.42));
      const b = project(nEnd);
      strokePath(ctx, [a, b], 'rgba(180,200,240,0.5)', 1, [3, 3]);
      const inner = project(O.vsub(v.point, O.vmul(v.normal, 0.42)));
      strokePath(ctx, [a, inner], 'rgba(180,200,240,0.22)', 1, [3, 3]);
    }
  }

  function drawSegmentLabels(ctx, ray) {
    const segs = ray.path.segments;
    for (let i = 0; i < segs.length && i < SEG_LABELS.length; i++) {
      const s = segs[i];
      const mid = { x: (s.a.x + s.b.x) / 2, y: (s.a.y + s.b.y) / 2 };
      const q = project(mid);
      label(ctx, SEG_LABELS[i], q.x, q.y - 12, {
        align: 'center', color: '#93a7c9', font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }
  }

  function drawAngles(ctx, ray) {
    const v = ray.path.vertices[0];
    if (!v) return;
    const c = project(v.point);
    const nDir = { x: v.normal.x, y: -v.normal.y };
    const nAng = Math.atan2(nDir.y, nDir.x);
    const inAng = Math.atan2(0, -1); // incoming ray reversed = pointing back to the Sun
    const r = 30;
    angleArc(ctx, c.x, c.y, r, nAng, inAng, 'rgba(139,224,255,0.8)', `θi=${deg(v.thetaIn * O.DEG, 1)}`);
    const refr = ray.path.segments[1];
    if (refr) {
      const d = { x: refr.b.x - refr.a.x, y: -(refr.b.y - refr.a.y) };
      const rAng = Math.atan2(d.y, d.x);
      angleArc(ctx, c.x, c.y, r * 0.62, nAng + Math.PI, rAng, 'rgba(255,209,102,0.85)',
        `θr=${deg(v.thetaOut * O.DEG, 1)}`);
    }
  }

  function drawExitAngle(ctx, ray) {
    const p = ray.path;
    const exitSeg = p.segments[p.segments.length - 1];
    const origin = project(exitSeg.a);
    // reference direction = away from the Sun (the antisolar direction), i.e. +x
    const refEnd = { x: origin.x + 78, y: origin.y };
    strokePath(ctx, [origin, refEnd], 'rgba(120,140,180,0.5)', 1, [3, 4]);
    const d = { x: exitSeg.b.x - exitSeg.a.x, y: -(exitSeg.b.y - exitSeg.a.y) };
    const outAng = Math.atan2(d.y, d.x);
    const phi = p.antisolar * O.DEG;
    angleArc(ctx, origin.x, origin.y, 46, 0, outAng, 'rgba(111,211,164,0.95)', `φ=${deg(phi, 1)}`);
  }

  function drawImpactHandle(ctx) {
    const y = layout.cy - state.impact * layout.s;
    const x = layout.cx - layout.s * 1.9;
    ctx.save();
    ctx.strokeStyle = hover ? 'rgba(255,255,255,0.75)' : 'rgba(180,200,240,0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(x, layout.cy);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = hover ? '#ffffff' : 'rgba(200,220,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (state.show.labels) {
      label(ctx, `b/R = ${num(state.impact, 3)}`, x, y - 16, { align: 'center', color: '#cfe0ff' });
    }
  }

  function drawLegend(ctx, w, h, rays) {
    if (!state.show.wavelengthLabels) return;
    const main = rays.filter((r) => r.role === 'main');
    const seen = new Set();
    let y = 18;
    for (const r of main) {
      if (seen.has(r.lambda)) continue;
      seen.add(r.lambda);
      const txt = `${r.lambda} ${t('nm')} · n=${num(r.n, 4)} · φ=${
        r.path.antisolar === null ? '—' : deg(r.path.antisolar * O.DEG, 2)
      }`;
      label(ctx, txt, w - 12, y, { align: 'right', color: colorFor(r.lambda) });
      y += 18;
    }
  }

  /* ---------------------------------------------------------- interaction */

  function impactFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const b = (layout.cy - y) / layout.s;
    return Math.max(-0.999, Math.min(0.999, b));
  }

  let dragging = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (!layout) return;
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    set({ impact: impactFromEvent(e) });
    selectNearest(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!layout) return;
    if (dragging) {
      set({ impact: impactFromEvent(e) });
    } else {
      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const hy = layout.cy - state.impact * layout.s;
      const nowHover = Math.abs(y - hy) < 14;
      if (nowHover !== hover) {
        hover = nowHover;
        canvas.style.cursor = hover ? 'ns-resize' : 'crosshair';
        draw();
      }
    }
  });
  const stop = () => { dragging = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  function selectNearest(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    let best = null;
    let bestD = 14;
    for (const ray of buildRays()) {
      for (const seg of ray.path.segments) {
        const A = project(seg.a);
        const B = project(seg.b);
        const d = distToSegment(px, py, A, B);
        if (d < bestD) {
          bestD = d;
          best = ray;
        }
      }
    }
    if (best) {
      set({ selectedRay: { lambda: best.lambda, k: best.k, b: best.b }, panel: 'ray' });
    }
  }

  return { draw, tick: () => false, reset: () => {} };
}

function distToSegment(px, py, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - a.x, py - a.y);
  let tt = ((px - a.x) * dx + (py - a.y) * dy) / l2;
  tt = Math.max(0, Math.min(1, tt));
  return Math.hypot(px - (a.x + tt * dx), py - (a.y + tt * dy));
}

/* ============ src/graphView.js ============ */

/**
 * graphView.js -- the two diagnostic plots.
 *
 *   'exit'  exit angle versus impact parameter, one curve per wavelength and
 *           per reflection order. The extremum is found by the optics engine,
 *           never drawn as a decorative horizontal line.
 *   'dist'  the angular distribution of outgoing rays, accumulated ray by ray
 *           so that the caustic peak visibly emerges.
 *
 * Both directions of the interaction are wired: dragging the ray moves the
 * marker, clicking the graph moves the ray.
 */





const PAD = { l: 58, r: 16, t: 26, b: 34 };

function createGraphView(canvas) {
  let box = null;
  const accum = { key: '', data: new Map(), count: 0, target: 0 };
  let raf = null;

  /* --------------------------------------------------------- accumulator */

  function accumKey() {
    return [
      activeOrders().join(','),
      activeLambdas().join(','),
      state.dispersion,
      state.indexMode,
      state.indexScale,
      distRange().join(','),
    ].join('|');
  }

  function distRange() {
    const orders = activeOrders();
    const maxK = Math.max(...orders);
    const minK = Math.min(...orders);
    if (maxK <= 2 && minK >= 1) return [0, 90];
    return [0, 180];
  }

  const BINS = 540;

  function resetAccum() {
    accum.key = accumKey();
    accum.data = new Map();
    accum.count = 0;
    for (const lam of activeLambdas()) accum.data.set(lam, new Float64Array(BINS));
  }

  /** Add `m` randomly sampled rays per wavelength (area-weighted in b). */
  function addRays(m) {
    const idx = indexModel();
    const orders = activeOrders();
    const [lo, hi] = distRange();
    const bw = (hi - lo) / BINS;
    for (const lam of activeLambdas()) {
      const arr = accum.data.get(lam);
      if (!arr) continue;
      const n = idx(lam);
      for (let i = 0; i < m; i++) {
        const b = Math.sqrt(Math.random());
        const thetaI = Math.asin(O.clamp(b, 0, 1));
        for (const k of orders) {
          const D = O.deviation(thetaI, n, k);
          if (D === null) continue;
          const phi = O.antisolarAngle(D) * O.DEG;
          const R = O.fresnelReflectance(thetaI, 1, n);
          const w = (1 - R) * (1 - R) * Math.pow(R, k);
          const bin = Math.floor((phi - lo) / bw);
          if (bin >= 0 && bin < BINS) arr[bin] += w;
        }
      }
    }
    accum.count += m;
  }

  function stepAccum() {
    if (accum.key !== accumKey()) resetAccum();
    const target = state.distAccumulate ? Infinity : state.distRays;
    if (accum.count > state.distRays && !state.distAccumulate) resetAccum();
    if (accum.count < target) {
      const remaining = target - accum.count;
      const batch = Math.min(
        Math.max(1, Math.ceil(accum.count * 0.35) || 1),
        remaining,
        state.distAccumulate ? 3000 : 8000
      );
      addRays(batch);
      return true; // more to come
    }
    return false;
  }

  /* -------------------------------------------------------------- drawing */

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#080b14';
    ctx.fillRect(0, 0, w, h);
    box = { x: PAD.l, y: PAD.t, w: w - PAD.l - PAD.r, h: h - PAD.t - PAD.b };
    if (box.w < 40 || box.h < 30) return;
    if (state.graph === 'exit') drawExit(ctx, w, h);
    else drawDist(ctx, w, h);
  }

  function frame(ctx, xLabel, yLabel, xTicks, yTicks, fx, fy) {
    ctx.save();
    ctx.strokeStyle = 'rgba(120,140,180,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(box.x, box.y, box.w, box.h);
    ctx.font = '10px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle = '#7c8fb3';
    for (const v of xTicks) {
      const x = fx(v);
      ctx.strokeStyle = 'rgba(120,140,180,0.13)';
      ctx.beginPath();
      ctx.moveTo(x, box.y);
      ctx.lineTo(x, box.y + box.h);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(num(v, v % 1 === 0 ? 0 : 1), x, box.y + box.h + 13);
    }
    for (const v of yTicks) {
      const y = fy(v);
      ctx.strokeStyle = 'rgba(120,140,180,0.13)';
      ctx.beginPath();
      ctx.moveTo(box.x, y);
      ctx.lineTo(box.x + box.w, y);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(num(v, v % 1 === 0 ? 0 : 1), box.x - 7, y + 3);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8ea3c6';
    ctx.font = '11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(xLabel, box.x + box.w / 2, box.y + box.h + 28);
    ctx.save();
    ctx.translate(13, box.y + box.h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
    ctx.restore();
  }

  function niceTicks(lo, hi, count = 6) {
    const span = hi - lo;
    if (!(span > 0)) return [lo];
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const stepN = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    const step = stepN * mag;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
      out.push(Math.abs(v) < 1e-9 ? 0 : v);
    }
    return out;
  }

  /* ------------------------------------------------ exit-angle vs impact */

  let exitMap = null;

  function drawExit(ctx, w, h) {
    const idx = indexModel();
    const orders = activeOrders();
    const lambdas = activeLambdas();
    const curves = [];
    let lo = Infinity;
    let hi = -Infinity;
    for (const k of orders) {
      for (const lam of lambdas) {
        const n = idx(lam);
        const c = O.exitAngleCurve(n, k, 320);
        const vals =
          state.angleMode === 'deviation' ? c.D : state.angleMode === 'scattering' ? c.theta : c.phi;
        for (const v of vals) {
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
        curves.push({ k, lam, n, b: c.b, vals });
      }
    }
    if (!curves.length) return;
    const padY = Math.max(2, (hi - lo) * 0.12);
    lo = Math.max(0, lo - padY);
    hi = hi + padY;

    const fx = (b) => box.x + b * box.w;
    const fy = (v) => box.y + box.h - ((v - lo) / (hi - lo)) * box.h;
    exitMap = { fx, fy, lo, hi };

    const yKey =
      state.angleMode === 'deviation'
        ? 'axisAngleDeviation'
        : state.angleMode === 'scattering'
        ? 'axisAngleScattering'
        : 'axisAngleAntisolar';
    frame(ctx, t('axisImpact'), t(yKey), niceTicks(0, 1, 5), niceTicks(lo, hi, 6), fx, fy);

    // extremum guide lines, computed by the engine
    for (const k of orders) {
      if (k < 1) continue;
      for (const lam of lambdas) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const v =
          state.angleMode === 'deviation'
            ? geo.deviationDeg
            : state.angleMode === 'scattering'
            ? geo.scatteringDeg
            : geo.antisolarDeg;
        if (v < lo || v > hi) continue;
        const y = fy(v);
        strokePath(
          ctx,
          [{ x: box.x, y }, { x: box.x + box.w, y }],
          colorFor(lam, 0.28), 1, [3, 5]
        );
        const x = fx(geo.impactParameter);
        strokePath(ctx, [{ x, y: box.y + box.h }, { x, y }], colorFor(lam, 0.22), 1, [3, 5]);
        ctx.fillStyle = colorFor(lam, 0.95);
        ctx.beginPath();
        ctx.arc(x, y, 3.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const c of curves) {
      const pts = [];
      for (let i = 0; i < c.b.length; i++) pts.push({ x: fx(c.b[i]), y: fy(c.vals[i]) });
      strokePath(ctx, pts, colorFor(c.lam, c.k === 1 ? 0.95 : 0.7),
        c.k === 1 ? 2 : 1.5, c.k === 2 ? [6, 3] : c.k >= 3 ? [2, 3] : null);
    }

    // label each extremum once (using the longest wavelength present)
    const lamLabel = lambdas.includes(650) ? 650 : lambdas[0];
    for (const k of orders) {
      if (k < 1) continue;
      const geo = O.rainbowGeometry(idx(lamLabel), k);
      if (!geo) continue;
      const v =
        state.angleMode === 'deviation'
          ? geo.deviationDeg
          : state.angleMode === 'scattering'
          ? geo.scatteringDeg
          : geo.antisolarDeg;
      if (v < lo || v > hi) continue;
      label(ctx, `k=${k} · ${t('extremumLabel')} ${deg(v, 2)}`, fx(geo.impactParameter) + 8, fy(v) - 14, {
        color: colorFor(lamLabel), font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }

    // the moving marker for the ray currently in the droplet
    const bNow = Math.abs(state.impact);
    const x = fx(bNow);
    strokePath(ctx, [{ x, y: box.y }, { x, y: box.y + box.h }], 'rgba(255,255,255,0.4)', 1);
    for (const c of curves) {
      const v = O.angleFor(c.n, c.k, bNow, state.angleMode);
      if (v === null || v < lo || v > hi) continue;
      ctx.fillStyle = colorFor(c.lam);
      ctx.beginPath();
      ctx.arc(x, fy(v), 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    label(ctx, `b/R = ${num(bNow, 3)}`, x, box.y + 10, { align: 'center', color: '#e8eefc' });
  }

  /* ------------------------------------------------- angular distribution */

  function drawDist(ctx, w, h) {
    if (accum.key !== accumKey()) resetAccum();
    const [lo, hi] = distRange();
    const bw = (hi - lo) / BINS;

    // radiance = energy per bin divided by the solid angle of the annulus
    let peak = 0;
    const shown = [];
    for (const [lam, arr] of accum.data) {
      const rad = new Float64Array(BINS);
      for (let i = 0; i < BINS; i++) {
        const phiMid = (lo + (i + 0.5) * bw) * O.RAD;
        rad[i] = arr[i] / Math.max(Math.sin(phiMid), 0.02);
        if (rad[i] > peak) peak = rad[i];
      }
      shown.push({ lam, rad });
    }
    if (peak <= 0) peak = 1;

    const fx = (a) => box.x + ((a - lo) / (hi - lo)) * box.w;
    const fy = (v) => box.y + box.h - (v / peak) * box.h * 0.92;
    frame(ctx, t('axisAngleAntisolar'), t('axisRayCount'),
      niceTicks(lo, hi, 7), [], fx, fy);

    for (const { lam, rad } of shown) {
      const pts = [];
      for (let i = 0; i < BINS; i++) pts.push({ x: fx(lo + (i + 0.5) * bw), y: fy(rad[i]) });
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(box.x, box.y + box.h);
      for (const p of pts) ctx.lineTo(p.x, p.y);
      ctx.lineTo(box.x + box.w, box.y + box.h);
      ctx.closePath();
      ctx.fillStyle = colorFor(lam, shown.length > 1 ? 0.3 : 0.35);
      ctx.fill();
      ctx.restore();
      strokePath(ctx, pts, colorFor(lam, 0.9), 1.2);
    }

    // where the engine says the extremum is
    const idx = indexModel();
    for (const k of activeOrders()) {
      if (k < 1) continue;
      for (const lam of activeLambdas()) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo || geo.antisolarDeg < lo || geo.antisolarDeg > hi) continue;
        const x = fx(geo.antisolarDeg);
        strokePath(ctx, [{ x, y: box.y }, { x, y: box.y + box.h }], colorFor(lam, 0.35), 1, [4, 4]);
      }
    }

    label(ctx, `${t('rayCount')}: ${formatCount(accum.count)}`, box.x + box.w - 8, box.y + 12, {
      align: 'right', color: '#e8eefc',
    });
    const peakDeg = peakAngle(shown, lo, bw);
    if (peakDeg !== null) {
      label(ctx, `${t('extremumLabel')} ${deg(peakDeg, 2)}`, fx(peakDeg), box.y + 30, {
        align: 'center', color: '#6fd3a4',
      });
    }
  }

  function peakAngle(shown, lo, bw) {
    let best = -1;
    let bi = -1;
    for (const { rad } of shown) {
      for (let i = 0; i < rad.length; i++) {
        if (rad[i] > best) {
          best = rad[i];
          bi = i;
        }
      }
    }
    return bi < 0 || best <= 0 ? null : lo + (bi + 0.5) * bw;
  }

  function formatCount(c) {
    if (c >= 1000000) return `${num(c / 1000000, 1)}M`;
    if (c >= 1000) return `${num(c / 1000, c >= 10000 ? 0 : 1)}k`;
    return String(c);
  }

  /* --------------------------------------------------------- interaction */

  canvas.addEventListener('pointerdown', (e) => {
    if (state.graph !== 'exit' || !box || !exitMap) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const b = O.clamp((x - box.x) / box.w, 0, 0.999);
    set({ impact: b });
  });
  canvas.addEventListener('pointermove', (e) => {
    if (state.graph !== 'exit' || !box) return;
    canvas.style.cursor = e.offsetX > box.x && e.offsetX < box.x + box.w ? 'ew-resize' : 'default';
  });

  /** Called every animation frame by the app while the dist plot is visible. */
  function tick() {
    if (state.graph !== 'dist') return false;
    return stepAccum();
  }

  return { draw, tick, reset: resetAccum };
}

/* ============ src/dropsView.js ============ */

/**
 * dropsView.js -- Mode B: from one droplet to thousands.
 *
 * A vertical cross-section through the observer, containing the antisolar
 * direction and the vertical. Each droplet is tested for one thing only:
 * does the observer see it at the angle phi at which that droplet sends out
 * its concentrated light? Distance never enters the test -- which is exactly
 * the point the brief asks us to make.
 */





const MAX_DRAWN_RAYS = 34;

function createDropsView(canvas) {
  let drops = [];
  let seedKey = '';
  let layout = null;

  function makeKey() {
    return `${state.dropCount}|${state.show.rainBelow}`;
  }

  function regenerate() {
    const target = state.dropCount;
    if (drops.length > target) drops.length = target;
    while (drops.length < target) {
      // spread in depth and height; log-ish depth so near and far are both seen
      const depth = 0.12 + Math.pow(Math.random(), 0.6) * 0.88;
      const spread = state.show.rainBelow ? 1 : 0.62;
      const height = (Math.random() * 2 - 1) * spread;
      drops.push({ x: depth, y: height * depth * 1.25 });
    }
    seedKey = makeKey();
  }

  /** Bow bands, derived from the engine, as [{k, lo, hi}] in degrees. */
  function bands() {
    const idx = indexModel();
    const out = [];
    for (const k of [1, 2]) {
      if (k === 1 && !state.show.primary) continue;
      if (k === 2 && !state.show.secondary) continue;
      const angles = O.NAMED_COLORS.map((c) => ({
        lambda: c.lambda,
        phi: O.rainbowGeometry(idx(c.lambda), k).antisolarDeg,
      }));
      const lo = Math.min(...angles.map((a) => a.phi));
      const hi = Math.max(...angles.map((a) => a.phi));
      out.push({ k, lo, hi, angles });
    }
    return out;
  }

  /** Which wavelength (if any) does a droplet seen at angle phi deliver? */
  function colorAt(phi, bs) {
    let best = null;
    for (const band of bs) {
      for (const a of band.angles) {
        const d = Math.abs(a.phi - phi);
        if (d < 0.45 && (!best || d < best.d)) best = { d, lambda: a.lambda, k: band.k };
      }
    }
    return best;
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    if (seedKey !== makeKey()) regenerate();

    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#070a12');
    g.addColorStop(1, '#0c1120');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const ox = w * 0.1;
    const oy = h * 0.52;
    const s = Math.min(w * 0.82, h * 1.25);
    layout = { ox, oy, s };
    const P = (p) => ({ x: ox + p.x * s, y: oy - p.y * s });

    const alpha = state.sunElevation;
    const anti = { x: Math.cos(alpha * O.RAD), y: -Math.sin(alpha * O.RAD) };
    const sun = { x: -anti.x, y: -anti.y };
    const bs = bands();

    // antisolar axis
    strokePath(ctx, [P({ x: 0, y: 0 }), P({ x: anti.x * 1.35, y: anti.y * 1.35 })],
      'rgba(150,170,210,0.35)', 1, [5, 5]);
    if (state.show.labels) {
      const e = P({ x: anti.x * 1.2, y: anti.y * 1.2 });
      label(ctx, t('antisolarPoint'), e.x, e.y - 12, { align: 'center', color: '#9fb4d8' });
    }

    // the two directions that can deliver bow light, in this cross-section
    for (const band of bs) {
      for (const sign of [1, -1]) {
        for (const edge of [band.lo, band.hi]) {
          const a = (alpha * -1 + sign * edge) * O.RAD;
          const d = { x: Math.cos(a) * (sign > 0 ? 1 : 1), y: Math.sin(a) };
          const dir = rotate(anti, sign * edge * O.RAD);
          strokePath(ctx, [P({ x: 0, y: 0 }), P({ x: dir.x * 1.35, y: dir.y * 1.35 })],
            band.k === 1 ? 'rgba(111,211,164,0.22)' : 'rgba(155,140,240,0.2)', 1,
            band.k === 1 ? [3, 4] : [2, 5]);
        }
      }
    }

    // ground
    if (state.show.ground) {
      const gy = groundY();
      const yy = P({ x: 0, y: gy }).y;
      const gg = ctx.createLinearGradient(0, yy, 0, h);
      gg.addColorStop(0, 'rgba(30,45,35,0.85)');
      gg.addColorStop(1, 'rgba(12,18,16,0.95)');
      ctx.fillStyle = gg;
      ctx.fillRect(0, yy, w, h - yy);
      strokePath(ctx, [{ x: 0, y: yy }, { x: w, y: yy }], 'rgba(120,170,140,0.45)', 1.2);
      if (state.show.labels) label(ctx, t('horizon'), w - 12, yy - 12, { align: 'right', color: '#9ec9ab' });
    }

    // droplets. The non-contributing ones are by far the most numerous, so
    // they go into a single path and a single fill() -- one fill per droplet
    // is what makes ten thousand of them slow.
    let contributing = 0;
    let drawnRays = 0;
    const dotR = state.dropCount > 3000 ? 0.7 : state.dropCount > 600 ? 1.1 : state.dropCount > 60 ? 1.8 : 3;
    const greyPath = new Path2D();
    let greyCount = 0;
    for (const d of drops) {
      const len = Math.hypot(d.x, d.y);
      if (len < 1e-6) continue;
      const dir = { x: d.x / len, y: d.y / len };
      const phi = Math.acos(O.clamp(dir.x * anti.x + dir.y * anti.y, -1, 1)) * O.DEG;
      const hitc = colorAt(phi, bs);
      const q = P(d);
      if (q.x < -20 || q.x > w + 20 || q.y < -20 || q.y > h + 20) continue;

      if (hitc) {
        contributing++;
        ctx.fillStyle = colorFor(hitc.lambda, 0.95);
        ctx.beginPath();
        ctx.arc(q.x, q.y, dotR + 1.2, 0, Math.PI * 2);
        ctx.fill();
        if (drawnRays < MAX_DRAWN_RAYS && state.show.droplets) {
          drawnRays++;
          // incoming sunlight
          const back = { x: d.x - sun.x * 0.22, y: d.y - sun.y * 0.22 };
          strokePath(ctx, [P(back), q], 'rgba(255,246,214,0.5)', 1);
          // the ray that actually reaches the eye
          strokePath(ctx, [q, P({ x: 0, y: 0 })], colorFor(hitc.lambda, 0.6), 1);
        }
      } else if (state.show.droplets) {
        greyPath.moveTo(q.x + dotR, q.y);
        greyPath.arc(q.x, q.y, dotR, 0, Math.PI * 2);
        greyCount++;
      }
    }
    if (greyCount) {
      ctx.fillStyle = 'rgba(150,175,215,0.24)';
      ctx.fill(greyPath);
    }

    // observer
    const o = P({ x: 0, y: 0 });
    ctx.save();
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath();
    ctx.arc(o.x, o.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,238,252,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    if (state.show.labels) label(ctx, t('observerLabel'), o.x, o.y + 22, { align: 'center', color: '#e8eefc' });

    // sun, behind the observer
    const sp = P({ x: sun.x * 0.55, y: sun.y * 0.55 });
    const sg = ctx.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, 22);
    sg.addColorStop(0, 'rgba(255,238,180,0.9)');
    sg.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 5, 0, Math.PI * 2);
    ctx.fill();
    if (state.show.labels) label(ctx, t('sunLabel'), sp.x, sp.y - 26, { align: 'center', color: '#ffe9a8' });

    // readout
    label(ctx, `${t('dropCount')}: ${fmt(drops.length)}`, 12, 16, { color: '#cfe0ff' });
    label(ctx, `${t('dropsContributing')}: ${fmt(contributing)}`, 12, 36, { color: '#6fd3a4' });
    if (state.show.labels) {
      const hint = t('dropsHint');
      label(ctx, hint, 12, h - 14, { color: '#8ea3c6', font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif' });
    }
  }

  function groundY() {
    // observer height in metres mapped onto the scene, purely for legibility
    const hm = state.observerHeight;
    return -Math.min(0.55, 0.06 + Math.log10(1 + hm) * 0.16);
  }

  function fmt(n) {
    return n >= 1000 ? `${num(n / 1000, n >= 10000 ? 0 : 1)}k` : String(n);
  }

  /** Grow the droplet field towards the target while animating. */
  function tick() {
    if (state.scene !== 'drops' || !state.dropsAnimate) return false;
    if (drops.length >= state.dropCount) return false;
    const add = Math.max(1, Math.ceil(drops.length * 0.25));
    const target = Math.min(state.dropCount, drops.length + add);
    while (drops.length < target) {
      const depth = 0.12 + Math.pow(Math.random(), 0.6) * 0.88;
      const spread = state.show.rainBelow ? 1 : 0.62;
      drops.push({ x: depth, y: (Math.random() * 2 - 1) * spread * depth * 1.25 });
    }
    seedKey = makeKey();
    return true;
  }

  function reset() {
    drops = [];
    seedKey = '';
  }

  canvas.addEventListener('pointerdown', () => set({ panel: 'guide' }));

  return { draw, tick, reset };
}

function rotate(v, a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
}

/* ============ src/skyView.js ============ */

/**
 * skyView.js -- Mode C: the 3-D geometry.
 *
 * The observer sits at the origin. Every direction is a unit vector, so the
 * "sky" is the unit sphere and the bow is literally the set of directions at
 * angle phi from the antisolar direction. The ground is a plane below the
 * observer, which is what produces the horizon -- the arc is never drawn as
 * an arc, it is a circle with part of it cut away.
 *
 * A small hand-written perspective camera keeps the whole app dependency-free.
 */





const NEAR = 0.02;

/* ------------------------------------------------------------- camera ---- */

function makeCamera(eye, forward, fovDeg, w, h) {
  const zA = O.vnorm(O.vneg(forward));
  let upHint = O.vec(0, 1, 0);
  if (Math.abs(O.vdot(zA, upHint)) > 0.999) upHint = O.vec(0, 0, 1);
  const xA = O.vnorm(O.vcross(upHint, zA));
  const yA = O.vcross(zA, xA);
  const f = 1 / Math.tan((fovDeg * O.RAD) / 2);
  const scale = (h / 2) * f;
  return {
    eye,
    project(p) {
      const d = O.vsub(p, eye);
      const cx = O.vdot(d, xA);
      const cy = O.vdot(d, yA);
      const cz = -O.vdot(d, zA);
      return { x: w / 2 + (cx / cz) * scale, y: h / 2 - (cy / cz) * scale, z: cz };
    },
    /** Camera-space depth only, used for near-plane clipping. */
    depth(p) {
      return -O.vdot(O.vsub(p, eye), zA);
    },
  };
}

/** Project a world polyline, splitting it wherever it crosses the near plane. */
function clipPolyline(cam, pts) {
  const out = [];
  let run = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const z = cam.depth(p);
    if (z > NEAR) {
      run.push(cam.project(p));
    } else {
      if (run.length > 1) out.push(run);
      run = [];
      // enter/exit points keep the line touching the edge instead of jumping
      const prev = pts[i - 1];
      if (prev && cam.depth(prev) > NEAR) {
        run.push(cam.project(lerpToNear(cam, prev, p)));
        out.push(run);
        run = [];
      }
      const next = pts[i + 1];
      if (next && cam.depth(next) > NEAR) run.push(cam.project(lerpToNear(cam, next, p)));
    }
  }
  if (run.length > 1) out.push(run);
  return out;
}

function lerpToNear(cam, inside, outside) {
  const zi = cam.depth(inside);
  const zo = cam.depth(outside);
  const tt = (zi - NEAR) / (zi - zo);
  return O.vadd(inside, O.vmul(O.vsub(outside, inside), Math.max(0, Math.min(1, tt))));
}

/* --------------------------------------------------- cached bow profile -- */

let profileCache = { key: '', profile: null };

function bowProfile() {
  const key = `${state.dispersion}|${state.indexMode}|${state.indexScale}|${state.show.primary}|${state.show.secondary}|${state.show.higher}`;
  if (profileCache.key === key) return profileCache.profile;
  const orders = [];
  if (state.show.primary) orders.push(1);
  if (state.show.secondary) orders.push(2);
  const profile = orders.length
    ? O.spectralProfile({
        indexModel: indexModel(),
        orders,
        minDeg: 34,
        maxDeg: 60,
        bins: 260,
        rays: 5000,
      })
    : null;
  profileCache = { key, profile };
  return profile;
}

/* ------------------------------------------------------------- the view -- */

function createSkyView(canvas) {
  let cam = null;
  let size = { w: 0, h: 0 };

  function groundDepth() {
    // observer height, compressed logarithmically so 1.7 m and 1000 m both fit
    return Math.min(0.62, 0.05 + Math.log10(1 + state.observerHeight) * 0.16);
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    size = { w, h };
    ctx.clearRect(0, 0, w, h);

    const anti = O.antisolarDirection(state.sunElevation, state.sunAzimuth);
    const sun = O.sunDirection(state.sunElevation, state.sunAzimuth);
    const gh = groundDepth();
    const dip = O.horizonDipDeg(state.observerHeight);

    if (state.view === 'eye') {
      const az = state.sunAzimuth + 180 + state.eyeAzimuth;
      const fwd = O.sunDirection(state.eyeElevation, az);
      cam = makeCamera(O.vec(0, 0, 0), fwd, state.fov, w, h);
      drawSkyBackdrop(ctx, w, h, sun);
    } else {
      const eye = O.vmul(O.sunDirection(state.camPitch, state.camYaw), state.camDist);
      const target = O.vmul(anti, 0.33);
      cam = makeCamera(eye, O.vnorm(O.vsub(target, eye)), 42, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#070a12');
      g.addColorStop(1, '#0c1020');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    if (state.show.ground) drawGround(ctx, gh, w, h);
    if (state.show.horizon) drawHorizon(ctx, dip);
    if (state.show.sky && state.view === 'orbit') drawSphereGuides(ctx);

    if (state.show.renderedBow) drawRenderedBow(ctx, anti, dip);
    drawBowCircles(ctx, anti, dip);
    if (state.show.alexander) drawAlexander(ctx, anti, dip);
    if (state.show.cone) drawCone(ctx, anti);

    drawSunAndAntisolar(ctx, sun, anti, w, h);
    if (state.view === 'orbit') drawObserver(ctx);
    drawReadout(ctx, w, h, dip);
  }

  /* ------------------------------------------------------------ elements */

  function visibleDir(d, dip) {
    if (state.show.rainBelow) return true;
    if (!state.show.horizon && !state.show.ground) return true;
    return Math.asin(O.clamp(d.y, -1, 1)) * O.DEG > -dip;
  }

  function drawSkyBackdrop(ctx, w, h, sun) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0a1730');
    g.addColorStop(0.55, '#12294d');
    g.addColorStop(1, '#1d3a63');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function drawGround(ctx, gh, w, h) {
    const y0 = -gh;
    const isEye = state.view === 'eye';
    if (isEye) {
      // fill everything below the projected horizon line
      const horizonY = horizonScreenY();
      if (horizonY !== null && horizonY < h) {
        const g = ctx.createLinearGradient(0, horizonY, 0, h);
        g.addColorStop(0, 'rgba(26,42,32,0.98)');
        g.addColorStop(1, 'rgba(8,14,11,1)');
        ctx.fillStyle = g;
        ctx.fillRect(0, Math.max(0, horizonY), w, h - Math.max(0, horizonY));
      }
    }
    const col = state.show.rainBelow ? 'rgba(120,170,140,0.16)' : 'rgba(120,170,140,0.3)';
    for (let r = 0.5; r <= 6.001; r += 0.5) {
      const pts = [];
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2;
        pts.push(O.vec(Math.cos(a) * r, y0, Math.sin(a) * r));
      }
      for (const run of clipPolyline(cam, pts)) strokePath(ctx, run, col, r % 2 === 0 ? 0.9 : 0.5);
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const pts = [
        O.vec(0, y0, 0),
        O.vec(Math.cos(a) * 6, y0, Math.sin(a) * 6),
      ];
      for (const run of clipPolyline(cam, pts)) strokePath(ctx, run, col, 0.5);
    }
  }

  function horizonScreenY() {
    // the horizon in eye view: direction with elevation -dip, straight ahead
    const az = state.sunAzimuth + 180 + state.eyeAzimuth;
    const d = O.sunDirection(-O.horizonDipDeg(state.observerHeight), az);
    const p = cam.project(O.vmul(d, 50));
    return cam.depth(O.vmul(d, 50)) > NEAR ? p.y : null;
  }

  function drawHorizon(ctx, dip) {
    const pts = [];
    for (let i = 0; i <= 180; i++) {
      const a = (i / 180) * Math.PI * 2;
      const el = -dip * O.RAD;
      pts.push(O.vec(Math.cos(el) * Math.cos(a), Math.sin(el), Math.cos(el) * Math.sin(a)));
    }
    for (const run of clipPolyline(cam, pts)) {
      strokePath(ctx, run, 'rgba(150,200,170,0.55)', 1.3, [7, 4]);
    }
  }

  function drawSphereGuides(ctx) {
    for (const el of [30, 60]) {
      const pts = [];
      for (let i = 0; i <= 120; i++) {
        const a = (i / 120) * Math.PI * 2;
        const e = el * O.RAD;
        pts.push(O.vec(Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a)));
      }
      for (const run of clipPolyline(cam, pts)) {
        strokePath(ctx, run, 'rgba(120,150,200,0.13)', 0.8);
      }
    }
  }

  function drawCone(ctx, anti) {
    const idx = indexModel();
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    if (state.show.higher) orders.push(3);
    for (const k of orders) {
      const geo = O.rainbowGeometry(idx(state.wavelength === 'white' ? 650 : state.wavelength), k);
      if (!geo) continue;
      const col = k === 1 ? 'rgba(111,211,164,0.5)' : k === 2 ? 'rgba(155,140,240,0.45)' : 'rgba(240,136,93,0.35)';
      const dash = k === 1 ? null : k === 2 ? [6, 4] : [2, 4];
      const circle = O.rainbowCircle(anti, geo.antisolarDeg, 128);
      for (let i = 0; i < circle.length - 1; i += 8) {
        const seg = [O.vec(0, 0, 0), circle[i]];
        for (const run of clipPolyline(cam, seg)) strokePath(ctx, run, col, 0.7, dash);
      }
      for (const run of clipPolyline(cam, circle)) strokePath(ctx, run, col, 1.1, dash);
      // the cone axis
      for (const run of clipPolyline(cam, [O.vec(0, 0, 0), O.vmul(anti, 1.15)])) {
        strokePath(ctx, run, 'rgba(160,180,220,0.5)', 1, [4, 4]);
      }
    }
  }

  function drawBowCircles(ctx, anti, dip) {
    const idx = indexModel();
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    if (state.show.higher) orders.push(3);
    const lambdas =
      state.wavelength === 'white' ? O.NAMED_COLORS.map((c) => c.lambda) : [state.wavelength];

    for (const k of orders) {
      for (const lam of lambdas) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const circle = O.rainbowCircle(anti, geo.antisolarDeg, 220);
        // split into runs of visible directions, so the horizon does the cutting
        let run = [];
        const runs = [];
        for (const d of circle) {
          if (visibleDir(d, dip)) run.push(d);
          else {
            if (run.length > 1) runs.push(run);
            run = [];
          }
        }
        if (run.length > 1) runs.push(run);
        for (const r of runs) {
          for (const seg of clipPolyline(cam, r)) {
            strokePath(ctx, seg, colorFor(lam, k === 1 ? 0.95 : 0.7), k === 1 ? 2 : 1.4);
          }
        }
      }
    }

    if (state.show.wavelengthLabels && orders.length) {
      for (const k of orders) {
        const lam = lambdas[0];
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const top = topOfBow(anti, geo.antisolarDeg);
        if (top && cam.depth(top) > NEAR) {
          const p = cam.project(top);
          label(ctx, `k=${k} · φ=${deg(geo.antisolarDeg, 2)}`, p.x, p.y - 14, {
            align: 'center', color: colorFor(lam),
          });
        }
      }
    }
  }

  function topOfBow(anti, phiDeg) {
    let best = null;
    for (const d of O.rainbowCircle(anti, phiDeg, 128)) {
      if (!best || d.y > best.y) best = d;
    }
    return best;
  }

  function drawAlexander(ctx, anti, dip) {
    if (!state.show.primary || !state.show.secondary) return;
    const band = O.alexandersBand(indexModel());
    if (!(band.outerDeg > band.innerDeg)) return;
    const steps = 8;
    for (let i = 0; i <= steps; i++) {
      const phi = band.innerDeg + ((band.outerDeg - band.innerDeg) * i) / steps;
      const circle = O.rainbowCircle(anti, phi, 160).filter((d) => visibleDir(d, dip));
      if (circle.length < 2) continue;
      for (const seg of clipPolyline(cam, circle)) {
        strokePath(ctx, seg, 'rgba(0,0,0,0.22)', 6);
      }
    }
  }

  function drawRenderedBow(ctx, anti, dip) {
    const prof = bowProfile();
    if (!prof) return;
    const maxR = prof.maxRadiance || 1;
    for (let i = 0; i < prof.bins; i++) {
      const c = prof.rgb[i];
      const m = Math.max(c.r, c.g, c.b) / maxR;
      if (m < 0.012) continue;
      const gain = Math.pow(m, 0.55);
      const col = `rgba(${Math.round((255 * c.r) / Math.max(c.r, c.g, c.b, 1e-9))},${Math.round(
        (255 * c.g) / Math.max(c.r, c.g, c.b, 1e-9)
      )},${Math.round((255 * c.b) / Math.max(c.r, c.g, c.b, 1e-9))},${(gain * 0.85).toFixed(3)})`;
      const circle = O.rainbowCircle(anti, prof.phi[i], 150);
      let run = [];
      const runs = [];
      for (const d of circle) {
        if (visibleDir(d, dip)) run.push(d);
        else {
          if (run.length > 1) runs.push(run);
          run = [];
        }
      }
      if (run.length > 1) runs.push(run);
      for (const r of runs) {
        for (const seg of clipPolyline(cam, r)) strokePath(ctx, seg, col, 3.2);
      }
    }
  }

  function drawSunAndAntisolar(ctx, sun, anti, w, h) {
    const sp = O.vmul(sun, 1.25);
    if (cam.depth(sp) > NEAR) {
      const p = cam.project(sp);
      const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, 26);
      g.addColorStop(0, 'rgba(255,240,190,0.95)');
      g.addColorStop(1, 'rgba(255,215,110,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff2c4';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      if (state.show.labels) {
        label(ctx, `${t('sunLabel')} · ${deg(state.sunElevation, 0)}`, p.x, p.y - 30, {
          align: 'center', color: '#ffe9a8',
        });
      }
    }
    if (state.show.antisolar) {
      const ap = O.vmul(anti, 1.0);
      if (cam.depth(ap) > NEAR) {
        const p = cam.project(ap);
        ctx.strokeStyle = '#8fd7ff';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x - 11, p.y);
        ctx.lineTo(p.x + 11, p.y);
        ctx.moveTo(p.x, p.y - 11);
        ctx.lineTo(p.x, p.y + 11);
        ctx.stroke();
        if (state.show.labels) {
          label(ctx, t('antisolarLabelLong'), p.x, p.y + 24, { align: 'center', color: '#8fd7ff' });
        }
      }
    }
  }

  function drawObserver(ctx) {
    const p = cam.project(O.vec(0, 0, 0));
    if (cam.depth(O.vec(0, 0, 0)) <= NEAR) return;
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    if (state.show.labels) {
      label(ctx, `${t('observerLabel')} · ${num(state.observerHeight, state.observerHeight < 10 ? 1 : 0)} ${t('metres')}`,
        p.x, p.y + 18, { align: 'center', color: '#e8eefc' });
    }
  }

  function drawReadout(ctx, w, h, dip) {
    const idx = indexModel();
    const geo = O.rainbowGeometry(idx(650), 1);
    const vis = O.visibleFraction(state.sunElevation, geo.antisolarDeg, dip);
    let y = 16;
    const put = (s, color) => {
      label(ctx, s, 12, y, { color });
      y += 19;
    };
    put(`${t('coneAngle')} (k=1): ${deg(geo.antisolarDeg, 2)} — ${t('derivedFromSim')}`, '#6fd3a4');
    if (state.show.secondary) {
      put(`${t('coneAngle')} (k=2): ${deg(O.rainbowGeometry(idx(650), 2).antisolarDeg, 2)}`, '#9b8cf0');
    }
    put(`${t('bowTopElevation')}: ${deg(vis.topElevationDeg, 1)}`, '#cfe0ff');
    put(`${t('visibleAbove')}: ${num(vis.fraction * 100, 0)} %`, '#cfe0ff');
    put(`${t('horizonDip')}: ${deg(dip, 3)}`, '#8ea3c6');
    if (vis.fraction <= 0) {
      label(ctx, t('bowBelowHorizon'), 12, y + 4, { color: '#ff9a8a' });
    }
  }

  /* --------------------------------------------------------- interaction */

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    if (state.view === 'orbit') {
      set({
        camYaw: state.camYaw + dx * 0.4,
        camPitch: O.clamp(state.camPitch + dy * 0.3, -85, 85),
      });
    } else {
      set({
        eyeAzimuth: state.eyeAzimuth - dx * 0.15,
        eyeElevation: O.clamp(state.eyeElevation + dy * 0.12, -60, 85),
      });
    }
  });
  const stop = () => {
    drag = null;
    canvas.style.cursor = 'grab';
  };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      if (state.view === 'orbit') {
        set({ camDist: O.clamp(state.camDist * (1 + Math.sign(e.deltaY) * 0.08), 1.2, 9) });
      } else {
        set({ fov: O.clamp(state.fov + Math.sign(e.deltaY) * 3, 25, 120) });
      }
    },
    { passive: false }
  );
  canvas.style.cursor = 'grab';

  return { draw, tick: () => false, reset: () => { profileCache = { key: '', profile: null }; } };
}

function applyStep(i) {
  const s = TUTORIAL[i];
  if (!s) return;
  set({ ...s.apply, step: i });
}

function renderTutorial() {
  const s = TUTORIAL[state.step];
  const nodes = [
    el('div', { class: 'step-counter' }, `${t('step')} ${state.step + 1} ${t('of')} ${TUTORIAL.length}`),
    el('h2', {}, t(s.title)),
    el('p', {}, t(s.body)),
  ];
  if (s.actions) {
    nodes.push(
      el('div', { class: 'action-row' },
        s.actions.map((a) =>
          el('button', { class: 'chip', type: 'button', onclick: () => set(a.patch) },
            a.labelKey ? t(a.labelKey) : a.label)
        ))
    );
  }
  if (s.showRay) nodes.push(...rayInfoNodes({ compact: true }));
  if (s.note) nodes.push(el('p', { class: 'note' }, t(s.note)));

  nodes.push(
    el('div', { class: 'step-nav' },
      el('button', {
        class: 'btn', type: 'button', disabled: state.step === 0,
        onclick: () => applyStep(state.step - 1),
      }, t('prev')),
      el('button', {
        class: 'btn primary', type: 'button',
        onclick: () => {
          if (state.step < TUTORIAL.length - 1) applyStep(state.step + 1);
          else set({ mode: 'free' });
        },
      }, state.step < TUTORIAL.length - 1 ? t('next') : t('startFree'))
    ),
    el('div', { class: 'progress' },
      TUTORIAL.map((_, i) =>
        el('button', {
          class: 'dot' + (i === state.step ? ' on' : '') + (i < state.step ? ' done' : ''),
          type: 'button', title: `${t('step')} ${i + 1}`, onclick: () => applyStep(i),
        })
      ))
  );
  return nodes;
}

function renderFreeGuide() {
  const idx = indexModel();
  const p = O.rainbowGeometry(idx(650), 1);
  const s = O.rainbowGeometry(idx(650), 2);
  return [
    el('h2', {}, t('reconstructTitle')),
    el('p', { class: 'chain' }, t('reconstructBody')),

      el('h3', {}, t('notHardCoded')),

}

/* ==========================================================================
 * Ray readout
 * ======================================================================== */

function rayInfoNodes(opts = {}) {
  const idx = indexModel();
  const sel = state.selectedRay;
  const lambda = sel ? sel.lambda : activeLambdas()[0];
  const k = sel ? sel.k : state.reflections;
  const b = sel ? sel.b : state.impact;
  const n = idx(lambda);
  const ray = traceOne(lambda, n, k, Math.abs(b));
  const p = ray.path;
  const cls = p.classification;
  const dist = distanceFromExtremum(ray);

  const nodes = [
    opts.compact ? null : el('h2', {}, t('rayInfo')),
    el('div', { class: 'panel-block' },
      row('infoWavelength', `${lambda} ${t('nm')}`, { color: O.rgbCss(lambda) }),
      row('infoIndex', num(n, 4)),
      row('infoImpact', num(Math.abs(b), 3)),
      row('infoIncidence', p.thetaI === null ? '—' : deg(p.thetaI * O.DEG, 2)),
      row('infoRefraction', p.thetaR === null ? '—' : deg(p.thetaR * O.DEG, 2)),
      row('infoReflections', String(k)),
      row('infoExitAngle', p.antisolar === null ? '—' : deg(p.antisolar * O.DEG, 2)),
      row('infoScattering', p.scattering === null ? '—' : deg(p.scattering * O.DEG, 2)),
      row('infoDeviation', p.deviation === null ? '—' : deg(p.deviation * O.DEG, 2)),
      row('infoIntensity', `${num(p.intensity * 100, 2)} %`),
      dist === null ? null : row('infoDistanceFromBow', `${dist >= 0 ? '+' : ''}${num(dist, 2)}°`)
    ),
    el('div', { class: `classification cls-${cls}` }, t(CLASS_KEY[cls] || 'classNonCaustic')),
  ];
  if (CLASS_EXPLAIN[cls]) nodes.push(el('p', { class: 'note' }, t(CLASS_EXPLAIN[cls])));
  if (cls === 'nonCaustic' && k === 1) {
    nodes.push(el('p', { class: 'note' }, t('explNotOneReflection')));
  }
  if (!opts.compact) nodes.push(el('p', { class: 'hint' }, t('rayInfoHint')));
  return nodes.filter(Boolean);
}

const renderRayInfo = () => rayInfoNodes();

    el('ul', { class: 'conv' },
      el('li', {}, t('mathConvTheta')),
      el('li', {}, t('mathConvThetaR')),
      el('li', {}, t('mathConvD')),
      el('li', {}, t('mathConvTheta2')),
      el('li', {}, t('mathConvPhi'))),
    el('p', { class: 'note warn' }, t('mathWarning')),

    el('h3', {}, t('mathDeviation')),
    el('div', { class: 'formula' }, 'D_k(θᵢ) = 2 (θᵢ − θᵣ) + k (180° − 2 θᵣ)'),
    el('p', { class: 'note' }, t('mathDeviationNote')),

    el('h3', {}, t('mathExtremum')),
    el('div', { class: 'formula' }, 'dD_k/dθᵢ = 2 − 2(k+1) · dθᵣ/dθᵢ = 0'),
    el('p', { class: 'note' }, t('mathExtremumNote')),
    el('div', { class: 'formula' }, 'cos²θᵢ = (n² − 1) / ((k+1)² − 1)'),

    el('h3', {}, t('mathResult')),
    el('div', { class: 'panel-block' },
      row('infoIndex', `${num(n, 4)}  (λ = 650 ${t('nm')})`),
      row('infoReflections', String(k)),
      row('infoIncidence', deg(analytic * O.DEG, 4)),
      row('infoExitAngle', deg(O.rainbowGeometry(n, k).antisolarDeg, 4))),
    el('p', { class: 'note' }, t('mathResultNote')),

    el('h3', {}, t('mathNumericCheck')),
    el('p', { class: 'note' }, t('mathNumericNote')),
    el('div', { class: 'panel-block' },
      row('infoIncidence', `${deg(numeric * O.DEG, 6)}  (Δ = ${num(Math.abs(numeric - analytic) * O.DEG, 6)}°)`)),

    el('h3', {}, t('mathResult')),
    table,

    el('h3', {}, t('mathIntensityTitle')),
    el('p', { class: 'note' }, t('mathIntensityNote')),
    el('h3', {}, t('mathLimits')),
    el('p', { class: 'note' }, t('mathLimitsNote')),
    el('p', { class: 'note' }, t('dropletSizeNote')),
  ];
}

/* ==========================================================================
 * Questions
 * ======================================================================== */

const QUESTIONS = [
  ['q1', 'a1'], ['q2', 'a2'], ['q3', 'a3'], ['q4', 'a4'],
  ['q5', 'a5'], ['q6', 'a6'], ['q7', 'a7'],
];

function renderQuiz() {
  return [
    el('h2', {}, t('quiz')),
    el('p', { class: 'note' }, t('quizIntro')),
    ...QUESTIONS.map(([q, a]) => {
      const answer = el('p', { class: 'answer hidden' }, t(a));
      const btn = el('button', {
        class: 'chip', type: 'button',
        onclick: () => {
          const hidden = answer.classList.toggle('hidden');
          btn.textContent = hidden ? t('showAnswer') : t('hideAnswer');
        },
      }, t('showAnswer'));
      return el('div', { class: 'qa' }, el('h3', {}, t(q)), btn, answer);
    }),
  ];
}

/* ==========================================================================
 * Panel shell
 * ======================================================================== */

function renderPanel(container) {
  container.textContent = '';
  const tabs = segmented(
    [
      { value: 'guide', labelKey: state.mode === 'tutorial' ? 'tutorial' : 'explanation' },
      { value: 'ray', labelKey: 'rayInfo' },
      { value: 'math', labelKey: 'mathematics' },
      { value: 'quiz', labelKey: 'quiz' },
    ],
    state.panel,
    (v) => set({ panel: v }),
    { wrap: true }
  );
  container.append(tabs);

  const body = el('div', { class: 'panel-body' });
  let nodes;
  if (state.panel === 'ray') nodes = renderRayInfo();
  else if (state.panel === 'math') nodes = renderMath();
  else if (state.panel === 'quiz') nodes = renderQuiz();
  else nodes = state.mode === 'tutorial' ? renderTutorial() : renderFreeGuide();
  body.append(...nodes.filter(Boolean));
  container.append(body);
}

/* ============ src/app.js ============ */

/**
 * app.js -- assembly. Builds the shell, the control column and the render
 * loop, and keeps the four views in step with the store.
 */









/* ------------------------------------------------------------ shell DOM -- */

const root = document.getElementById('app');

const sceneCanvases = {
  droplet: el('canvas', { class: 'scene-canvas' }),
  drops: el('canvas', { class: 'scene-canvas' }),
  sky: el('canvas', { class: 'scene-canvas' }),
};
const graphCanvas = el('canvas', { class: 'graph-canvas' });

const controlsEl = el('div', { class: 'controls' });
const panelEl = el('div', { class: 'panel' });
const headerEl = el('header', { class: 'app-header' });
const sceneTabsEl = el('div', { class: 'scene-tabs' });
const sceneDescEl = el('p', { class: 'scene-desc' });
const graphTabsEl = el('div', { class: 'graph-tabs' });

root.append(
  headerEl,
  el(
    'main',
    { class: 'layout' },
    el('aside', { class: 'col col-controls' }, el('h2', { class: 'col-title' }, t('controls')), controlsEl),

      'section',

const views = {
  droplet: createDropletView(sceneCanvases.droplet),
  drops: createDropsView(sceneCanvases.drops),
  sky: createSkyView(sceneCanvases.sky),
};
const graph = createGraphView(graphCanvas);

/* --------------------------------------------------------------- header -- */

function buildHeader() {
  clear(headerEl);
  headerEl.append(
    el(
      'div',
      { class: 'brand' },
      el('h1', {}, t('appTitle')),
      el('span', { class: 'sub' }, t('appSubtitle'))
    ),
    el(
      'div',
      { class: 'header-tools' },
      segmented(
        [
          { value: 'tutorial', labelKey: 'tabTutorial' },

        () => state.mode,
        (v) => {
          if (v === 'tutorial') applyStep(state.step);
          set({ mode: v, panel: 'guide' });
          rebuild();
        }
      ),
      el(
        'div',
        { class: 'lang' },
        LANGS.map((l) =>
          el(
            'button',
            {
              type: 'button',
              class: 'seg' + (getLang() === l ? ' active' : ''),
              onclick: () => {
                setLang(l);
                state.lang = l;
                document.documentElement.lang = l;
                rebuild();
              },
            },

          )

}

/* --------------------------------------------------------------- scenes -- */

function buildSceneTabs() {
  clear(sceneTabsEl);
  sceneTabsEl.append(
    segmented(
      [
        { value: 'droplet', labelKey: 'sceneDroplet' },
        { value: 'drops', labelKey: 'sceneDrops' },
        { value: 'sky', labelKey: 'sceneSky' },
      ],
      () => state.scene,
      (v) => set({ scene: v })
    )
  );
}

function buildGraphTabs() {
  clear(graphTabsEl);
  graphTabsEl.append(
    segmented(
      [
        { value: 'exit', labelKey: 'graphExitAngle' },
        { value: 'dist', labelKey: 'graphDistribution' },
      ],
      () => state.graph,
      (v) => set({ graph: v })
    ),
    el('span', { class: 'graph-title' },
      state.graph === 'exit' ? t('graphExitAngleTitle') : t('graphDistributionTitle')),
    state.graph === 'exit'
      ? select(
          'angleConvention',
          [
            { value: 'antisolar', labelKey: 'angleAntisolar' },
            { value: 'scattering', labelKey: 'angleScattering' },
            { value: 'deviation', labelKey: 'angleDeviation' },
          ],
          () => state.angleMode,
          (v) => set({ angleMode: v })
        )
      : el(
          'div',
          { class: 'inline-ctl' },
          slider({
            labelKey: 'rayCount',
            min: 0, max: 5, step: 0.05,
            get: () => Math.log10(Math.max(1, state.distRays)),
            format: (v) => fmtCount(Math.round(Math.pow(10, v))),
            onInput: (v) => set({ distRays: Math.round(Math.pow(10, v)) }),
          }),
          toggle('accumulate', () => state.distAccumulate, (v) => set({ distAccumulate: v }))
        ),
    el('span', { class: 'graph-hint' }, t('graphHint'))
  );
}

function fmtCount(c) {
  if (c >= 1000000) return `${num(c / 1000000, 1)}M`;
  if (c >= 1000) return `${num(c / 1000, c >= 10000 ? 0 : 1)}k`;
  return String(c);
}

/* ------------------------------------------------------------- controls -- */

const HEIGHT_STOPS = [1.7, 5, 10, 50, 100, 300, 1000, 3000, 10000];

function buildControls() {
  clear(controlsEl);
  const idx = indexModel();

  /* --- light --- */
  const colorOptions = [
    { value: 'white', labelKey: 'white' },
    ...O.NAMED_COLORS.map((c) => ({
      value: c.lambda,
      labelKey: c.id,
      color: O.rgbCss(c.lambda),
    })),
  ];

  const lightGroup = group(
    'light',
    el('div', { class: 'ctl' },
      el('span', { class: 'ctl-label' }, t('wavelength')),
      segmented(colorOptions, () => state.wavelength, (v) =>
        set({ wavelength: v === 'white' ? 'white' : Number(v), selectedRay: null }), { wrap: true })),
    slider({
      labelKey: 'dispersion', min: 0, max: 1, step: 0.01,
      get: () => state.dispersion,
      format: (v) => `${num(v * 100, 0)} %`,
      onInput: (v) => set({ dispersion: v }),
      hintKey: 'dispersionHint',
    })
  );

  /* --- droplet & optics --- */
  const opticsGroup = group(
    'droplet',
    slider({
      labelKey: 'impactParameter', min: -0.999, max: 0.999, step: 0.001,
      get: () => state.impact,
      format: (v) => num(v, 3),
      onInput: (v) => set({ impact: v }),
    }),
    el('div', { class: 'ctl' },
      el('span', { class: 'ctl-label' }, t('reflections')),
      segmented(
        [0, 1, 2, 3, 4].map((k) => ({ value: k, label: String(k) })),
        () => state.reflections,
        (v) => {
          // Solo-select: picking a value here shows exactly that one family,
          // clearing any others left on from the checkboxes below so this
          // control always visibly drives the scene by itself.
          const k = Number(v);
          set({
            reflections: k,
            families: { 0: k === 0, 1: k === 1, 2: k === 2, 3: k >= 3 },
            selectedRay: null,
          });
        }
      )),
    slider({
      labelKey: 'dropletRadius', min: 0.05, max: 5, step: 0.05,
      get: () => state.dropletRadiusMm,
      format: (v) => `${num(v, 2)} mm`,
      onInput: (v) => set({ dropletRadiusMm: v }),
    }),
    el('small', { class: 'ctl-hint block' }, t('dropletSizeNote')),
    select('indexModel',
      [{ value: 'table', labelKey: 'indexTable' }, { value: 'cauchy', labelKey: 'indexCauchy' }],
      () => state.indexMode, (v) => set({ indexMode: v })),
    slider({
      labelKey: 'indexScale', min: 0.85, max: 1.15, step: 0.001,
      get: () => state.indexScale,
      format: (v) => `×${num(v, 3)} → n=${num(idx(650) * 1, 4)}`,
      onInput: (v) => set({ indexScale: v }),
    })
  );

  /* --- rays --- */
  const raysGroup = group(
    'rays',
    toggle('showNonRainbow', () => state.showNonRainbow, (v) => set({ showNonRainbow: v }), { strong: true }),
    el('div', { class: 'ctl' },
      el('span', { class: 'ctl-label' }, t('showFamilies')),
      el('div', { class: 'stack' },
        toggle('family0', () => state.families[0], (v) => set({ families: { 0: v } })),
        toggle('family1', () => state.families[1], (v) => set({ families: { 1: v } })),
        toggle('family2', () => state.families[2], (v) => set({ families: { 2: v } })),
        toggle('family3', () => state.families[3], (v) => set({ families: { 3: v } })))),
    slider({
      labelKey: 'fanCount', min: 0, max: 60, step: 1,
      get: () => state.fanCount,
      format: (v) => (v === 0 ? '1' : String(v)),
      onInput: (v) => set({ fanCount: Math.round(v) }),
    })
  );

  /* --- sun & observer --- */
  const skyGroup = group(
    'sun',
    slider({
      labelKey: 'sunElevation', min: 0, max: 90, step: 0.5,
      get: () => state.sunElevation,
      format: (v) => deg(v, 1),
      onInput: (v) => set({ sunElevation: v }),
    }),
    slider({
      labelKey: 'sunAzimuth', min: 0, max: 360, step: 1,
      get: () => state.sunAzimuth,
      format: (v) => deg(v, 0),
      onInput: (v) => set({ sunAzimuth: v }),
    }),
    slider({
      labelKey: 'observerHeight', min: 0, max: HEIGHT_STOPS.length - 1, step: 0.01,
      get: () => heightToSlider(state.observerHeight),
      format: (v) => `${num(sliderToHeight(v), sliderToHeight(v) < 10 ? 1 : 0)} ${t('metres')}`,
      onInput: (v) => set({ observerHeight: sliderToHeight(v) }),
    }),
    el('small', { class: 'ctl-hint block' }, t('explObserverHeight')),
    el('div', { class: 'ctl' },
      el('span', { class: 'ctl-label' }, t('viewMode')),
      segmented(
        [{ value: 'orbit', labelKey: 'viewOrbit' }, { value: 'eye', labelKey: 'viewEye' }],
        () => state.view,
        (v) => set({ view: v, scene: 'sky' })
      )),
    slider({
      labelKey: 'lookAzimuth', min: -180, max: 180, step: 1,
      get: () => state.eyeAzimuth,
      format: (v) => deg(v, 0),
      onInput: (v) => set({ eyeAzimuth: v }),
    }),
    slider({
      labelKey: 'lookElevation', min: -60, max: 85, step: 1,
      get: () => state.eyeElevation,
      format: (v) => deg(v, 0),
      onInput: (v) => set({ eyeElevation: v }),
    }),
    slider({
      labelKey: 'fieldOfView', min: 25, max: 120, step: 1,
      get: () => state.fov,
      format: (v) => deg(v, 0),
      onInput: (v) => set({ fov: v }),
    }),
    toggle('rainBelow', () => state.show.rainBelow, (v) => set({ show: { rainBelow: v } })),
    el('small', { class: 'ctl-hint block' }, t('fullCircleNote'))
  );

  /* --- droplets scene --- */
  const dropsGroup = group(
    'sceneDrops',
    slider({
      labelKey: 'dropCount', min: 0, max: 4, step: 0.01,
      get: () => Math.log10(Math.max(1, state.dropCount)),
      format: (v) => fmtCount(Math.round(Math.pow(10, v))),
      onInput: (v) => set({ dropCount: Math.round(Math.pow(10, v)) }),
    }),
    toggle('animateDrops', () => state.dropsAnimate, (v) => set({ dropsAnimate: v }))
  );

  /* --- visualisation --- */
  const showToggle = (key, labelKey) =>
    toggle(labelKey, () => state.show[key], (v) => set({ show: { [key]: v } }));

  const visGroup = group(
    'visualization',
    el('div', { class: 'grid2' },
      showToggle('primary', 'showPrimary'),
      showToggle('secondary', 'showSecondary'),
      showToggle('higher', 'showHigherOrder'),
      showToggle('cone', 'showCone'),
      showToggle('antisolar', 'showAntisolar'),
      showToggle('horizon', 'showHorizon'),
      showToggle('ground', 'showGround'),
      showToggle('droplets', 'showDroplets'),
      showToggle('normals', 'showNormals'),
      showToggle('angles', 'showAngles'),
      showToggle('labels', 'showLabels'),
      showToggle('wavelengthLabels', 'showWavelengthLabels'),
      showToggle('alexander', 'showAlexander'),
      showToggle('sky', 'showSky')),
    toggle('showRenderedBow', () => state.show.renderedBow, (v) => set({ show: { renderedBow: v } }), { strong: true }),
    el('small', { class: 'ctl-hint block' }, t('warningNoRender'))
  );

  controlsEl.append(lightGroup, opticsGroup, raysGroup, skyGroup, dropsGroup, visGroup,
    el('button', {
      class: 'btn wide', type: 'button',
      onclick: () => { resetState(); rebuild(); },
    }, t('reset')));

  collectAllSyncers();
}

function heightToSlider(h) {
  let best = 0;
  for (let i = 0; i < HEIGHT_STOPS.length; i++) {
    if (HEIGHT_STOPS[i] <= h) best = i;
  }
  const lo = HEIGHT_STOPS[best];
  const hi = HEIGHT_STOPS[Math.min(best + 1, HEIGHT_STOPS.length - 1)];
  if (hi === lo) return best;
  return best + (Math.log10(h / lo) / Math.log10(hi / lo));
}

function sliderToHeight(v) {
  const i = Math.max(0, Math.min(HEIGHT_STOPS.length - 1, Math.floor(v)));
  const f = v - i;
  const lo = HEIGHT_STOPS[i];
  const hi = HEIGHT_STOPS[Math.min(i + 1, HEIGHT_STOPS.length - 1)];
  return hi === lo ? lo : lo * Math.pow(hi / lo, f);
}

function resetState() {
  set({
    wavelength: 'white', dispersion: 1, impact: 0.861, reflections: 1,
    dropletRadiusMm: 1, indexMode: 'table', indexScale: 1,
    showNonRainbow: false, fanCount: 0, families: { 0: false, 1: true, 2: false, 3: false },
    angleMode: 'antisolar', distRays: 60, distAccumulate: false,
    dropCount: 1, dropsAnimate: false,
    sunElevation: 15, sunAzimuth: 180, observerHeight: 1.7,
    view: 'orbit', camYaw: -35, camPitch: 14, camDist: 3.1,
    eyeAzimuth: 0, eyeElevation: 12, fov: 75, selectedRay: null,
    show: {
      normals: false, angles: true, labels: true, wavelengthLabels: false,
      droplets: true, cone: true, antisolar: true, horizon: true, ground: true,
      renderedBow: false, alexander: true, primary: true, secondary: false,
      higher: false, sky: true, rainBelow: false,
    },
  });
  graph.reset();
  views.drops.reset();
  views.sky.reset();
}

/* ------------------------------------------------------------- rendering -- */

let syncers = [];

/**
 * Every live control lives in one of these four containers. Re-collecting
 * after any of them is rebuilt keeps `syncers` complete -- the scene tabs
 * were missing from this list before, which is why their active highlight
 * used to freeze after the very first switch away from Tutorial mode.
 */
function collectAllSyncers() {
  syncers = [
    ...collectSyncers(sceneTabsEl),
    ...collectSyncers(controlsEl),
    ...collectSyncers(graphTabsEl),
    ...collectSyncers(panelEl),
  ];
}

function rebuild() {
  buildHeader();
  buildSceneTabs();
  buildGraphTabs();
  buildControls();
  renderPanel(panelEl);
  applyVisibility();
  collectAllSyncers();
  trackedGraph = state.graph;
  trackedPanelKey = panelKey();
}

/**
 * Which canvas is shown. Deliberately unconditional and run on every store
 * notification -- it is three cheap classList/textContent writes, so there is
 * no reason to gate it behind a "did something structural change?" check,
 * and every previous attempt at such a check has hidden a real bug behind it.
 */
function applyVisibility() {
  for (const [name, c] of Object.entries(sceneCanvases)) {
    c.classList.toggle('hidden', name !== state.scene);
  }
  sceneDescEl.textContent = t(
    state.scene === 'droplet' ? 'sceneDropletDesc' : state.scene === 'drops' ? 'sceneDropsDesc' : 'sceneSkyDesc'
  );
  document.body.dataset.scene = state.scene;
}

/** Everything renderPanel()'s output depends on, as one comparable string. */
function panelKey() {
  const liveRay = state.panel === 'ray' || (state.mode === 'tutorial' && TUTORIAL[state.step]?.showRay);
  const rayPart = liveRay
    ? (() => {
        const s = state.selectedRay;
        return `${state.impact.toFixed(4)}|${state.reflections}|${state.wavelength}|${state.dispersion}|${s ? `${s.lambda},${s.k},${s.b.toFixed(4)}` : '-'}`;
      })()
    : '';
  const mathPart =
    state.panel === 'math' ? `${state.reflections}|${state.dispersion}|${state.indexMode}|${state.indexScale}` : '';
  const guidePart =
    state.mode === 'free' && state.panel === 'guide'
      ? `${state.dispersion}|${state.indexMode}|${state.indexScale}|${state.show.renderedBow}`
      : '';
  return `${state.panel}|${state.step}|${rayPart}|${mathPart}|${guidePart}`;
}

let trackedGraph = state.graph;
let trackedPanelKey = panelKey();

subscribe(() => {
  applyVisibility();

  if (state.graph !== trackedGraph) {
    trackedGraph = state.graph;
    buildGraphTabs();
    collectAllSyncers();
  }

  const pk = panelKey();
  if (pk !== trackedPanelKey) {
    trackedPanelKey = pk;
    renderPanel(panelEl);
    collectAllSyncers();
  }

  for (const s of syncers) s();
});

function renderOnce() {
  const view = views[state.scene];
  if (view) {
    view.tick();
    view.draw();
  }
  graph.tick();
  graph.draw();
}

function loop() {
  renderOnce();
  requestAnimationFrame(loop);
}

/* --------------------------------------------------------------- startup -- */

function start() {
  setLang(navigator.language && navigator.language.startsWith('en') ? 'en' : 'cs');
  state.lang = getLang();
  document.documentElement.lang = state.lang;
  applyStep(0);
  rebuild();
  window.addEventListener('resize', () => set({}));
  requestAnimationFrame(loop);
}

start();

// exposed for quick console poking / debugging
window.RainbowLab = { state, set, O, TUTORIAL, renderOnce, rebuild, applyStep, views, graph, applyVisibility };
</script>
