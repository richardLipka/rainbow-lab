<style>
/* Rainbow Lab -- an optical bench, not a brochure.
 *
 * One rule organises the whole palette: on this page, saturated colour means
 * a wavelength. So the interface itself contributes nothing saturated -- the
 * chrome is a cool blue-black instrument housing with a single warm brass
 * accent for anything the hand touches, and the spectrum is the only thing
 * allowed to sing.
 *
 * Deliberately single-theme: the ray colours and the night-sky grounds are
 * the subject, and they do not survive a light ground. Every colour is
 * therefore painted explicitly here rather than inherited from the host.
 */

:root {
  /* grounds -- blue-biased, never neutral grey */
  --bg: #060910;
  --bg-panel: #0c111b;
  --bg-raised: #141b28;
  --line: rgba(126, 150, 196, 0.16);
  --line-strong: rgba(126, 150, 196, 0.32);

  /* ink */
  --fg: #dde5f2;
  --fg-dim: #93a3bd;
  --fg-faint: #626f8a;

  /* brass: instrument fittings, and the Sun. The only warm thing on screen,
     reserved for interactive state. */
  --accent: #e0a83f;
  --accent-2: #86c8ee;

  /* semantic -- reflection order, used identically in CSS and on canvas */
  --k1: #6fd3a4;
  --k2: #9b8cf0;
  --k3: #f0885d;
  --warn: var(--k3);
  --violet: var(--k2);

  --radius: 8px;
  --font: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: dark;
}

/* Numbers that sit in columns must not dance as they update. */
.ctl-value,
.row-val,
.math-table,
.classification,
.formula {
  font-variant-numeric: tabular-nums;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;

}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;

}

/* ------------------------------------------------------------------ header */

.app-header {

}

  letter-spacing: 0.06em;
  text-transform: uppercase;

}

.layout {

.controls { padding: 0 12px 16px; }

select {

.lang { display: flex; gap: 3px; }

.btn:hover:not(:disabled) { border-color: var(--accent); }

<script type="module">
/* ============ src/optics.js ============ */

/**
 * optics.js -- pure optical / geometric engine for the rainbow simulation.
 *
 * NO DOM, no globals, no rendering. Everything here is testable in Node.
 *
 * ---------------------------------------------------------------------------
 * ANGLE CONVENTIONS  (mirrored in the "Mathematics" panel of the UI)
 * ---------------------------------------------------------------------------
 * The single most common source of confusion in rainbow geometry is mixing up
 * four different angles. They are defined once here and never mixed:
 *
 *   theta_i  angle of incidence at the first (air -> water) surface, measured
 *            from the surface normal. 0 deg = central ray, 90 deg = grazing.
 *            sin(theta_i) = b / R, where b is the impact parameter.
 *
 *   theta_r  angle of refraction inside the droplet, from the same normal.
 *            n_air * sin(theta_i) = n_water * sin(theta_r).
 *
 *   D        TOTAL DEVIATION: the total angle through which the ray direction
 *            has been turned, accumulated along the whole path and NOT folded
 *            back into [0,180]. For k internal reflections:
 *                D_k(theta_i) = 2*(theta_i - theta_r) + k*(PI - 2*theta_r)
 *            D = 0 for an undeviated ray, ~138 deg for the primary rainbow
 *            ray, ~230 deg for the secondary rainbow ray.
 *
 *   Theta    SCATTERING ANGLE: angle between the outgoing direction and the
 *            original direction of propagation of the sunlight, folded into
 *            [0,180]. Theta = fold(D). Theta = 0 is straight ahead (away from
 *            the Sun); Theta = 180 is straight back towards the Sun.
 *
 *   phi      ANGLE FROM THE ANTISOLAR DIRECTION as seen by the observer:
 *                phi = 180 deg - Theta
 *            This is the angular radius of the bow in the sky.
 *            Primary ~42 deg, secondary ~51 deg.
 *
 * The UI must always state which of these it is plotting.
 * ---------------------------------------------------------------------------
 */

const DEG = 180 / Math.PI;
const RAD = Math.PI / 180;
const EPS = 1e-9;

/* =========================================================================
 * 1. Minimal 3-D vector algebra
 * =======================================================================*/

const vec = (x = 0, y = 0, z = 0) => ({ x, y, z });
const vadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z });
const vsub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z });
const vmul = (a, s) => ({ x: a.x * s, y: a.y * s, z: a.z * s });
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => ({
  x: a.y * b.z - a.z * b.y,
  y: a.z * b.x - a.x * b.z,
  z: a.x * b.y - a.y * b.x,
});
const vlen = (a) => Math.sqrt(vdot(a, a));
const vneg = (a) => ({ x: -a.x, y: -a.y, z: -a.z });
const clamp = (x, lo, hi) => (x < lo ? lo : x > hi ? hi : x);

function vnorm(a) {
  const l = vlen(a);
  if (l < EPS) return vec(0, 0, 0);
  return vmul(a, 1 / l);
}

/** Angle between two vectors, radians, numerically safe. */
function vangle(a, b) {
  return Math.acos(clamp(vdot(vnorm(a), vnorm(b)), -1, 1));
}

/* =========================================================================
 * 2. Refractive index of water
 * =======================================================================*/

/**
 * Reference table of refractive indices. These are approximate values that
 * are entirely adequate for a geometric-optics teaching simulation. They are
 * NOT exact values for all temperatures, pressures and wavelengths.
 * Everything downstream reads through makeIndexModel(), so the table stays
 * configurable.
 */
const NAMED_COLORS = [
  { id: 'red', lambda: 650, n: 1.331 },
  { id: 'orange', lambda: 610, n: 1.333 },
  { id: 'yellow', lambda: 580, n: 1.335 },
  { id: 'green', lambda: 540, n: 1.337 },
  { id: 'blue', lambda: 480, n: 1.340 },
  { id: 'violet', lambda: 420, n: 1.343 },
];

/** Reference wavelength used as the "dispersion switched off" index. */
const LAMBDA_REF = 589;

/** Least-squares fit of  n = A + B / lambda^2  (lambda in micrometres). */
function fitCauchy(table) {
  const xs = table.map((c) => 1 / Math.pow(c.lambda / 1000, 2));
  const ys = table.map((c) => c.n);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length;
  const my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let sxy = 0;
  let sxx = 0;
  for (let i = 0; i < xs.length; i++) {
    sxy += (xs[i] - mx) * (ys[i] - my);
    sxx += (xs[i] - mx) * (xs[i] - mx);
  }
  const B = sxy / sxx;
  return { A: my - B * mx, B };
}

const CAUCHY = fitCauchy(NAMED_COLORS);

/** Continuous Cauchy model; lambda in nanometres. */
function cauchyIndex(lambda, cauchy = CAUCHY) {
  const um = lambda / 1000;
  return cauchy.A + cauchy.B / (um * um);
}

/**
 * Build a refractive-index model.
 *   mode        'table'  -> the six named colours use their tabulated value,
 *                           anything else uses the Cauchy fit
 *               'cauchy' -> everything uses the Cauchy fit
 *   dispersion  0..1     -> blends n(lambda) towards n(LAMBDA_REF). At 0 every
 *                           wavelength shares one index, so no colour
 *                           separation is possible at all.
 *   scale       multiplies the index (advanced "what if" experiment).
 */
function makeIndexModel(opts = {}) {
  const {
    mode = 'table',
    dispersion = 1,
    table = NAMED_COLORS,
    cauchy = CAUCHY,
    scale = 1,
  } = opts;
  const byLambda = new Map(table.map((c) => [c.lambda, c.n]));
  const nRefRaw = cauchyIndex(LAMBDA_REF, cauchy);
  const model = (lambda) => {
    const raw =
      mode === 'table' && byLambda.has(lambda)
        ? byLambda.get(lambda)
        : cauchyIndex(lambda, cauchy);
    return (nRefRaw + dispersion * (raw - nRefRaw)) * scale;
  };
  model.meta = { mode, dispersion, cauchy, scale, nRef: nRefRaw * scale };
  return model;
}

/** Default model: tabulated values, full dispersion. */
const defaultIndex = makeIndexModel();

/* =========================================================================
 * 3. Interface physics: Snell, reflection, Fresnel
 * =======================================================================*/

/**
 * Vector form of Snell's law.
 *   d    unit incident direction
 *   N    unit surface normal oriented so that dot(d, N) < 0
 *   eta  n1 / n2
 * Returns the unit refracted direction, or null on total internal reflection.
 */
function refract(d, N, eta) {
  const cosi = -vdot(d, N);
  const k = 1 - eta * eta * (1 - cosi * cosi);
  if (k < 0) return null;
  return vnorm(vadd(vmul(d, eta), vmul(N, eta * cosi - Math.sqrt(k))));
}

/** Mirror reflection about a surface with unit normal N (either orientation). */
function reflect(d, N) {
  return vnorm(vsub(d, vmul(N, 2 * vdot(d, N))));
}

/** Scalar Snell's law: theta_2 in radians, or null for total reflection. */
function snellAngle(theta1, n1, n2) {
  const s = (n1 / n2) * Math.sin(theta1);
  if (Math.abs(s) > 1) return null;
  return Math.asin(s);
}

/** Critical angle for n1 -> n2, radians, or null when n1 <= n2. */
function criticalAngle(n1, n2) {
  if (n1 <= n2) return null;
  return Math.asin(n2 / n1);
}

/**
 * Unpolarised Fresnel reflectance at an interface. theta1 is the angle of
 * incidence in medium 1. Returns R in [0,1]; returns 1 for total internal
 * reflection.
 */
function fresnelReflectance(theta1, n1, n2) {
  const t2 = snellAngle(theta1, n1, n2);
  if (t2 === null) return 1;
  const c1 = Math.cos(theta1);
  const c2 = Math.cos(t2);
  const rs = (n1 * c1 - n2 * c2) / (n1 * c1 + n2 * c2);
  const rp = (n1 * c2 - n2 * c1) / (n1 * c2 + n2 * c1);
  return clamp(0.5 * (rs * rs + rp * rp), 0, 1);
}

/* =========================================================================
 * 4. Ray / sphere intersection
 * =======================================================================*/

/**
 * Standard quadratic ray-sphere intersection, solved in the numerically
 * stable way (avoids catastrophic cancellation for distant origins).
 * Returns { hit, t0, t1, tangent } with t0 <= t1.
 */
function intersectRaySphere(origin, dir, center, radius, eps = 1e-7) {
  const oc = vsub(origin, center);
  const a = vdot(dir, dir);
  const b = 2 * vdot(oc, dir);
  const c = vdot(oc, oc) - radius * radius;
  const disc = b * b - 4 * a * c;
  if (disc < 0) return { hit: false, tangent: false };
  const sq = Math.sqrt(disc);
  // Tangency must be judged as a LENGTH, not as a value of the discriminant:
  // sq/(2a) is half the chord the ray cuts through the sphere, so comparing it
  // with the radius stays meaningful however far away the ray started.
  if (sq / (2 * a) <= eps * radius) {
    const t = -b / (2 * a);
    return { hit: true, t0: t, t1: t, tangent: true };
  }
  const q = b < 0 ? -0.5 * (b - sq) : -0.5 * (b + sq);
  let t0 = q / a;
  let t1 = c / q;
  if (t0 > t1) {
    const tmp = t0;
    t0 = t1;
    t1 = tmp;
  }
  return { hit: true, t0, t1, tangent: false };
}

/* =========================================================================
 * 5. Ray classification vocabulary
 * =======================================================================*/

const RayClass = {
  MISS: 'miss',
  TANGENT: 'tangent',
  NO_REFLECTION: 'noReflection',
  PRIMARY: 'primary',
  SECONDARY: 'secondary',
  HIGHER_ORDER: 'higherOrder',
  NON_CAUSTIC: 'nonCaustic',
};

/**
 * Angular half-width (degrees) within which a ray counts as belonging to the
 * bright rainbow family, i.e. close enough to the extremum that neighbouring
 * rays pile up in nearly the same direction.
 * A pedagogical threshold, not a physical constant.
 */
const CAUSTIC_TOLERANCE_DEG = 1.5;

/* =========================================================================
 * 6. Analytic deviation model
 * =======================================================================*/

/** D_k(theta_i) in radians; k = number of internal reflections. */
function deviation(thetaI, n, k) {
  const thetaR = snellAngle(thetaI, 1, n);
  if (thetaR === null) return null;
  return 2 * (thetaI - thetaR) + k * (Math.PI - 2 * thetaR);
}

/** Fold a total deviation D into a scattering angle Theta in [0, PI]. */
function foldToScattering(D) {
  let a = D % (2 * Math.PI);
  if (a < 0) a += 2 * Math.PI;
  if (a > Math.PI) a = 2 * Math.PI - a;
  return a;
}

/** Angle from the antisolar direction, radians, from a total deviation D. */
function antisolarAngle(D) {
  return Math.PI - foldToScattering(D);
}

/**
 * Analytic extremum ("rainbow") angle of incidence for k internal reflections.
 * Setting dD/dtheta_i = 0 gives
 *      cos^2(theta_i) = (n^2 - 1) / ((k+1)^2 - 1)
 * Returns theta_i in radians, or null when out of range.
 */
function rainbowIncidenceAnalytic(n, k) {
  const denom = (k + 1) * (k + 1) - 1;
  if (denom <= 0) return null;
  const c2 = (n * n - 1) / denom;
  if (c2 < 0 || c2 > 1) return null;
  return Math.acos(Math.sqrt(c2));
}

/**
 * Locate the extremum of D_k numerically (golden-section search) WITHOUT
 * using the analytic formula. The unit tests compare the two, which is the
 * evidence that ~42 deg really emerges from the geometry.
 */
function rainbowIncidenceNumeric(n, k, samples = 4000) {
  const f = (t) => deviation(t, n, k);
  const lo0 = 1e-7;
  const hi0 = Math.PI / 2 - 1e-7;
  const step = (hi0 - lo0) / samples;
  let bestT = lo0;
  let bestV = f(lo0);
  for (let i = 1; i <= samples; i++) {
    const t = lo0 + step * i;
    const v = f(t);
    if (v < bestV) {
      bestV = v;
      bestT = t;
    }
  }
  let a = Math.max(lo0, bestT - step);
  let b = Math.min(hi0, bestT + step);
  const gr = (Math.sqrt(5) - 1) / 2;
  let c = b - gr * (b - a);
  let d = a + gr * (b - a);
  for (let i = 0; i < 300 && Math.abs(b - a) > 1e-14; i++) {
    if (f(c) < f(d)) {
      b = d;
      d = c;
      c = b - gr * (b - a);
    } else {
      a = c;
      c = d;
      d = a + gr * (b - a);
    }
  }
  return 0.5 * (a + b);
}

/** Full description of the bow of order k for index n. */
function rainbowGeometry(n, k) {
  const thetaI = rainbowIncidenceAnalytic(n, k);
  if (thetaI === null) return null;
  const thetaR = snellAngle(thetaI, 1, n);
  const D = deviation(thetaI, n, k);
  return {
    k,
    n,
    thetaI,
    thetaR,
    D,
    phi: antisolarAngle(D),
    thetaIDeg: thetaI * DEG,
    thetaRDeg: thetaR * DEG,
    deviationDeg: D * DEG,
    scatteringDeg: foldToScattering(D) * DEG,
    antisolarDeg: antisolarAngle(D) * DEG,
    impactParameter: Math.sin(thetaI),
  };
}

/* =========================================================================
 * 7. Full vector ray trace through a spherical droplet
 * =======================================================================*/

/**
 * Trace one ray through a spherical droplet using vector geometry only.
 *
 * options: { origin, dir, center, radius, n, reflections, exitLength }
 *
 * Returns a path object carrying the polyline, every interaction vertex, the
 * measured angles, a relative intensity weight and a classification.
 * `segments` carry a `medium` field so the renderer needs no physics.
 */
function traceRay(options) {
  const {
    origin,
    dir,
    center = vec(0, 0, 0),
    radius = 1,
    n = 1.333,
    reflections = 1,
  } = options;
  const exitLength = options.exitLength ?? 4 * radius;

  const d0 = vnorm(dir);
  const path = {
    hit: false,
    tangent: false,
    miss: false,
    points: [],
    segments: [],
    vertices: [],
    thetaI: null,
    thetaR: null,
    reflections,
    actualReflections: 0,
    dirIn: d0,
    dirOut: null,
    deviation: null,
    scattering: null,
    antisolar: null,
    impactParameter: null,
    intensity: 0,
    fresnelR: null,
    totalInternalReflection: false,
    classification: RayClass.MISS,
    n,
  };

  // Geometric impact parameter: distance from the centre to the incoming line.
  const oc = vsub(center, origin);
  const along = vdot(oc, d0);
  path.impactParameter = vlen(vsub(oc, vmul(d0, along)));

  const hit = intersectRaySphere(origin, d0, center, radius);
  if (!hit.hit || hit.t1 < 0) {
    path.miss = true;
    path.points = [origin, vadd(origin, vmul(d0, exitLength + 4 * radius))];
    path.segments = [{ a: path.points[0], b: path.points[1], medium: 'air', kind: 'miss' }];
    path.dirOut = d0;
    path.scattering = 0;
    path.antisolar = Math.PI;
    return path;
  }

  // Tangent / grazing: refuse to fabricate a refracted path, report honestly.
  if (hit.tangent || Math.abs(path.impactParameter - radius) < 1e-7) {
    path.hit = true;
    path.tangent = true;
    path.classification = RayClass.TANGENT;
    const p = vadd(origin, vmul(d0, hit.t0));
    const far = vadd(p, vmul(d0, exitLength));
    path.points = [origin, p, far];
    path.segments = [
      { a: origin, b: p, medium: 'air', kind: 'incident' },
      { a: p, b: far, medium: 'air', kind: 'exit' },
    ];
    path.dirOut = d0;
    path.deviation = 0;
    path.scattering = 0;
    path.antisolar = Math.PI;
    return path;
  }

  path.hit = true;

  /* ---- entry: air -> water --------------------------------------------- */
  const pEntry = vadd(origin, vmul(d0, hit.t0));
  const nEntry = vnorm(vsub(pEntry, center)); // outward normal
  const thetaI = Math.acos(clamp(-vdot(d0, nEntry), -1, 1));
  const dIn = refract(d0, nEntry, 1 / n);
  if (!dIn) return path; // impossible for air -> water, but stay safe
  const thetaR = Math.acos(clamp(-vdot(dIn, nEntry), -1, 1));
  path.thetaI = thetaI;
  path.thetaR = thetaR;

  path.points.push(origin, pEntry);
  path.segments.push({ a: origin, b: pEntry, medium: 'air', kind: 'incident' });
  path.vertices.push({
    point: pEntry,
    type: 'refraction',
    normal: nEntry,
    thetaIn: thetaI,
    thetaOut: thetaR,
  });

  // Fresnel bookkeeping. By reversibility the reflectance is identical at
  // every interface of this path, so weight = (1-R)^2 * R^k.
  const R = fresnelReflectance(thetaI, 1, n);
  path.fresnelR = R;
  path.intensity = (1 - R) * (1 - R) * Math.pow(R, reflections);

  /* ---- internal bounces, then exit -------------------------------------- */
  let p = pEntry;
  let d = dIn;

  for (let i = 0; i <= reflections; i++) {
    const h = intersectRaySphere(p, d, center, radius);
    if (!h.hit) return path;
    const t = h.t1 > 1e-9 ? h.t1 : h.t0;
    if (!(t > 1e-9)) return path;
    const pNext = vadd(p, vmul(d, t));
    path.points.push(pNext);
    path.segments.push({ a: p, b: pNext, medium: 'water', kind: 'internal' });

    const nOut = vnorm(vsub(pNext, center)); // outward normal
    const incidenceInside = Math.acos(clamp(vdot(d, nOut), -1, 1));

    if (i < reflections) {
      d = reflect(d, nOut);
      path.actualReflections++;
      path.vertices.push({
        point: pNext,
        type: 'reflection',
        normal: nOut,
        thetaIn: incidenceInside,
        thetaOut: incidenceInside,
      });
      p = pNext;
    } else {
      const dOut = refract(d, vneg(nOut), n);
      if (!dOut) {
        path.totalInternalReflection = true;
        path.classification = RayClass.NON_CAUSTIC;
        return path;
      }
      const thetaExit = Math.acos(clamp(vdot(dOut, nOut), -1, 1));
      path.vertices.push({
        point: pNext,
        type: 'refraction',
        normal: nOut,
        thetaIn: incidenceInside,
        thetaOut: thetaExit,
      });
      const far = vadd(pNext, vmul(dOut, exitLength));
      path.points.push(far);
      path.segments.push({ a: pNext, b: far, medium: 'air', kind: 'exit' });
      path.dirOut = dOut;
      path.exitPoint = pNext;
    }
  }

  if (path.dirOut) {
    // Measured straight from the vectors; the tests check that this agrees
    // with the analytic D_k formula.
    path.scattering = vangle(d0, path.dirOut);
    path.antisolar = Math.PI - path.scattering;
    path.deviation = deviation(thetaI, n, reflections);
  }
  path.classification = classifyRay(path, n);
  return path;
}

/* =========================================================================
 * 8. Classification
 * =======================================================================*/

/**
 * Classify a traced ray.
 * The pedagogical point: "one internal reflection" is NOT the same thing as
 * "rainbow ray". A ray belongs to the bright family only if its exit
 * direction also lies close to the extremum -- the caustic.
 */
function classifyRay(path, n, tolDeg = CAUSTIC_TOLERANCE_DEG) {
  if (!path || !path.hit) return RayClass.MISS;
  if (path.tangent) return RayClass.TANGENT;
  if (path.totalInternalReflection) return RayClass.NON_CAUSTIC;
  const k = path.reflections;
  if (k === 0) return RayClass.NO_REFLECTION;
  const geo = rainbowGeometry(n, k);
  if (!geo || path.antisolar === null) return RayClass.NON_CAUSTIC;
  if (Math.abs(path.antisolar * DEG - geo.antisolarDeg) > tolDeg) {
    return RayClass.NON_CAUSTIC;
  }
  if (k === 1) return RayClass.PRIMARY;
  if (k === 2) return RayClass.SECONDARY;
  return RayClass.HIGHER_ORDER;
}

/* =========================================================================
 * 9. Exit-angle curves (the most important graph)
 * =======================================================================*/

/**
 * Sample phi(b), Theta(b) and D(b) for one index and one reflection order.
 * b is the normalised impact parameter b/R in [0,1]. Angles in DEGREES.
 */
function exitAngleCurve(n, k, samples = 400) {
  const out = { b: [], phi: [], theta: [], D: [], intensity: [] };
  for (let i = 0; i <= samples; i++) {
    const b = i / samples;
    const thetaI = Math.asin(clamp(b, 0, 1));
    const D = deviation(thetaI, n, k);
    if (D === null) continue;
    const R = fresnelReflectance(thetaI, 1, n);
    out.b.push(b);
    out.D.push(D * DEG);
    out.theta.push(foldToScattering(D) * DEG);
    out.phi.push(antisolarAngle(D) * DEG);
    out.intensity.push((1 - R) * (1 - R) * Math.pow(R, k));
  }
  return out;
}

/** Angle for one impact parameter, in degrees, in the requested convention. */
function angleFor(n, k, b, mode = 'antisolar') {
  const thetaI = Math.asin(clamp(b, 0, 1));
  const D = deviation(thetaI, n, k);
  if (D === null) return null;
  if (mode === 'deviation') return D * DEG;
  if (mode === 'scattering') return foldToScattering(D) * DEG;
  return antisolarAngle(D) * DEG;
}

/* =========================================================================
 * 10. Angular intensity distribution (the caustic)
 * =======================================================================*/

/**
 * Accumulate the angular distribution of the light a droplet scatters.
 *
 * Documented simplification -- this is geometric optics only:
 *   - a uniform beam illuminates the droplet, so the number of rays with
 *     impact parameter in [b, b+db] is proportional to b*db (area weighting),
 *     which is why b is sampled as sqrt(u);
 *   - each ray carries the unpolarised Fresnel weight (1-R)^2 * R^k;
 *   - rays are binned by their angle phi from the antisolar direction;
 *   - dividing by sin(phi) converts "energy per bin" into radiance, because
 *     a bin at angle phi covers a solid angle proportional to sin(phi)*dphi.
 *
 * No interference, no diffraction, no Mie theory, no supernumerary bows, no
 * polarisation tracking. In the ideal limit the caustic peak is infinitely
 * sharp; here it is smoothed only by the finite bin width.
 */
function angularDistribution(opts = {}) {
  const {
    n = 1.333,
    orders = [1],
    rays = 20000,
    minDeg = 0,
    maxDeg = 180,
    bins = 360,
    sampling = 'uniform',
    perSolidAngle = true,
    bMin = 0,
    bMax = 1,
  } = opts;
  const acc = new Float64Array(bins);
  const binWidth = (maxDeg - minDeg) / bins;
  let total = 0;
  let used = 0;
  for (const k of orders) {
    for (let i = 0; i < rays; i++) {
      const u = sampling === 'random' ? Math.random() : (i + 0.5) / rays;
      const b = Math.sqrt(bMin * bMin + u * (bMax * bMax - bMin * bMin));
      const thetaI = Math.asin(clamp(b, 0, 1));
      const D = deviation(thetaI, n, k);
      if (D === null) continue;
      const phi = antisolarAngle(D) * DEG;
      const R = fresnelReflectance(thetaI, 1, n);
      const w = (1 - R) * (1 - R) * Math.pow(R, k);
      total += w;
      used++;
      const idx = Math.floor((phi - minDeg) / binWidth);
      if (idx < 0 || idx >= bins) continue;
      acc[idx] += w;
    }
  }
  if (perSolidAngle) {
    for (let i = 0; i < bins; i++) {
      const phiMid = (minDeg + (i + 0.5) * binWidth) * RAD;
      acc[i] /= Math.max(Math.sin(phiMid), 1e-3);
    }
  }
  let peak = 0;
  let peakIndex = 0;
  for (let i = 0; i < bins; i++) {
    if (acc[i] > peak) {
      peak = acc[i];
      peakIndex = i;
    }
  }
  return {
    bins: acc,
    binWidth,
    minDeg,
    maxDeg,
    total,
    used,
    peak,
    peakIndex,
    peakDeg: minDeg + (peakIndex + 0.5) * binWidth,
    count: bins,
  };
}

/* =========================================================================
 * 11. Sky geometry: Sun, antisolar point, rainbow circles, horizon
 * =======================================================================*/

/**
 * Unit vector towards the Sun. Right-handed frame, +Y up:
 *   elevation  degrees above the horizon
 *   azimuth    degrees; 0 = +Z, increasing towards +X
 */
function sunDirection(elevationDeg, azimuthDeg = 0) {
  const e = elevationDeg * RAD;
  const a = azimuthDeg * RAD;
  return vec(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
}

/** The antisolar point lies exactly opposite the Sun as seen by the observer. */
function antisolarDirection(elevationDeg, azimuthDeg = 0) {
  return vneg(sunDirection(elevationDeg, azimuthDeg));
}

/** Two unit vectors spanning the plane perpendicular to `axis`. */
function orthonormalBasis(axis) {
  const a = vnorm(axis);
  const helper = Math.abs(a.y) < 0.9 ? vec(0, 1, 0) : vec(1, 0, 0);
  const u = vnorm(vcross(a, helper));
  return { u, v: vcross(a, u) };
}

/**
 * One direction on the rainbow circle: the unit vector at angle phiDeg from
 * `antisolar`, rolled rollDeg around it. roll 0 is the `u` axis of
 * orthonormalBasis(), so a roll is only meaningful relative to the same
 * antisolar direction it was measured against.
 */
function bowDirection(antisolar, phiDeg, rollDeg) {
  const a = vnorm(antisolar);
  const { u, v } = orthonormalBasis(a);
  const ph = phiDeg * RAD;
  const t = rollDeg * RAD;
  const ring = vadd(vmul(u, Math.cos(t)), vmul(v, Math.sin(t)));
  return vadd(vmul(a, Math.cos(ph)), vmul(ring, Math.sin(ph)));
}

/**
 * Directions making the angle phiDeg with the antisolar direction -- i.e. the
 * rainbow circle. Returns unit vectors.
 */
function rainbowCircle(antisolar, phiDeg, steps = 256) {
  const pts = [];
  for (let i = 0; i <= steps; i++) pts.push(bowDirection(antisolar, phiDeg, (i / steps) * 360));
  return pts;
}

/**
 * The unit direction at angleDeg from `axis`, lying in the plane that `axis`
 * and `towards` span, on `towards`'s side of the axis.
 *
 * This is what turns a scattering angle into an actual outgoing ray: a
 * droplet sends order k out on a cone of half-angle Theta_k around the
 * incoming sunlight, and the element of that cone which lies in the plane
 * containing the observer is the only one that can be compared with the line
 * of sight. Degenerate input (`towards` parallel to `axis`) falls back to an
 * arbitrary but stable perpendicular, so the caller never gets NaN.
 */
function directionAtAngle(axis, towards, angleDeg) {
  const a = vnorm(axis);
  const perp = vsub(towards, vmul(a, vdot(towards, a)));
  const p = vlen(perp) < 1e-9 ? orthonormalBasis(a).u : vnorm(perp);
  const th = angleDeg * RAD;
  return vadd(vmul(a, Math.cos(th)), vmul(p, Math.sin(th)));
}

const EARTH_RADIUS_M = 6371000;

/**
 * Dip of the geometric horizon below the astronomical horizontal, in degrees,
 * for an observer h metres above a spherical Earth.
 * ~0.04 deg at eye level, only ~1.0 deg at 1000 m -- which is precisely why
 * "standing higher" does not by itself reveal a full circular rainbow.
 */
function horizonDipDeg(heightM, earthRadius = EARTH_RADIUS_M) {
  const h = Math.max(0, heightM);
  return Math.acos(earthRadius / (earthRadius + h)) * DEG;
}

/**
 * Which part of a bow of angular radius phi lies above the horizon?
 * The antisolar point sits at elevation -sunElevation, so the top of the bow
 * reaches elevation phi - sunElevation.
 */
function visibleFraction(sunElevationDeg, phiDeg, dipDeg = 0, steps = 2048) {
  const anti = antisolarDirection(sunElevationDeg, 0);
  const pts = rainbowCircle(anti, phiDeg, steps);
  let above = 0;
  let topEl = -Infinity;
  let botEl = Infinity;
  for (const p of pts) {
    const el = Math.asin(clamp(p.y, -1, 1)) * DEG;
    if (el > topEl) topEl = el;
    if (el < botEl) botEl = el;
    if (el > -dipDeg) above++;
  }
  return {
    fraction: above / pts.length,
    topElevationDeg: topEl,
    bottomElevationDeg: botEl,
    antisolarElevationDeg: -sunElevationDeg,
  };
}

/* =========================================================================
 * 12. Spectrum helpers used by the renderers
 * =======================================================================*/

/**
 * Approximate wavelength -> RGB conversion (the widely used piecewise
 * approximation). Purely a display convenience: no physics depends on it.
 */
function wavelengthToRGB(lambda, gamma = 0.8) {
  let r = 0;
  let g = 0;
  let b = 0;
  if (lambda >= 380 && lambda < 440) {
    r = -(lambda - 440) / 60;
    b = 1;
  } else if (lambda < 490) {
    g = (lambda - 440) / 50;
    b = 1;
  } else if (lambda < 510) {
    g = 1;
    b = -(lambda - 510) / 20;
  } else if (lambda < 580) {
    r = (lambda - 510) / 70;
    g = 1;
  } else if (lambda < 645) {
    r = 1;
    g = -(lambda - 645) / 65;
  } else if (lambda <= 780) {
    r = 1;
  }
  let factor = 0;
  if (lambda >= 380 && lambda < 420) factor = 0.3 + (0.7 * (lambda - 380)) / 40;
  else if (lambda <= 700) factor = 1;
  else if (lambda <= 780) factor = 0.3 + (0.7 * (780 - lambda)) / 80;
  const f = (x) => Math.round(255 * Math.pow(Math.max(0, x) * factor, gamma));
  return { r: f(r), g: f(g), b: f(b) };
}

function rgbCss(lambda, alpha = 1, gamma = 0.8) {
  const c = wavelengthToRGB(lambda, gamma);
  return alpha >= 1
    ? `rgb(${c.r},${c.g},${c.b})`
    : `rgba(${c.r},${c.g},${c.b},${alpha})`;
}

function linspace(a, b, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(a + ((b - a) * i) / (n - 1));
  return out;
}

/* =========================================================================
 * 13. Spectral radiance profile of the bow
 * =======================================================================*/

/**
 * For a set of wavelengths and reflection orders compute radiance(phi) and
 * convert it into an RGB profile. This is what the sky renderer paints, so
 * the visible bow is a direct consequence of the ray simulation and never a
 * hard-coded coloured arc.
 */
function spectralProfile(opts = {}) {
  const {
    indexModel = defaultIndex,
    orders = [1, 2],
    lambdas = null,
    minDeg = 0,
    maxDeg = 62,
    bins = 496,
    rays = 4000,
  } = opts;
  const ls = lambdas || linspace(405, 675, 28);
  const acc = ls.map((lam) =>
    angularDistribution({
      n: indexModel(lam),
      orders,
      rays,
      minDeg,
      maxDeg,
      bins,
      perSolidAngle: true,
    })
  );
  const weights = ls.map((lam) => wavelengthToRGB(lam, 1));
  const rgb = new Array(bins);
  let maxR = 0;
  for (let i = 0; i < bins; i++) {
    let r = 0;
    let g = 0;
    let b = 0;
    for (let j = 0; j < ls.length; j++) {
      const v = acc[j].bins[i];
      r += v * weights[j].r;
      g += v * weights[j].g;
      b += v * weights[j].b;
    }
    rgb[i] = { r, g, b };
    maxR = Math.max(maxR, r, g, b);
  }
  const bw = (maxDeg - minDeg) / bins;
  const phi = new Float64Array(bins);
  for (let i = 0; i < bins; i++) phi[i] = minDeg + (i + 0.5) * bw;
  return { phi, rgb, maxRadiance: maxR, binWidth: bw, minDeg, maxDeg, bins };
}

/* =========================================================================
 * 14. Alexander's band
 * =======================================================================*/

/**
 * The angular gap between the primary and the secondary bow. Geometric optics
 * sends no once- or twice-reflected light into this range, so it looks darker
 * than the sky inside the primary or outside the secondary. It is not black:
 * higher orders, external reflection, multiple scattering between droplets and
 * ordinary skylight all put some light there.
 */
function alexandersBand(indexModel = defaultIndex) {
  const nRed = indexModel(650);
  const nViolet = indexModel(420);
  const p1r = rainbowGeometry(nRed, 1);
  const p1v = rainbowGeometry(nViolet, 1);
  const p2r = rainbowGeometry(nRed, 2);
  const p2v = rainbowGeometry(nViolet, 2);
  return {
    innerDeg: Math.max(p1r.antisolarDeg, p1v.antisolarDeg),
    outerDeg: Math.min(p2r.antisolarDeg, p2v.antisolarDeg),
    primary: p1r,
    secondary: p2r,
  };
}

let current = 'cs';

function setLang(lang) {
  if (translations[lang]) current = lang;
  return current;
}
function getLang() {
  return current;
}

/** Translate. Unknown keys fall back to English, then to the key itself. */
function t(key, params) {
  let s = translations[current]?.[key];
  if (s === undefined) s = translations.en[key];
  if (s === undefined) return key;
  if (params) {
    for (const [k, v] of Object.entries(params)) {
      s = s.split(`{${k}}`).join(String(v));
    }
  }
  return s;
}

/** Locale-aware number formatting (Czech uses a decimal comma). */
function num(value, digits = 1) {
  if (value === null || value === undefined || Number.isNaN(value)) return '—';
  const s = value.toFixed(digits);
  return current === 'cs' ? s.replace('.', ',') : s;
}

function deg(value, digits = 1) {
  return `${num(value, digits)}°`;
}

/** Class-id -> translation key. */

  miss: 'classMiss',

/**

 * Views subscribe; nothing reads the DOM to find out what is going on.
 */

/** Wavelengths currently in play: one, or all six for white light. */
function activeLambdas() {
  if (state.wavelength === 'white') return [650, 610, 580, 540, 480, 420];
  return [state.wavelength];
}

/** The refractive-index model implied by the current controls. */
function indexModel() {
  return makeIndexModel({
    mode: state.indexMode,
    dispersion: state.dispersion,
    scale: state.indexScale,
  });
}

/**
 * Which reflection orders should be traced right now.
 *
 * One rule, used identically in both modes -- this used to branch on
 * state.mode and read a DIFFERENT control in each branch (state.reflections
 * in tutorial mode, state.families in free mode), which meant whichever
 * control the current mode ignored looked broken: it updated its own state
 * and its checkbox/highlight, but never touched the scene. families[3]
 * stands for "3 or more"; the exact bounce count traced for it follows
 * state.reflections when the user picked something >= 3, so a solo pick of
 * "4" via the segmented control still traces exactly 4 bounces.
 */
function activeOrders() {
  const out = [];
  if (state.families[0]) out.push(0);
  if (state.families[1]) out.push(1);
  if (state.families[2]) out.push(2);
  if (state.families[3]) out.push(Math.max(3, state.reflections));
  if (state.showNonRainbow && !out.includes(0)) out.push(0);
  if (!out.length) out.push(state.reflections);
  return [...new Set(out)].sort((a, b) => a - b);
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/**
 * Coalesce a burst of set() calls into one DOM sync per frame, aligned to
 * requestAnimationFrame in the normal case. rAF is also backed by a short
 * timer: if rAF is ever starved for longer than a user would tolerate (a
 * throttled/backgrounded tab, or an embedding context that skips painting
 * altogether), the `queued` guard below would otherwise latch permanently
 * true and silently stop every future state change from reaching the DOM,
 * since nothing else ever resets it. Whichever fires first wins; `fired`
 * stops the other from double-flushing.
 */
let queued = false;
function notify() {
  if (queued) return;
  queued = true;
  let fired = false;
  const flush = () => {
    if (fired) return;
    fired = true;
    queued = false;
    for (const fn of listeners) fn(state);
  };
  requestAnimationFrame(flush);
  setTimeout(flush, 32);
}

/** Shallow-merge a patch into the state and notify. Nested `show` is merged. */
function set(patch) {
  for (const [k, v] of Object.entries(patch)) {
    if (k === 'show' || k === 'families') Object.assign(state[k], v);
    else state[k] = v;
  }
  notify();
}

/* ============ src/ui.js ============ */

/**
 * ui.js -- tiny DOM helpers and reusable, language-agnostic controls.
 * Controls are given translation KEYS, never literal text.
 */

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style') node.setAttribute('style', v);
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

const clear = (node) => {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
};

/**
 * A titled, collapsible group of controls. Pass `{ collapsed: true }` as the
 * LAST argument to have it start closed -- for the knobs that must stay
 * reachable but that most readers never touch.
 */
function group(titleKey, ...children) {
  let opts = {};
  const last = children[children.length - 1];
  if (last && typeof last === 'object' && !last.nodeType) opts = children.pop();
  const shut = !!opts.collapsed;
  const body = el('div', { class: 'group-body' + (shut ? ' collapsed' : '') }, ...children);
  const head = el(
    'button',
    {
      class: 'group-head' + (shut ? ' closed' : ''),
      type: 'button',
      onclick: () => {
        const open = body.classList.toggle('collapsed');
        head.classList.toggle('closed', open);
      },
    },
    el('span', { class: 'group-caret' }),
    el('span', {}, t(titleKey))
  );
  return el('section', { class: 'group' }, head, body);
}

/**
 * Every control carries a `.sync()` that pushes the current state back into
 * the DOM element. That way a tutorial step (or any programmatic change) can
 * update the controls without rebuilding them -- rebuilding would interrupt a
 * drag in progress and lose keyboard focus.
 */
function collectSyncers(root, out = []) {
  if (root.sync) out.push(root.sync);
  for (const child of root.children) collectSyncers(child, out);
  return out;
}

/**
 * Slider with a live value readout.
 *   opts: { labelKey, min, max, step, get, format, onInput, hintKey }
 */
function slider(opts) {
  const out = el('output', { class: 'ctl-value' }, opts.format(opts.get()));
  const input = el('input', {
    type: 'range',
    min: opts.min,
    max: opts.max,
    step: opts.step,
    value: opts.get(),
    oninput: (e) => {
      const v = parseFloat(e.target.value);
      out.textContent = opts.format(v);
      opts.onInput(v);
    },
  });
  const node = el(
    'label',
    { class: 'ctl' },
    el('span', { class: 'ctl-label' }, el('span', {}, t(opts.labelKey)), out),
    input,
    opts.hintKey ? el('small', { class: 'ctl-hint' }, t(opts.hintKey)) : null
  );
  // The translation key doubles as a stable id, so the tutorial can point at
  // a control without matching on its displayed text.
  node.dataset.ctl = opts.labelKey;
  node.sync = () => {
    const v = opts.get();
    if (document.activeElement !== input) input.value = String(v);
    out.textContent = opts.format(v);
  };
  return node;
}

/** Checkbox bound to a boolean getter. */
function toggle(labelKey, get, onChange, opts = {}) {
  const input = el('input', {
    type: 'checkbox',
    checked: get(),
    onchange: (e) => onChange(e.target.checked),
  });
  const node = el(
    'label',
    { class: 'ctl ctl-toggle' + (opts.strong ? ' strong' : '') },
    input,
    el('span', {}, t(labelKey)),
    opts.swatch ? el('i', { class: 'swatch', style: `background:${opts.swatch}` }) : null
  );
  node.dataset.ctl = labelKey;
  node.sync = () => {
    input.checked = !!get();
  };
  return node;
}

/**
 * Segmented radio group. options: [{value, labelKey, label, color}]
 * `get` may be a function or a plain value (for one-shot renders).
 */
function segmented(options, get, onChange, opts = {}) {
  const read = typeof get === 'function' ? get : () => get;
  const buttons = options.map((o) =>
    el(
      'button',
      {
        type: 'button',
        class: 'seg',
        style: o.color ? `--seg-accent:${o.color}` : null,
        onclick: () => onChange(o.value),
      },
      o.labelKey ? t(o.labelKey) : o.label
    )
  );
  const node = el('div', { class: 'segmented' + (opts.wrap ? ' wrap' : '') }, buttons);
  node.sync = () => {
    const v = read();
    options.forEach((o, i) => buttons[i].classList.toggle('active', o.value === v));
  };
  node.sync();
  return node;
}

/** Labelled <select> bound to a getter. */
function select(labelKey, options, get, onChange) {
  const read = typeof get === 'function' ? get : () => get;
  const sel = el(
    'select',
    { onchange: (e) => onChange(e.target.value) },
    options.map((o) =>
      el('option', { value: o.value }, o.labelKey ? t(o.labelKey) : o.label)
    )
  );
  const node = el('label', { class: 'ctl' }, el('span', { class: 'ctl-label' }, t(labelKey)), sel);
  node.dataset.ctl = labelKey;
  node.sync = () => {
    sel.value = String(read());
  };
  node.sync();
  return node;
}

/** A key/value row for the readout panels. */
function row(labelKey, value, opts = {}) {
  return el(
    'div',
    { class: 'row' + (opts.wide ? ' wide' : '') },
    el('span', { class: 'row-key' }, t(labelKey)),
    el('span', { class: 'row-val' + (opts.mono === false ? '' : ' mono'), style: opts.color ? `color:${opts.color}` : null }, value)
  );
}

/**
 * Device pixels per CSS pixel to render at, overriding the screen's own.
 * Set only for the duration of a PNG export and then cleared.
 *
 * Every view draws in CSS pixels and lets the canvas transform do the rest,
 * so raising this costs exactly one redraw and yields a genuinely
 * higher-resolution figure -- not an upscaled screen grab.
 */
let renderScale = null;
function setRenderScale(s) {
  renderScale = s;
}

/** Canvas that keeps its backing store matched to the CSS size and DPR. */
function fitCanvas(canvas) {
  const dpr = renderScale || Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height, dpr };
}

/** Stroke a polyline given as [{x,y}, ...] in screen coordinates. */
function strokePath(ctx, pts, style, width = 1.5, dash = null) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.stroke();
  ctx.restore();
}

function label(ctx, text, x, y, opts = {}) {
  ctx.save();
  ctx.font = opts.font || '11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.baseline || 'middle';
  const m = ctx.measureText(text);
  if (opts.bg !== false) {
    const padX = 4;
    const padY = 3;
    const w = m.width + padX * 2;
    const h = 15;
    let bx = x - padX;
    if ((opts.align || 'left') === 'center') bx = x - w / 2;
    if (opts.align === 'right') bx = x - w + padX;
    ctx.fillStyle = opts.bgColor || 'rgba(9,12,20,0.78)';
    ctx.beginPath();
    ctx.roundRect(bx, y - h / 2, w, h, 3);
    ctx.fill();
  }
  ctx.fillStyle = opts.color || '#dfe6f5';
  ctx.fillText(text, x, y);
  ctx.restore();
}

/**
 * Take pointer capture, tolerating a pointer id the element cannot claim.
 * setPointerCapture throws NotFoundError for an id that is no longer active,
 * and it is called before the drag state is set up, so an unguarded throw
 * takes the whole gesture with it.
 */
function capture(canvas, e) {
  try {
    canvas.setPointerCapture(e.pointerId);
  } catch {
    /* capture is a convenience, not a precondition for dragging */
  }
}

/** Arrow head at `to`, pointing along (to - from). */
function arrowHead(ctx, from, to, color, size = 7) {
  const a = Math.atan2(to.y - from.y, to.x - from.x);
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(to.x, to.y);
  ctx.lineTo(to.x - size * Math.cos(a - 0.4), to.y - size * Math.sin(a - 0.4));
  ctx.lineTo(to.x - size * Math.cos(a + 0.4), to.y - size * Math.sin(a + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/** Angular arc marker between two directions around a vertex. */
function angleArc(ctx, cx, cy, r, a0, a1, color, text) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, r, a0, a1, a1 < a0);
  ctx.stroke();
  if (text) {
    const mid = (a0 + a1) / 2;
    label(ctx, text, cx + Math.cos(mid) * (r + 12), cy + Math.sin(mid) * (r + 12), {
      align: 'center',
      color,
      font: '10px "IBM Plex Mono", ui-monospace, monospace',
    });
  }
  ctx.restore();
}

/* ============ src/rays.js ============ */

/**
 * rays.js -- turns the current control state into a set of traced rays.
 *
 * Every ray in the application comes from here, so the 2-D scene, the graph
 * and the readout panel can never disagree about what is being shown.
 */


/** A demonstrably off-caustic impact parameter for the "ordinary ray" case. */
const NON_CAUSTIC_B = 0.35;

/**
 * Trace one ray with the canonical geometry: beam along +x, droplet at
 * origin. `rayLength` (droplet radii) sets how far the incident and exit
 * segments are drawn on each side -- 6 by default, matching the original
 * close-up framing; buildRays() scales it up with state.dropletZoom so a
 * zoomed-out view has correspondingly longer rays to draw a visible fan.
 */
function traceOne(lambda, n, k, b, radius = 1, rayLength = 6 * radius) {
  const path = O.traceRay({
    origin: O.vec(-rayLength, b * radius, 0),
    dir: O.vec(1, 0, 0),
    center: O.vec(0, 0, 0),
    radius,
    n,
    reflections: k,
    exitLength: rayLength,
  });
  return {
    lambda,
    n,
    k,
    b,
    path,
    classification: path.classification,
    color: O.rgbCss(lambda),
  };
}

/**
 * The full set of rays implied by the current state.
 * role:
 *   'main'   the ray the user is steering
 *   'fan'    the surrounding fan that shows the caustic piling up
 *   'demo0'  Case 1 from the brief: zero internal reflections
 *   'demoNC' Case 2: one internal reflection at a non-rainbow impact parameter
 */
function buildRays() {
  const idx = indexModel();
  const lambdas = activeLambdas();
  const orders = activeOrders();
  const rayLength = 6 * Math.max(1, state.dropletZoom);
  const out = [];

  for (const k of orders) {
    for (const lambda of lambdas) {
      const n = idx(lambda);
      const r = traceOne(lambda, n, k, state.impact, 1, rayLength);
      r.role = 'main';
      out.push(r);

      if (state.fanCount > 0) {
        for (let i = 0; i < state.fanCount; i++) {
          const b = (i + 0.5) / state.fanCount;
          if (Math.abs(b - state.impact) < 1e-6) continue;
          const f = traceOne(lambda, n, k, b, 1, rayLength);
          f.role = 'fan';
          out.push(f);
        }
      }
    }
  }

  if (state.showNonRainbow) {
    const lambda = lambdas.includes(650) ? 650 : lambdas[0];
    const n = idx(lambda);
    if (!orders.includes(0)) {
      const r0 = traceOne(lambda, n, 0, state.impact, 1, rayLength);
      r0.role = 'demo0';
      r0.noteKey = 'explNoReflection';
      out.push(r0);
    }
    const rn = traceOne(lambda, n, 1, NON_CAUSTIC_B, 1, rayLength);
    rn.role = 'demoNC';
    rn.noteKey = 'explNonCaustic';
    out.push(rn);
  }

  return out;
}

/** How far (in degrees) this ray sits from the extremum of its own family. */
function distanceFromExtremum(ray) {
  if (ray.k < 1 || ray.path.antisolar === null) return null;
  const geo = O.rainbowGeometry(ray.n, ray.k);
  if (!geo) return null;
  return ray.path.antisolar * O.DEG - geo.antisolarDeg;
}

/**
 * Display colour for a wavelength.
 *
 * With white light selected and dispersion turned down, the six sampled
 * wavelengths all take the same path, so they are drawn white and overlap into
 * a single beam. As dispersion rises they separate AND gain their colour --
 * which is the honest visual statement that the colours of a rainbow exist
 * only because n depends on wavelength.
 */
function colorFor(lambda, alpha = 1, greyMix = 0) {
  const c = O.wavelengthToRGB(lambda);
  let { r, g, b } = c;
  if (state.wavelength === 'white') {
    const m = Math.min(1, state.dispersion * 2.5);
    r = Math.round(r * m + 255 * (1 - m));
    g = Math.round(g * m + 255 * (1 - m));
    b = Math.round(b * m + 255 * (1 - m));
  }
  // Blend towards the neutral chrome grey. Used for rays that do not reach
  // the observer, so "this one misses" reads from hue -- the same grey the
  // many-droplets view uses for droplets that miss -- rather than from a
  // difference in opacity alone, which disappears at thin line widths.
  if (greyMix > 0) {
    const k = Math.min(1, greyMix);
    r = Math.round(r * (1 - k) + 0x93 * k);
    g = Math.round(g * (1 - k) + 0xa3 * k);
    b = Math.round(b * (1 - k) + 0xbd * k);
  }
  return alpha >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
}

/** Named colour id for a wavelength, if it is one of the six. */
function colorIdFor(lambda) {
  const c = O.NAMED_COLORS.find((x) => x.lambda === lambda);
  return c ? c.id : null;
}

/* ----------------------------------------------------- bow geometry -- */

/**
 * How close (in degrees) a droplet's seen angle has to be to a bow angle for
 * that droplet to count as delivering that colour.
 *
 * Deliberately tighter than CAUSTIC_TOLERANCE_DEG: that one asks "is this ray
 * part of the bright family", which is a property of the ray. This one asks
 * "does this droplet land on the bow *this observer* sees", which is a
 * property of a direction, and at 1.5 deg the two bows would smear into one
 * another instead of resolving into coloured bands.
 */
const BOW_MATCH_DEG = 0.45;

/**
 * The bow of order k, as one antisolar angle per named colour.
 *
 * Shared by the many-droplets field and the per-droplet readout so the
 * picture and the numbers cannot disagree about which droplet is lit.
 */
function bowBand(idx, k) {
  const angles = [];
  for (const c of O.NAMED_COLORS) {
    const geo = O.rainbowGeometry(idx(c.lambda), k);
    if (geo) angles.push({ lambda: c.lambda, phi: geo.antisolarDeg, geo });
  }
  if (!angles.length) return null;
  const phis = angles.map((a) => a.phi);
  return { k, angles, lo: Math.min(...phis), hi: Math.max(...phis) };
}

/** bowBand() for several orders at once, dropping any that has no extremum. */
function bowBands(idx, orders) {
  return orders.map((k) => bowBand(idx, k)).filter(Boolean);
}

/** Which wavelength (if any) does a droplet seen at antisolar angle phi deliver? */
function colorAtPhi(phi, bands, tolDeg = BOW_MATCH_DEG) {
  let best = null;
  for (const band of bands) {
    for (const a of band.angles) {
      const d = Math.abs(a.phi - phi);
      if (d < tolDeg && (!best || d < best.d)) best = { d, lambda: a.lambda, k: band.k };
    }
  }
  return best;
}

/**
 * The antisolar direction in the many-droplets cross-section: +x away from
 * the Sun, +y up. This is also the direction the incoming sunlight travels
 * in, which is why the same vector serves as the reference for every angle
 * in that scene.
 */
function antisolarAxis() {
  const a = state.sunElevation * O.RAD;
  return { x: Math.cos(a), y: -Math.sin(a) };
}

/**
 * The reflection orders a clicked droplet is inspected at.
 *
 * Fixed, and deliberately not tied to the show.primary/show.secondary
 * toggles: those say which bows the FIELD should highlight, while an
 * inspection answers "what does this one droplet do with the sunlight",
 * whose honest answer includes the orders nobody ever sees. k=3 is the
 * interesting one -- its light leaves at phi ~ 137 deg, i.e. about 42 deg
 * from the SUN, forward into the rain and away from the observer, which is
 * why looking at the sky opposite the Sun never finds a third bow. The
 * engine already knows that; drawing it costs less than asserting it.
 */
const DROP_ORDERS = [1, 2, 3];

/**
 * Everything the many-droplets scene knows about ONE droplet: the angle the
 * observer sees it at, and, per reflection order, where that droplet
 * actually sends its concentrated light and by how much that misses the eye.
 *
 * Lives here rather than in either consumer because both the drawing and the
 * readout need it, and two copies of "the angle from the antisolar
 * direction" is exactly how a diagram ends up disagreeing with its own
 * caption.
 */
function dropReport(drop, orders = DROP_ORDERS) {
  const idx = indexModel();
  const anti = antisolarAxis();
  const rel = { x: drop.x - state.dropsObserverX, y: drop.y - state.dropsObserverY };
  const distance = Math.hypot(rel.x, rel.y);
  if (distance < 1e-9) return { anti, distance, dir: null, phiSeen: null, bands: [], hit: null };

  const dir = { x: rel.x / distance, y: rel.y / distance };
  const phiSeen = Math.acos(O.clamp(dir.x * anti.x + dir.y * anti.y, -1, 1)) * O.DEG;

  const bands = bowBands(idx, orders).map((band) => {
    let nearest = band.angles[0];
    for (const a of band.angles) {
      if (Math.abs(a.phi - phiSeen) < Math.abs(nearest.phi - phiSeen)) nearest = a;
    }
    const delta = phiSeen - nearest.phi;
    return { ...band, nearest, delta, reaches: Math.abs(delta) <= BOW_MATCH_DEG };
  });

  const reaching = bands.filter((b) => b.reaches);
  reaching.sort((a, b) => Math.abs(a.delta) - Math.abs(b.delta));
  return { anti, distance, dir, phiSeen, bands, hit: reaching[0] || null };
}

/* ============ src/dropletView.js ============ */

/**
 * dropletView.js -- Mode A: cross-section of a single spherical droplet.
 *
 * Nothing in here knows any optics: it renders the polylines that
 * optics.traceRay() produced. Dragging changes the impact parameter, which
 * re-runs the trace.
 */





/** Rays classified into one of these families are the ones a real observer
 * would actually see as a bright rainbow -- everything else is scattered
 * light going somewhere else entirely. */
const REACHES_OBSERVER = new Set([O.RayClass.PRIMARY, O.RayClass.SECONDARY, O.RayClass.HIGHER_ORDER]);

const SEG_LABELS = ['R0', 'R1', 'R2', 'R3', 'R4', 'R5'];

/**
 * How far the view may be pulled back from the droplet, in droplet radii.
 * Exported so the slider in the control column and the wheel gesture here
 * cannot disagree about the ends of the range.
 */
const ZOOM_RANGE = [1, 40];

function createDropletView(canvas) {
  let layout = null;
  let hover = null;
  /* The eyes currently on screen, and where each one was last drawn.
     rayStyle(), the tally and the pointer hit-test all have to agree with
     what drawObserver() actually painted, so they read these rather than
     each re-deriving the geometry. */
  let eyes = [];
  let eyeScreen = [];

  function project(p) {
    return { x: layout.cx + p.x * layout.s, y: layout.cy - p.y * layout.s };
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);

    // Zooming out draws the droplet smaller (dampened by sqrt so it stays
    // legible even at high zoom) while the observer moves proportionally
    // farther away (see drawObserver) -- together this is what lets a
    // dispersed fan of colour become visible on the way to the eye instead
    // of being lost in a droplet that fills most of the frame.
    const zoom = Math.max(1, state.dropletZoom);
    // Floored: below ~16 px the droplet stops reading as a sphere with a
    // traceable path inside it, and the point of zooming out is to compare
    // the fan's spread WITH the droplet, not to lose the droplet.
    const s = Math.max(16, Math.min(w * 0.19, h * 0.34) / Math.sqrt(zoom));

    // Where the eyes are depends only on optics, so it can be settled before
    // the layout -- which lets the layout use it. With essentially one exit
    // direction in play, centring the droplet wastes half the canvas: the fan
    // we are trying to spread out runs off one edge while the opposite side
    // stays empty. Sliding the droplet AGAINST the mean eye direction as the
    // zoom rises makes the droplet-to-eye baseline as long as the canvas
    // allows, and the drawn width of the dispersion fan is proportional to
    // exactly that baseline.
    eyes = computeObservers();
    const lean = meanScreenDir(eyes);
    const pull = Math.min(1, (zoom - 1) / 6);
    layout = {
      cx: w * 0.47 - (lean ? lean.x * w * 0.24 * pull : 0),
      cy: h * 0.5 - (lean ? lean.y * h * 0.2 * pull : 0),
      s, w, h, zoom,
    };
    eyeScreen = [];

    drawBackground(ctx, w, h);
    drawDroplet(ctx);
    drawSun(ctx, w, h);

    const observers = eyes;

    const rays = buildRays();
    // Rays that reach the observer are drawn LAST, above everything else.
    // Sorting by role alone used to bury them: a contributing fan ray would
    // be painted before a dim, non-contributing main ray and then covered by
    // it, so the very rays the scene is trying to emphasise ended up
    // underneath the ones it is trying to play down. Role only breaks ties
    // within each group.
    const order = { fan: 0, demo0: 1, demoNC: 1, main: 2 };
    rays.sort((a, b) => {
      const ra = reachesEye(a) ? 1 : 0;
      const rb = reachesEye(b) ? 1 : 0;
      return ra !== rb ? ra - rb : order[a.role] - order[b.role];
    });
    const reachingKs = new Set(rays.filter(reachesEye).map((r) => r.k));
    for (const ray of rays) drawRay(ctx, ray);

    const main = rays.filter((r) => r.role === 'main');
    if (main.length) {
      // When several families are compared at once, the detailed breakdown
      // (angle arcs, R-segment labels, Theta/phi readout) has to pick ONE
      // ray to attach to. Prefer whichever matches the "Vnitřní odrazy"
      // solo-select control -- the one control the user is actually
      // steering -- rather than an arbitrary last-built ray, so the detail
      // view never silently jumps to a family the user didn't ask about.
      const ref = main.find((r) => r.k === state.reflections) ?? main[main.length - 1];
      if (state.show.angles) drawAngles(ctx, ref);
      if (state.show.labels) drawSegmentLabels(ctx, ref);
      if (state.show.angles && ref.path.dirOut) drawExitAngle(ctx, ref);
      if (state.show.normals) for (const r of main) drawNormals(ctx, r);
    }
    drawImpactHandle(ctx);
    for (const observer of observers) drawObserver(ctx, observer, reachingKs.has(observer.kRef));
    drawLegend(ctx, w, h, rays);
    if (state.show.labels) {
      label(ctx, t(state.observerMode === 'manual' ? 'observerManualHint' : 'observerReachHint'), 12, h - 14, {
        color: '#6f86ab', font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif',
      });
    }
  }

  /**
   * Where a real observer would need to stand to see each ACTIVE reflection
   * family's rainbow, and in which direction they'd be looking -- one entry
   * per family, not one overall. A real observer sees the primary and
   * secondary bows at once, at different angular radii (exactly what the sky
   * view draws as two concentric circles); drawing only a single shared eye
   * here would leave a secondary ray glowing as "reaching" while visibly
   * missing the one eye on screen, which is actively misleading whenever more
   * than one family is compared at a time.
   *
   * A real observer is effectively at infinity, so every droplet sends its
   * concentrated light in the same fixed direction -- the antisolar angle phi
   * for a given order/wavelength. We get that direction by tracing the
   * actual canonical ray at the analytic extremum (O.rainbowGeometry's own
   * impact parameter), reusing the exact same tested ray tracer as every
   * other ray on screen, rather than re-deriving the angle by hand.
   * k=0 has no extremum -- no reflection ever produces a concentrated
   * direction -- so it never gets an eye; if it is the only active family, a
   * single inactive placeholder eye is still shown, captioned accordingly.
   *
   * In MANUAL mode the eyes keep their per-family structure and their side of
   * the axis, but sit at the angle the user chose instead of the angle the
   * extremum dictates. Same code path, one substituted number -- so the two
   * modes cannot drift apart, and 42 deg becomes something to find rather
   * than something the app quietly asserts.
   */
  function computeObservers() {
    const idx = indexModel();
    const nRef = idx(650); // red, the same reference wavelength used elsewhere
    const manual = state.observerMode === 'manual';
    const orders = activeOrders().filter((k) => k >= 1);
    const observers = [];
    for (const kRef of orders) {
      const geo = O.rainbowGeometry(nRef, kRef);
      if (!geo) continue;
      const canonical = traceOne(650, nRef, kRef, geo.impactParameter);
      if (!canonical.path.dirOut) continue;
      const common = { valid: true, kRef, rainbowPhiDeg: geo.antisolarDeg, manual };
      if (!manual) {
        observers.push({ ...common, dir: canonical.path.dirOut, phiDeg: geo.antisolarDeg });
        continue;
      }
      // The exit side flips with every internal reflection (k=1 leaves below
      // the axis for b>0, k=2 above), so the side has to come from this
      // family's own canonical ray -- a manual eye placed on the wrong side
      // would be mirrored away from the light and could never light up.
      const side = Math.sign(canonical.path.dirOut.y) || 1;
      // phi is measured AT the observer, between the line back to the droplet
      // and the antisolar direction (+x), so the droplet-to-eye direction is
      // Theta = 180 - phi away from +x.
      const phi = O.clamp(state.observerPhi, 0, 180) * O.RAD;
      observers.push({
        ...common,
        dir: O.vec(-Math.cos(phi), side * Math.sin(phi), 0),
        phiDeg: O.clamp(state.observerPhi, 0, 180),
      });
    }
    if (!observers.length) {
      const kRef = state.reflections >= 1 ? state.reflections : 0;
      observers.push({ dir: O.vec(-1, 0, 0), valid: false, kRef, phiDeg: null, rainbowPhiDeg: null, manual });
    }
    return observers;
  }

  /** Mean screen-space direction of the eyes, for the layout lean. */
  function meanScreenDir(observers) {
    let x = 0;
    let y = 0;
    let n = 0;
    for (const o of observers) {
      if (!o.valid) continue;
      x += o.dir.x;
      y += -o.dir.y; // world -> screen y-flip
      n++;
    }
    if (!n) return null;
    const len = Math.hypot(x, y);
    return len < 1e-6 ? null : { x: x / len, y: y / len };
  }

  /**
   * Does this ray actually deliver light into an eye that is on screen?
   *
   * AUTO mode asks the ray's own classification, which measures the ray
   * against the extremum computed from the ray's OWN refractive index. A
   * geometric test would be subtly wrong here: the eyes are positioned with
   * n(650), so a violet primary ray -- dead on its own caustic, 1.7 deg away
   * from red's -- would stop counting as reaching.
   *
   * MANUAL mode asks the geometric question instead, because that is the
   * question the user is now steering: does this ray come out at the angle
   * the eye is sitting at? Answering it geometrically is what makes the
   * caustic discoverable -- sweeping the eye through the rainbow angle makes
   * the count of arriving rays spike, and nothing had to be told to it.
   * Both tests use the same tolerance, so at the rainbow angle the two modes
   * agree ray for ray.
   */
  function reachesEye(ray) {
    if (state.observerMode !== 'manual') return REACHES_OBSERVER.has(ray.classification);
    if (ray.k < 1 || ray.path.antisolar === null) return false;
    const phi = ray.path.antisolar * O.DEG;
    for (const eye of eyes) {
      if (!eye.valid || eye.kRef !== ray.k) continue;
      if (Math.abs(phi - eye.phiDeg) <= O.CAUSTIC_TOLERANCE_DEG) return true;
    }
    return false;
  }

  function drawBackground(ctx, w, h) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#080b14');
    g.addColorStop(1, '#0d1220');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // optical axis through the droplet centre
    strokePath(
      ctx,
      [{ x: 0, y: layout.cy }, { x: w, y: layout.cy }],
      'rgba(120,140,180,0.18)',
      1,
      [4, 6]
    );
    if (state.show.labels) {
      // The antisolar direction IS the incoming beam's direction of travel
      // (away from the Sun, continuing forward) -- so its label belongs on
      // the far side of the droplet from the Sun icon, not next to it.
      label(ctx, t('antisolarPoint'), w - 14, layout.cy - 13, {
        align: 'right', color: '#8fa4c8', bg: false,
        font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif',
      });
    }
  }

  function drawDroplet(ctx) {
    const { cx, cy, s } = layout;
    const g = ctx.createRadialGradient(cx - s * 0.35, cy - s * 0.35, s * 0.1, cx, cy, s);
    g.addColorStop(0, 'rgba(120,190,255,0.16)');
    g.addColorStop(1, 'rgba(60,110,190,0.06)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(140,190,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // centre mark
    ctx.fillStyle = 'rgba(160,200,255,0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
    ctx.fill();

    if (state.show.labels) {
      const idx = indexModel();
      const lam = state.wavelength === 'white' ? 589 : state.wavelength;
      label(ctx, `${t('raindrop')} · n = ${num(idx(lam), 3)}`, cx, cy + s + 16, {
        align: 'center', color: '#9fc4ee',
      });
      label(ctx, `R = ${num(state.dropletRadiusMm, 2)} mm`, cx, cy + s + 34, {
        align: 'center', color: '#6f86ab', bg: false, font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }
  }

  function drawSun(ctx, w, h) {
    const y = layout.cy - state.impact * layout.s;
    ctx.save();
    const g = ctx.createRadialGradient(24, y, 2, 24, y, 16);
    g.addColorStop(0, 'rgba(255,238,180,0.95)');
    g.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(24, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.arc(24, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (state.show.labels) {
      label(ctx, t('sunLabel'), 24, y - 24, { align: 'center', color: '#ffe9a8' });
    }
  }

  /**
   * Prominence is driven by whether the ray actually reaches the observer
   * (its own classification, exactly the same test used in the ray-info
   * panel), not by which role built it. A demo ray or a fan ray that happens
   * to land on the caustic is emphasised exactly like the main ray would be;
   * an off-caustic main ray is dimmed exactly like a non-rainbow fan ray.
   */
  function rayStyle(ray) {
    const reaches = reachesEye(ray);
    // greyMix is the primary cue (see colorFor): a ray that misses the
    // observer loses most of its hue, so with a whole fan on screen the few
    // that matter stand out by colour and not merely by being a little less
    // faint. Alpha is kept high enough that the missing rays stay clearly
    // present -- they are the pedagogical point, not clutter to hide.
    if (ray.role === 'fan') {
      return { alpha: reaches ? 0.95 : 0.4, width: reaches ? 2.2 : 0.9, greyMix: reaches ? 0 : 0.82, reaches };
    }
    return { alpha: reaches ? 1 : 0.62, width: reaches ? 2.4 : 1.3, greyMix: reaches ? 0 : 0.72, reaches };
  }

  function drawRay(ctx, ray) {
    const p = ray.path;
    if (!p.hit && !p.miss) return;
    const { alpha: a, width: baseWidth, greyMix, reaches } = rayStyle(ray);
    const selected =
      state.selectedRay &&
      state.selectedRay.k === ray.k &&
      Math.abs(state.selectedRay.b - ray.b) < 1e-9 &&
      state.selectedRay.lambda === ray.lambda;

    const base = colorFor(ray.lambda, a, greyMix);
    const dashed = ray.role === 'demo0' || ray.role === 'demoNC';

    // A glow under the exit segment for any ray that actually reaches the
    // observer -- the visual cue that ties "this ray" to "that eye", not
    // just a brighter version of the same colour.
    if (reaches && p.segments.length) {
      const exitSeg = p.segments[p.segments.length - 1];
      strokePath(ctx, [project(exitSeg.a), project(exitSeg.b)], 'rgba(224,168,63,0.35)', baseWidth + 5);
    }

    for (const seg of p.segments) {
      const A = project(seg.a);
      const B = project(seg.b);
      let width = baseWidth;
      if (selected) width += 1.6;
      let style = base;
      if (seg.medium === 'water') {
        style = colorFor(ray.lambda, Math.min(1, a * 0.95), greyMix);
        width += 0.2;
      }
      if (seg.kind === 'incident' && ray.role !== 'fan') {
        // incoming sunlight is white before the droplet splits it, but a
        // ray that will miss the observer still reads as greyed out
        style = reaches && state.wavelength === 'white' ? `rgba(255,246,214,${a})` : base;
      }
      strokePath(ctx, [A, B], style, width, dashed && seg.kind !== 'internal' ? [5, 4] : null);
    }

    if (p.dirOut && p.segments.length) {
      const last = p.segments[p.segments.length - 1];
      arrowHead(ctx, project(last.a), project(last.b), base, reaches ? 8 : ray.role === 'fan' ? 4 : 6);
    }

    if (ray.role !== 'fan') {
      // The refraction/reflection dots follow the ray's own emphasis --
      // full-strength markers on a greyed-out ray would pull the eye back
      // to exactly the ray the scene is trying to play down.
      for (const v of p.vertices) {
        const q = project(v.point);
        const dot = v.type === 'reflection' ? '255,209,102' : '139,224,255';
        ctx.fillStyle = reaches ? `rgb(${dot})` : `rgba(${dot},0.45)`;
        ctx.beginPath();
        ctx.arc(q.x, q.y, selected ? 3.6 : reaches ? 2.6 : 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (ray.noteKey && state.show.labels) {
      const last = p.segments[p.segments.length - 1];
      const q = project(last.b);
      const txt = t(ray.noteKey);
      label(ctx, txt.length > 62 ? txt.slice(0, 60) + '…' : txt,
        Math.min(q.x, layout.w - 12), q.y + (ray.k === 0 ? 16 : -16), {
        align: 'right', color: '#c3b6ff', font: '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif',
      });
    }
  }

  /**
   * The observer, drawn as an eye facing back toward the droplet, sitting
   * exactly along the direction the current family's canonical rainbow ray
   * exits along (see computeObserver). Its world-space distance grows with
   * state.dropletZoom (see draw()), so zooming out pushes it farther away
   * in step with the droplet shrinking -- not just a fixed offset -- and
   * the diverging exit rays get correspondingly longer to reach it (see
   * buildRays()). It is still clamped to stay comfortably inside the canvas
   * regardless of aspect ratio, since the true distance to an observer is
   * effectively infinite and has no true scale to draw at.
   */
  function drawObserver(ctx, observer, active) {
    const { cx, cy, s, w, h, zoom } = layout;
    const screenDir = { x: observer.dir.x, y: -observer.dir.y }; // world -> screen y-flip
    const len = Math.hypot(screenDir.x, screenDir.y) || 1;
    const ux = screenDir.x / len;
    const uy = screenDir.y / len;

    const margin = 58; // room for the eye glyph and its centred caption
    let radius = s * 3.3 * Math.sqrt(zoom);
    const limits = [];
    if (ux > 1e-6) limits.push((w - margin - cx) / ux);
    if (ux < -1e-6) limits.push((margin - cx) / ux);
    if (uy > 1e-6) limits.push((h - margin - cy) / uy);
    if (uy < -1e-6) limits.push((margin - cy) / uy);
    for (const lim of limits) if (lim > 0) radius = Math.min(radius, lim);

    const x = cx + ux * radius;
    const y = cy + uy * radius;
    const faceAngle = Math.atan2(cy - y, cx - x); // eye looks back at the droplet
    eyeScreen.push({ x, y, kRef: observer.kRef });

    ctx.save();
    if (active) {
      const g = ctx.createRadialGradient(x, y, 2, x, y, 30);
      g.addColorStop(0, 'rgba(224,168,63,0.38)');
      g.addColorStop(1, 'rgba(224,168,63,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 30, 0, Math.PI * 2);
      ctx.fill();
    }

    // line of sight, faint, from the observer toward the droplet
    strokePath(ctx, [{ x, y }, { x: cx, y: cy }],
      active ? 'rgba(224,168,63,0.3)' : 'rgba(147,163,189,0.16)', 1, [2, 4]);

    ctx.translate(x, y);
    ctx.rotate(faceAngle);
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2);
    ctx.fillStyle = active ? 'rgba(224,168,63,0.14)' : 'rgba(147,163,189,0.08)';
    ctx.fill();
    ctx.strokeStyle = active ? '#e0a83f' : 'rgba(147,163,189,0.7)';
    ctx.lineWidth = active ? 1.9 : 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, active ? 4.4 : 3.2, 0, Math.PI * 2);
    ctx.fillStyle = active ? '#e0a83f' : '#93a3bd';
    ctx.fill();
    ctx.restore();

    // phi, drawn where phi is actually defined: AT the eye, between the line
    // of sight back to the droplet and the antisolar direction (+x on screen
    // -- the direction the sunlight was already travelling, continuing past
    // the droplet). Sweeping the same arc at the droplet centre instead would
    // sweep Theta, not phi; that exact confusion is what the exit-angle
    // readout had to be fixed for, so it is not repeated here. With the arc
    // drawn, "the observer is at 42 deg" and "the ray leaves at phi = 42 deg"
    // are visibly the same statement about the same angle.
    if (state.show.angles && observer.valid && observer.phiDeg !== null) {
      const losAng = Math.atan2(cy - y, cx - x);
      const stub = Math.min(x + 66, w - 6);
      if (stub > x + 12) {
        strokePath(ctx, [{ x, y }, { x: stub, y }], 'rgba(143,164,200,0.4)', 1, [3, 4]);
      }
      // Labelled with the symbol only. The value is already in the caption a
      // few pixels away, and printing it twice put the two labels on top of
      // each other whenever the caption flipped up past the arc.
      angleArc(ctx, x, y, 34, Math.min(losAng, 0), Math.max(losAng, 0),
        active ? 'rgba(224,168,63,0.95)' : 'rgba(143,164,200,0.75)', 'φ');
    }

    if (state.show.labels) {
      const belowLine2 = observer.valid
        ? `φ ${observer.manual ? '=' : '≈'} ${deg(observer.phiDeg, 1)}${observer.kRef ? ` · k=${observer.kRef}` : ''}`
        : t('observerNoConcentration');
      // Stack the caption upwards when a downward stack would not fit. The
      // eye's position is dictated by the optics -- for k=1 it lands on the
      // bottom margin at every zoom -- so the caption is the part that has to
      // give way. The reserved band at the foot is the hint row, which a
      // three-line stack from a bottom-margin eye lands exactly on top of.
      const HINT_BAND = 26;
      const dir = y + 62 > h - HINT_BAND ? -1 : 1;
      const y1 = dir > 0 ? y + 20 : y - 52;
      // Centred on the eye, but slid back onto the canvas when that would
      // run it off an edge. The eye's position is dictated by the optics and
      // routinely sits hard against a margin, where the longest caption --
      // the k=0 "no reflection, so no concentrated direction" one -- loses
      // its first several characters.
      const centred = (text, ty, opts = {}) => {
        ctx.save();
        ctx.font = opts.font || '11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
        const half = ctx.measureText(text).width / 2 + 6;
        ctx.restore();
        label(ctx, text, O.clamp(x, half + 2, Math.max(half + 2, w - half - 2)), ty,
          { align: 'center', ...opts });
      };
      centred(t('observerLabel'), y1, { color: active ? '#e0a83f' : '#93a3bd' });
      centred(belowLine2, y1 + 16, {
        color: '#6f86ab', font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
      // Manual mode has to say plainly how far from the bow the eye is, or
      // "move it until something happens" is a search with no feedback.
      if (observer.manual && observer.rainbowPhiDeg !== null) {
        const d = observer.phiDeg - observer.rainbowPhiDeg;
        const onBow = Math.abs(d) <= O.CAUSTIC_TOLERANCE_DEG;
        centred(onBow ? t('observerOnBow') : `Δ ${d > 0 ? '+' : ''}${num(d, 1)}° → ${deg(observer.rainbowPhiDeg, 1)}`,
          y1 + 32, {
            color: onBow ? '#6fd3a4' : '#c9905c',
            font: '10px "IBM Plex Mono", ui-monospace, monospace',
          });
      }
    }
  }

  function drawNormals(ctx, ray) {
    for (const v of ray.path.vertices) {
      const a = project(v.point);
      const nEnd = O.vadd(v.point, O.vmul(v.normal, 0.42));
      const b = project(nEnd);
      strokePath(ctx, [a, b], 'rgba(180,200,240,0.5)', 1, [3, 3]);
      const inner = project(O.vsub(v.point, O.vmul(v.normal, 0.42)));
      strokePath(ctx, [a, inner], 'rgba(180,200,240,0.22)', 1, [3, 3]);
    }
  }

  function drawSegmentLabels(ctx, ray) {
    const segs = ray.path.segments;
    for (let i = 0; i < segs.length && i < SEG_LABELS.length; i++) {
      const s = segs[i];
      const mid = { x: (s.a.x + s.b.x) / 2, y: (s.a.y + s.b.y) / 2 };
      const q = project(mid);
      label(ctx, SEG_LABELS[i], q.x, q.y - 12, {
        align: 'center', color: '#93a7c9', font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }
  }

  function drawAngles(ctx, ray) {
    const v = ray.path.vertices[0];
    if (!v) return;
    const c = project(v.point);
    const nDir = { x: v.normal.x, y: -v.normal.y };
    const nAng = Math.atan2(nDir.y, nDir.x);
    const inAng = Math.atan2(0, -1); // incoming ray reversed = pointing back to the Sun
    const r = 30;
    angleArc(ctx, c.x, c.y, r, nAng, inAng, 'rgba(139,224,255,0.8)', `θi=${deg(v.thetaIn * O.DEG, 1)}`);
    const refr = ray.path.segments[1];
    if (refr) {
      const d = { x: refr.b.x - refr.a.x, y: -(refr.b.y - refr.a.y) };
      const rAng = Math.atan2(d.y, d.x);
      angleArc(ctx, c.x, c.y, r * 0.62, nAng + Math.PI, rAng, 'rgba(255,209,102,0.85)',
        `θr=${deg(v.thetaOut * O.DEG, 1)}`);
    }
  }

  /**
