   * Marks the angle this specific arc geometrically sweeps: the reference
   * line points forward (+x, continuing the incident beam undeviated) and
   * the arc closes onto the actual outgoing ray, so the angle between them is
   * Theta -- the scattering angle from the ORIGINAL direction of travel, per
   * optics.js's own convention -- not phi. (phi = 180 deg - Theta is measured
   * from the antisolar direction instead, i.e. from the reverse of this same
   * reference line, which would require the arc to sweep back through the
   * droplet body to draw honestly.) Showing Theta here and deriving phi as
   * text keeps the arc's size and its label in agreement, and ties directly
   * into the two conventions the Mathematics panel documents.
   */
  function drawExitAngle(ctx, ray) {
    const p = ray.path;
    const exitSeg = p.segments[p.segments.length - 1];
    const origin = project(exitSeg.a);
    const refEnd = { x: origin.x + 78, y: origin.y };
    strokePath(ctx, [origin, refEnd], 'rgba(120,140,180,0.5)', 1, [3, 4]);
    const d = { x: exitSeg.b.x - exitSeg.a.x, y: -(exitSeg.b.y - exitSeg.a.y) };
    const outAng = Math.atan2(d.y, d.x);
    const thetaDeg = p.scattering * O.DEG;
    const phiDeg = p.antisolar * O.DEG;
    angleArc(ctx, origin.x, origin.y, 46, 0, outAng, 'rgba(111,211,164,0.95)',
      `Θ=${deg(thetaDeg, 1)} → φ=${deg(phiDeg, 1)}`);
  }

  function drawImpactHandle(ctx) {
    const y = layout.cy - state.impact * layout.s;
    const x = layout.cx - layout.s * 1.9;
    ctx.save();
    ctx.strokeStyle = hover ? 'rgba(255,255,255,0.75)' : 'rgba(180,200,240,0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    ctx.moveTo(x, layout.cy);
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = hover ? '#ffffff' : 'rgba(200,220,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    if (state.show.labels) {
      label(ctx, `b/R = ${num(state.impact, 3)}`, x, y - 16, { align: 'center', color: '#cfe0ff' });
    }
  }

  function drawLegend(ctx, w, h, rays) {
    let y = 18;
    if (state.show.wavelengthLabels) {
      const main = rays.filter((r) => r.role === 'main');
      const seen = new Set();
      for (const r of main) {
        if (seen.has(r.lambda)) continue;
        seen.add(r.lambda);
        const txt = `${r.lambda} ${t('nm')} · n=${num(r.n, 4)} · φ=${
          r.path.antisolar === null ? '—' : deg(r.path.antisolar * O.DEG, 2)
        }`;
        label(ctx, txt, w - 12, y, { align: 'right', color: colorFor(r.lambda) });
        y += 18;
      }
      y += 6;
    }
    drawRayTally(ctx, w, y, rays);
  }

  /**
   * How many of the rays on screen actually reach the observer, with a
   * swatch for each of the two states. Only worth showing once there is
   * more than one ray to compare -- with a single ray the observer eye
   * lighting up already says the same thing. Placed top-right, under the
   * wavelength legend, because the top-left is where the Sun icon and its
   * label travel as the impact parameter is dragged.
   */
  function drawRayTally(ctx, w, y0, rays) {
    if (!state.show.labels) return;
    const traced = rays.filter((r) => r.path.hit && !r.path.tangent);
    if (traced.length < 2) return;
    const reaching = traced.filter(reachesEye).length;

    let y = y0;
    label(ctx, `${t('rayTally')}: ${reaching} / ${traced.length}`, w - 12, y, {
      align: 'right', color: reaching ? '#e0a83f' : '#93a3bd',
    });
    y += 18;

    const font = '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
    const lambdas = state.wavelength === 'white'
      ? O.NAMED_COLORS.map((c) => c.lambda)
      : [state.wavelength];

    /** greyMix null => draw the swatch as the actual spectrum in play, so
     *  under white light the "reaches" key is a miniature rainbow rather
     *  than a single red line that misrepresents what is on screen. */
    const swatchRow = (text, greyMix, alpha) => {
      label(ctx, text, w - 12, y, { align: 'right', bg: false, color: '#8ea3c6', font });
      // measure with the same font label() draws in, not whatever the
      // context happened to be left set to
      ctx.save();
      ctx.font = font;
      const textW = ctx.measureText(text).width;
      ctx.restore();
      const x1 = w - 18 - textW;
      const x0 = x1 - 16;
      const seg = (x1 - x0) / lambdas.length;
      lambdas.forEach((lam, i) => {
        strokePath(ctx, [{ x: x0 + i * seg, y }, { x: x0 + (i + 1) * seg + 0.6, y }],
          colorFor(lam, alpha, greyMix), 2.4);
      });
      y += 15;
    };
    swatchRow(t('rayLegendReaches'), 0, 1);
    swatchRow(t('rayLegendMisses'), 0.82, 0.55);
  }

  /* ---------------------------------------------------------- interaction */

  function impactFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const b = (layout.cy - y) / layout.s;
    return Math.max(-0.999, Math.min(0.999, b));
  }

  /** The eye under the pointer, if any -- the drag handle for phi. */
  function eyeUnder(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    return eyeScreen.find((eye) => Math.hypot(px - eye.x, py - eye.y) < 22) || null;
  }

  /**
   * The phi a pointer position implies: the angle at the pointer between the
   * line back to the droplet and the antisolar direction. Only the magnitude
   * of the screen angle is used, so the eye stays on whichever side of the
   * axis its own reflection family actually exits towards, however far round
   * the droplet the pointer wanders.
   */
  function phiFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const dx = e.clientX - rect.left - layout.cx;
    const dy = e.clientY - rect.top - layout.cy;
    const len = Math.hypot(dx, dy);
    if (len < 1e-6) return state.observerPhi;
    const theta = Math.acos(O.clamp(dx / len, -1, 1)) * O.DEG;
    return Math.round(O.clamp(180 - theta, 0, 180) * 10) / 10;
  }

  let dragging = false;
  let eyeDrag = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (!layout) return;
    capture(canvas, e);
    // Grabbing the eye steers phi directly. Doing it while still in auto mode
    // is what switches the mode over: the gesture IS the request to place the
    // eye by hand, and making the user find a radio button first would only
    // give the drag a way to look broken.
    if (eyeUnder(e)) {
      eyeDrag = true;
      set({ observerMode: 'manual', observerPhi: phiFromEvent(e) });
      return;
    }
    dragging = true;
    set({ impact: impactFromEvent(e) });
    selectNearest(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!layout) return;
    if (eyeDrag) {
      set({ observerPhi: phiFromEvent(e) });
      return;
    }
    if (dragging) {
      set({ impact: impactFromEvent(e) });
    } else {
      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const hy = layout.cy - state.impact * layout.s;
      const overEye = !!eyeUnder(e);
      const nowHover = !overEye && Math.abs(y - hy) < 14;
      const cursor = overEye ? 'grab' : nowHover ? 'ns-resize' : 'crosshair';
      if (canvas.style.cursor !== cursor) canvas.style.cursor = cursor;
      if (nowHover !== hover) {
        hover = nowHover;
        draw();
      }
    }
  });
  const stop = () => { dragging = false; eyeDrag = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  // Wheel = pull back from the droplet, the same direction the sky view's
  // wheel moves its camera. Scaled by the raw deltaY rather than its sign so
  // a trackpad gets fine control and a notched mouse gets a useful step;
  // capped because some devices report a whole page of deltaY per notch.
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      const step = O.clamp(e.deltaY, -120, 120) / 120;
      set({ dropletZoom: O.clamp(state.dropletZoom * Math.pow(1.35, step), ...ZOOM_RANGE) });
    },
    { passive: false }
  );

  function selectNearest(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    let best = null;
    let bestD = 14;
    for (const ray of buildRays()) {
      for (const seg of ray.path.segments) {
        const A = project(seg.a);
        const B = project(seg.b);
        const d = distToSegment(px, py, A, B);
        if (d < bestD) {
          bestD = d;
          best = ray;
        }
      }
    }
    if (best) {
      set({ selectedRay: { lambda: best.lambda, k: best.k, b: best.b }, panel: 'ray' });
    }
  }

  return { draw, tick: () => false, reset: () => {} };
}

function distToSegment(px, py, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.hypot(px - a.x, py - a.y);
  let tt = ((px - a.x) * dx + (py - a.y) * dy) / l2;
  tt = Math.max(0, Math.min(1, tt));
  return Math.hypot(px - (a.x + tt * dx), py - (a.y + tt * dy));
}

/* ============ src/graphView.js ============ */

/**
 * graphView.js -- the two diagnostic plots.
 *
 *   'exit'  exit angle versus impact parameter, one curve per wavelength and
 *           per reflection order. The extremum is found by the optics engine,
 *           never drawn as a decorative horizontal line.
 *   'dist'  the angular distribution of outgoing rays, accumulated ray by ray
 *           so that the caustic peak visibly emerges.
 *
 * Both directions of the interaction are wired: dragging the ray moves the
 * marker, clicking the graph moves the ray.
 */





const PAD = { l: 58, r: 16, t: 26, b: 34 };

function createGraphView(canvas) {
  let box = null;
  const accum = { key: '', data: new Map(), count: 0, target: 0 };
  let raf = null;

  /* --------------------------------------------------------- accumulator */

  function accumKey() {
    return [
      activeOrders().join(','),
      activeLambdas().join(','),
      state.dispersion,
      state.indexMode,
      state.indexScale,
      distRange().join(','),
    ].join('|');
  }

  function distRange() {
    const orders = activeOrders();
    const maxK = Math.max(...orders);
    const minK = Math.min(...orders);
    if (maxK <= 2 && minK >= 1) return [0, 90];
    return [0, 180];
  }

  const BINS = 540;

  function resetAccum() {
    accum.key = accumKey();
    accum.data = new Map();
    accum.count = 0;
    for (const lam of activeLambdas()) accum.data.set(lam, new Float64Array(BINS));
  }

  /** Add `m` randomly sampled rays per wavelength (area-weighted in b). */
  function addRays(m) {
    const idx = indexModel();
    const orders = activeOrders();
    const [lo, hi] = distRange();
    const bw = (hi - lo) / BINS;
    for (const lam of activeLambdas()) {
      const arr = accum.data.get(lam);
      if (!arr) continue;
      const n = idx(lam);
      for (let i = 0; i < m; i++) {
        const b = Math.sqrt(Math.random());
        const thetaI = Math.asin(O.clamp(b, 0, 1));
        for (const k of orders) {
          const D = O.deviation(thetaI, n, k);
          if (D === null) continue;
          const phi = O.antisolarAngle(D) * O.DEG;
          const R = O.fresnelReflectance(thetaI, 1, n);
          const w = (1 - R) * (1 - R) * Math.pow(R, k);
          const bin = Math.floor((phi - lo) / bw);
          if (bin >= 0 && bin < BINS) arr[bin] += w;
        }
      }
    }
    accum.count += m;
  }

  function stepAccum() {
    if (accum.key !== accumKey()) resetAccum();
    const target = state.distAccumulate ? Infinity : state.distRays;
    if (accum.count > state.distRays && !state.distAccumulate) resetAccum();
    if (accum.count < target) {
      const remaining = target - accum.count;
      const batch = Math.min(
        Math.max(1, Math.ceil(accum.count * 0.35) || 1),
        remaining,
        state.distAccumulate ? 3000 : 8000
      );
      addRays(batch);
      return true; // more to come
    }
    return false;
  }

  /* -------------------------------------------------------------- drawing */

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#080b14';
    ctx.fillRect(0, 0, w, h);
    box = { x: PAD.l, y: PAD.t, w: w - PAD.l - PAD.r, h: h - PAD.t - PAD.b };
    if (box.w < 40 || box.h < 30) return;
    if (state.graph === 'exit') drawExit(ctx, w, h);
    else drawDist(ctx, w, h);
  }

  function frame(ctx, xLabel, yLabel, xTicks, yTicks, fx, fy) {
    ctx.save();
    ctx.strokeStyle = 'rgba(120,140,180,0.28)';
    ctx.lineWidth = 1;
    ctx.strokeRect(box.x, box.y, box.w, box.h);
    ctx.font = '10px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle = '#7c8fb3';
    for (const v of xTicks) {
      const x = fx(v);
      ctx.strokeStyle = 'rgba(120,140,180,0.13)';
      ctx.beginPath();
      ctx.moveTo(x, box.y);
      ctx.lineTo(x, box.y + box.h);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(num(v, v % 1 === 0 ? 0 : 1), x, box.y + box.h + 13);
    }
    for (const v of yTicks) {
      const y = fy(v);
      ctx.strokeStyle = 'rgba(120,140,180,0.13)';
      ctx.beginPath();
      ctx.moveTo(box.x, y);
      ctx.lineTo(box.x + box.w, y);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(num(v, v % 1 === 0 ? 0 : 1), box.x - 7, y + 3);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8ea3c6';
    ctx.font = '11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(xLabel, box.x + box.w / 2, box.y + box.h + 28);
    ctx.save();
    ctx.translate(13, box.y + box.h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
    ctx.restore();
  }

  function niceTicks(lo, hi, count = 6) {
    const span = hi - lo;
    if (!(span > 0)) return [lo];
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const stepN = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    const step = stepN * mag;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
      out.push(Math.abs(v) < 1e-9 ? 0 : v);
    }
    return out;
  }

  /* ------------------------------------------------ exit-angle vs impact */

  let exitMap = null;

  function drawExit(ctx, w, h) {
    const idx = indexModel();
    const orders = activeOrders();
    const lambdas = activeLambdas();
    const curves = [];
    let lo = Infinity;
    let hi = -Infinity;
    for (const k of orders) {
      for (const lam of lambdas) {
        const n = idx(lam);
        const c = O.exitAngleCurve(n, k, 320);
        const vals =
          state.angleMode === 'deviation' ? c.D : state.angleMode === 'scattering' ? c.theta : c.phi;
        for (const v of vals) {
          if (v < lo) lo = v;
          if (v > hi) hi = v;
        }
        curves.push({ k, lam, n, b: c.b, vals });
      }
    }
    if (!curves.length) return;
    const padY = Math.max(2, (hi - lo) * 0.12);
    lo = Math.max(0, lo - padY);
    hi = hi + padY;

    const fx = (b) => box.x + b * box.w;
    const fy = (v) => box.y + box.h - ((v - lo) / (hi - lo)) * box.h;
    exitMap = { fx, fy, lo, hi };

    const yKey =
      state.angleMode === 'deviation'
        ? 'axisAngleDeviation'
        : state.angleMode === 'scattering'
        ? 'axisAngleScattering'
        : 'axisAngleAntisolar';
    frame(ctx, t('axisImpact'), t(yKey), niceTicks(0, 1, 5), niceTicks(lo, hi, 6), fx, fy);

    // extremum guide lines, computed by the engine
    for (const k of orders) {
      if (k < 1) continue;
      for (const lam of lambdas) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const v =
          state.angleMode === 'deviation'
            ? geo.deviationDeg
            : state.angleMode === 'scattering'
            ? geo.scatteringDeg
            : geo.antisolarDeg;
        if (v < lo || v > hi) continue;
        const y = fy(v);
        strokePath(
          ctx,
          [{ x: box.x, y }, { x: box.x + box.w, y }],
          colorFor(lam, 0.28), 1, [3, 5]
        );
        const x = fx(geo.impactParameter);
        strokePath(ctx, [{ x, y: box.y + box.h }, { x, y }], colorFor(lam, 0.22), 1, [3, 5]);
        ctx.fillStyle = colorFor(lam, 0.95);
        ctx.beginPath();
        ctx.arc(x, y, 3.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const c of curves) {
      const pts = [];
      for (let i = 0; i < c.b.length; i++) pts.push({ x: fx(c.b[i]), y: fy(c.vals[i]) });
      strokePath(ctx, pts, colorFor(c.lam, c.k === 1 ? 0.95 : 0.7),
        c.k === 1 ? 2 : 1.5, c.k === 2 ? [6, 3] : c.k >= 3 ? [2, 3] : null);
    }

    // label each extremum once (using the longest wavelength present)
    const lamLabel = lambdas.includes(650) ? 650 : lambdas[0];
    for (const k of orders) {
      if (k < 1) continue;
      const geo = O.rainbowGeometry(idx(lamLabel), k);
      if (!geo) continue;
      const v =
        state.angleMode === 'deviation'
          ? geo.deviationDeg
          : state.angleMode === 'scattering'
          ? geo.scatteringDeg
          : geo.antisolarDeg;
      if (v < lo || v > hi) continue;
      label(ctx, `k=${k} · ${t('extremumLabel')} ${deg(v, 2)}`, fx(geo.impactParameter) + 8, fy(v) - 14, {
        color: colorFor(lamLabel), font: '10px "IBM Plex Mono", ui-monospace, monospace',
      });
    }

    // the moving marker for the ray currently in the droplet
    const bNow = Math.abs(state.impact);
    const x = fx(bNow);
    strokePath(ctx, [{ x, y: box.y }, { x, y: box.y + box.h }], 'rgba(255,255,255,0.4)', 1);
    for (const c of curves) {
      const v = O.angleFor(c.n, c.k, bNow, state.angleMode);
      if (v === null || v < lo || v > hi) continue;
      ctx.fillStyle = colorFor(c.lam);
      ctx.beginPath();
      ctx.arc(x, fy(v), 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    label(ctx, `b/R = ${num(bNow, 3)}`, x, box.y + 10, { align: 'center', color: '#e8eefc' });
  }

  /* ------------------------------------------------- angular distribution */

  function drawDist(ctx, w, h) {
    if (accum.key !== accumKey()) resetAccum();
    const [lo, hi] = distRange();
    const bw = (hi - lo) / BINS;

    // radiance = energy per bin divided by the solid angle of the annulus
    let peak = 0;
    const shown = [];
    for (const [lam, arr] of accum.data) {
      const rad = new Float64Array(BINS);
      for (let i = 0; i < BINS; i++) {
        const phiMid = (lo + (i + 0.5) * bw) * O.RAD;
        rad[i] = arr[i] / Math.max(Math.sin(phiMid), 0.02);
        if (rad[i] > peak) peak = rad[i];
      }
      shown.push({ lam, rad });
    }
    if (peak <= 0) peak = 1;

    const fx = (a) => box.x + ((a - lo) / (hi - lo)) * box.w;
    const fy = (v) => box.y + box.h - (v / peak) * box.h * 0.92;
    frame(ctx, t('axisAngleAntisolar'), t('axisRayCount'),
      niceTicks(lo, hi, 7), [], fx, fy);

    for (const { lam, rad } of shown) {
      const pts = [];
      for (let i = 0; i < BINS; i++) pts.push({ x: fx(lo + (i + 0.5) * bw), y: fy(rad[i]) });
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(box.x, box.y + box.h);
      for (const p of pts) ctx.lineTo(p.x, p.y);
      ctx.lineTo(box.x + box.w, box.y + box.h);
      ctx.closePath();
      ctx.fillStyle = colorFor(lam, shown.length > 1 ? 0.3 : 0.35);
      ctx.fill();
      ctx.restore();
      strokePath(ctx, pts, colorFor(lam, 0.9), 1.2);
    }

    // where the engine says the extremum is
    const idx = indexModel();
    for (const k of activeOrders()) {
      if (k < 1) continue;
      for (const lam of activeLambdas()) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo || geo.antisolarDeg < lo || geo.antisolarDeg > hi) continue;
        const x = fx(geo.antisolarDeg);
        strokePath(ctx, [{ x, y: box.y }, { x, y: box.y + box.h }], colorFor(lam, 0.35), 1, [4, 4]);
      }
    }

    label(ctx, `${t('rayCount')}: ${formatCount(accum.count)}`, box.x + box.w - 8, box.y + 12, {
      align: 'right', color: '#e8eefc',
    });
    const peakDeg = peakAngle(shown, lo, bw);
    if (peakDeg !== null) {
      label(ctx, `${t('extremumLabel')} ${deg(peakDeg, 2)}`, fx(peakDeg), box.y + 30, {
        align: 'center', color: '#6fd3a4',
      });
    }
  }

  function peakAngle(shown, lo, bw) {
    let best = -1;
    let bi = -1;
    for (const { rad } of shown) {
      for (let i = 0; i < rad.length; i++) {
        if (rad[i] > best) {
          best = rad[i];
          bi = i;
        }
      }
    }
    return bi < 0 || best <= 0 ? null : lo + (bi + 0.5) * bw;
  }

  function formatCount(c) {
    if (c >= 1000000) return `${num(c / 1000000, 1)}M`;
    if (c >= 1000) return `${num(c / 1000, c >= 10000 ? 0 : 1)}k`;
    return String(c);
  }

  /* --------------------------------------------------------- interaction */

  canvas.addEventListener('pointerdown', (e) => {
    if (state.graph !== 'exit' || !box || !exitMap) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const b = O.clamp((x - box.x) / box.w, 0, 0.999);
    set({ impact: b });
  });
  canvas.addEventListener('pointermove', (e) => {
    if (state.graph !== 'exit' || !box) return;
    canvas.style.cursor = e.offsetX > box.x && e.offsetX < box.x + box.w ? 'ew-resize' : 'default';
  });

  /** Called every animation frame by the app while the dist plot is visible. */
  function tick() {
    if (state.graph !== 'dist') return false;
    return stepAccum();
  }

  return { draw, tick, reset: resetAccum };
}

/* ============ src/dropsView.js ============ */

/**
 * dropsView.js -- Mode B: from one droplet to thousands.
 *
 * A vertical cross-section through the observer, containing the antisolar
 * direction and the vertical. Each droplet is tested for one thing only:
 * does the observer see it at the angle phi at which that droplet sends out
 * its concentrated light? Distance never enters the test -- which is exactly
 * the point the brief asks us to make.
 */





const SMALL_FONT = '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';

const MAX_DRAWN_RAYS = 34;
const MAX_DRAWN_GREY_RAYS = 16;

/** Screen distance at which a click counts as landing on a droplet. */
const PICK_RADIUS = 14;

/**
 * How far the observer may wander, in world units. Shared with app.js so the
 * sliders and the drag clamp cannot disagree.
 *
 * The downward range is deliberately small: the ground is a fixed plane in
 * this cross-section, and its shallowest setting sits 0.128 world units below
 * the origin, so anything lower would put the observer underground. Up is the
 * interesting direction anyway -- rising is what puts rain below eye level.
 */
const OBS_RANGE = { x: [-0.28, 0.72], y: [-0.1, 0.3] };

/** p offset by k world units along the unit direction d. */
const off = (p, d, k) => ({ x: p.x + d.x * k, y: p.y + d.y * k });

/** A world direction as a screen direction. P() flips y and scales uniformly. */
const SD = (v) => ({ x: v.x, y: -v.y });

const dot = (a, b) => a.x * b.x + a.y * b.y;

/**
 * The two directions, in this cross-section, into which a droplet sends its
 * concentrated light for a bow at antisolar angle phi.
 *
 * The outgoing ray makes the scattering angle Theta = 180 - phi with the
 * direction the sunlight was already travelling in, and the droplet is a
 * sphere, so in three dimensions this is a cone; a cross-section cuts it in
 * two rays, one either side of the axis. Both are drawn, because both are
 * real -- it is why droplets above AND below the antisolar line light up.
 */
function exitDirs(anti, phiDeg) {
  const theta = (180 - phiDeg) * O.RAD;
  return [rotate(anti, theta), rotate(anti, -theta)];
}

function createDropsView(canvas) {
  let drops = [];
  let seedKey = '';
  let layout = null;
  let grabbing = false; // pointer is over (or holding) the observer handle

  function makeKey() {
    return `${state.dropCount}|${state.show.rainBelow}`;
  }

  function regenerate() {
    const target = state.dropCount;
    if (drops.length > target) drops.length = target;
    while (drops.length < target) {
      // spread in depth and height; log-ish depth so near and far are both seen
      const depth = 0.12 + Math.pow(Math.random(), 0.6) * 0.88;
      const spread = state.show.rainBelow ? 1 : 0.62;
      const height = (Math.random() * 2 - 1) * spread;
      drops.push({ x: depth, y: height * depth * 1.25 });
    }
    seedKey = makeKey();
    validateSelection();
  }

  /**
   * Drop a selection whose droplet the field no longer contains. Turning the
   * count down truncates the array, so the selected droplet can simply cease
   * to exist; leaving the marker behind would put an inspector on a piece of
   * empty sky.
   */
  function validateSelection() {
    const sel = state.selectedDrop;
    if (!sel) return;
    const still = drops.some((d) => Math.abs(d.x - sel.x) < 1e-9 && Math.abs(d.y - sel.y) < 1e-9);
    if (!still) set({ selectedDrop: null });
  }

  /** Bow bands the FIELD is currently highlighting, from the engine. */
  function bands(idx) {
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    return bowBands(idx, orders);
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    if (seedKey !== makeKey()) regenerate();

    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#070a12');
    g.addColorStop(1, '#0c1120');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const ox = w * 0.1;
    const oy = h * 0.52;
    const s = Math.min(w * 0.82, h * 1.25);
    // Where the observer is STANDING, in the same world units the droplet
    // field uses. The rain does not move; the observer does. Every droplet is
    // re-tested at its new angle, so moving here hands the bow to a
    // completely different set of droplets -- which is the one thing this
    // scene exists to show, and something a fixed observer could only assert
    // in a caption.
    const obs = { x: state.dropsObserverX, y: state.dropsObserverY };
    layout = { ox, oy, s, obs };
    const P = (p) => ({ x: ox + p.x * s, y: oy - p.y * s });
    const o = P(obs);

    const anti = antisolarAxis();
    const sun = { x: -anti.x, y: -anti.y };
    const idx = indexModel();
    const bs = bands(idx);
    const sel = state.selectedDrop;

    // The sun-antisolar axis: sunlight is parallel at this distance, so this
    // ONE line, running the full width of the scene through the observer, is
    // literally the direction every ray of incoming light travels along. It
    // also makes the Sun's position explicit rather than leaving it floating
    // near the observer with no visible connection to anything.
    strokePath(ctx, [P(off(obs, sun, 1.4)), P(off(obs, anti, 1.4))],
      'rgba(255,225,160,0.28)', 1, [5, 5]);
    if (state.show.labels) {
      // Pulled back onto the canvas when the antisolar direction runs off the
      // right edge -- which it does at every observer position, since the
      // droplet field already fills that side. The dashed axis carries the
      // true direction; the label only has to name what is out there.
      const e = P(off(obs, anti, 1.2));
      const ex = Math.min(e.x, w - 12);
      label(ctx, t('antisolarPoint'), ex, e.y - 12, {
        align: ex < e.x ? 'right' : 'center', color: '#9fb4d8',
      });
    }

    // the two directions that can deliver bow light, in this cross-section
    for (const band of bs) {
      for (const sign of [1, -1]) {
        for (const edge of [band.lo, band.hi]) {
          const dir = rotate(anti, sign * edge * O.RAD);
          strokePath(ctx, [o, P(off(obs, dir, 1.35))],
            band.k === 1 ? 'rgba(111,211,164,0.22)' : 'rgba(155,140,240,0.2)', 1,
            band.k === 1 ? [3, 4] : [2, 5]);
        }
      }
    }

    // ground
    if (state.show.ground) {
      const gy = groundY();
      const yy = P({ x: 0, y: gy }).y;
      const gg = ctx.createLinearGradient(0, yy, 0, h);
      gg.addColorStop(0, 'rgba(30,45,35,0.85)');
      gg.addColorStop(1, 'rgba(12,18,16,0.95)');
      ctx.fillStyle = gg;
      ctx.fillRect(0, yy, w, h - yy);
      strokePath(ctx, [{ x: 0, y: yy }, { x: w, y: yy }], 'rgba(120,170,140,0.45)', 1.2);
      if (state.show.labels) label(ctx, t('horizon'), w - 12, yy - 12, { align: 'right', color: '#9ec9ab' });
    }

    // Every droplet in the field concentrates light into the SAME two
    // directions: the sunlight is parallel, the droplets are identical
    // spheres, so nothing distinguishes them but where they happen to sit.
    // Which is the whole point -- a droplet is lit for this observer only if
    // one of those two fixed directions happens to end at their eye.
    const geo1 = O.rainbowGeometry(idx(650), 1);
    const greyDirs = geo1 ? exitDirs(anti, geo1.antisolarDeg) : null;

    // droplets. The non-contributing ones are by far the most numerous, so
    // they go into a single path and a single fill() -- one fill per droplet
    // is what makes ten thousand of them slow.
    let contributing = 0;
    let drawnRays = 0;
    let drawnGreyRays = 0;
    const dotR = state.dropCount > 3000 ? 0.7 : state.dropCount > 600 ? 1.1 : state.dropCount > 60 ? 1.8 : 3;
    const greyPath = new Path2D();
    let greyCount = 0;
    ctx.save();
    // With one droplet under inspection the field is context, not the
    // subject: dimmed rather than hidden, so the inspected droplet's rays
    // are still visibly parallel to every other droplet's.
    if (sel) ctx.globalAlpha = 0.4;
    for (const d of drops) {
      // Angles are measured FROM THE OBSERVER, so this is the only place the
      // observer's position enters the physics -- and it is enough to change
      // which droplets qualify.
      const rel = { x: d.x - obs.x, y: d.y - obs.y };
      const len = Math.hypot(rel.x, rel.y);
      if (len < 1e-6) continue;
      const dir = { x: rel.x / len, y: rel.y / len };
      const phi = Math.acos(O.clamp(dot(dir, anti), -1, 1)) * O.DEG;
      const hitc = colorAtPhi(phi, bs);
      const q = P(d);
      if (q.x < -20 || q.x > w + 20 || q.y < -20 || q.y > h + 20) continue;

      if (hitc) {
        contributing++;
        ctx.fillStyle = colorFor(hitc.lambda, 0.95);
        ctx.beginPath();
        ctx.arc(q.x, q.y, dotR + 1.2, 0, Math.PI * 2);
        ctx.fill();
        if (drawnRays < MAX_DRAWN_RAYS && state.show.droplets) {
          drawnRays++;
          // incoming sunlight
          strokePath(ctx, [P(off(d, sun, 0.22)), q], 'rgba(255,246,214,0.5)', 1);
          // the ray that actually reaches the eye -- dashed for the
          // secondary bow (k=2), solid for the primary (k=1), the same
          // convention used everywhere else in the app for the two orders
          strokePath(ctx, [q, o], colorFor(hitc.lambda, 0.6), 1,
            hitc.k === 2 ? [4, 3] : null);
        }
      } else if (state.show.droplets) {
        greyPath.moveTo(q.x + dotR, q.y);
        greyPath.arc(q.x, q.y, dotR, 0, Math.PI * 2);
        greyCount++;
        // A sample of the grey droplets get the same treatment as the
        // coloured ones: sunlight really does reach every droplet, and every
        // droplet really does concentrate it into a bow -- it is only the
        // DIRECTION that fails to line up with this particular observer's
        // eye. Both exit directions come out of rainbowGeometry, so they are
        // exactly parallel to the rays the lit droplets send to the eye, and
        // the picture makes its own argument: the light is not missing, it
        // is aimed somewhere else.
        if (drawnGreyRays < MAX_DRAWN_GREY_RAYS && len > 0.12 && greyDirs) {
          drawnGreyRays++;
          strokePath(ctx, [P(off(d, sun, 0.22)), q], 'rgba(255,246,214,0.16)', 1);
          for (const gd of greyDirs) {
            strokePath(ctx, [q, P(off(d, gd, 0.13))], 'rgba(150,175,215,0.3)', 1);
          }
        }
      }
    }
    if (greyCount) {
      ctx.fillStyle = 'rgba(150,175,215,0.24)';
      ctx.fill(greyPath);
    }
    ctx.restore();

    if (sel) drawInspector(ctx, { sel, anti, sun, P, o, w, h, s });

    // observer -- drawn as a grabbable handle, since it is one
    ctx.save();
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath();
    ctx.arc(o.x, o.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,238,252,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(o.x, o.y, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    if (grabbing) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232,238,252,0.8)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(o.x, o.y, 16, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    if (state.show.labels) label(ctx, t('observerLabel'), o.x, o.y + 22, { align: 'center', color: '#e8eefc' });

    // Sun icon, at a small FIXED pixel distance from the observer in the
    // correct direction -- not scaled by world units. The observer sits
    // close to the left edge (ox is only ~10% of the width, to leave room
    // for droplet depth on the antisolar side), so at low sun elevations the
    // true sun direction points almost straight off the left edge: there is
    // close to zero margin on that side by construction of the layout, so
    // no world-space radius reliably keeps the icon on-canvas. The dashed
    // axis line above is drawn unclamped (harmless off-canvas) and carries
    // the true far-away direction; the icon only needs to sit clearly,
    // legibly, and in the right direction close to the observer, the same
    // way the single-droplet view's own Sun icon is a fixed screen element
    // rather than a geometrically "correct" distance. It is anchored to the
    // observer, so it travels with them -- the Sun stays behind whoever is
    // looking, which is the whole precondition for seeing a bow at all.
    const sunScreenDir = SD(sun);
    const sunMargin = 14;
    let sunDist = 70;
    if (sunScreenDir.x < -1e-6) sunDist = Math.min(sunDist, (o.x - sunMargin) / -sunScreenDir.x);
    if (sunScreenDir.x > 1e-6) sunDist = Math.min(sunDist, (w - o.x - sunMargin) / sunScreenDir.x);
    if (sunScreenDir.y < -1e-6) sunDist = Math.min(sunDist, (o.y - sunMargin) / -sunScreenDir.y);
    if (sunScreenDir.y > 1e-6) sunDist = Math.min(sunDist, (h - o.y - sunMargin) / sunScreenDir.y);
    sunDist = Math.max(24, sunDist);
    const sp = { x: o.x + sunScreenDir.x * sunDist, y: o.y + sunScreenDir.y * sunDist };
    const sg = ctx.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, 26);
    sg.addColorStop(0, 'rgba(255,238,180,0.9)');
    sg.addColorStop(1, 'rgba(255,210,90,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, 6, 0, Math.PI * 2);
    ctx.fill();
    if (state.show.labels) {
      // Left-aligned, not centred: the icon sits close to the left edge at
      // most sun elevations (see the clamp above), and a centred label would
      // clip against that edge.
      label(ctx, `${t('sunLabel')} · ${num(state.sunElevation, 0)}°`, Math.max(sp.x - 4, 4), sp.y - 28, {
        align: 'left', color: '#ffe9a8',
      });
    }

    // readout
    label(ctx, `${t('dropCount')}: ${fmt(drops.length)}`, 12, 16, { color: '#cfe0ff' });
    label(ctx, `${t('dropsContributing')}: ${fmt(contributing)}`, 12, 36, { color: '#6fd3a4' });

    // legend: what green vs grey actually means, spelled out next to a
    // sample swatch rather than left for the hint text alone to carry
    if (state.show.labels) {
      const swatch = (x, y, color) => {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      };
      swatch(16, 58, '#6fd3a4');
      label(ctx, t('dropsLegendReaches'), 26, 58, {
        align: 'left', color: '#9fd8bd', bg: false, font: SMALL_FONT,
      });
      swatch(16, 74, 'rgba(150,175,215,0.7)');
      label(ctx, t('dropsLegendMisses'), 26, 74, {
        align: 'left', color: '#8ea3c6', bg: false, font: SMALL_FONT,
      });

      label(ctx, t('dropsHint'), 12, h - 62, { color: '#8ea3c6', font: SMALL_FONT });
      label(ctx, t('dropsSunHint'), 12, h - 46, { color: '#e0a83f', font: SMALL_FONT });
      label(ctx, t('dropsMoveHint'), 12, h - 30, { color: '#9fd8bd', font: SMALL_FONT });
      label(ctx, t(sel ? 'dropsClearHint' : 'dropsClickHint'), 12, h - 14, {
        color: '#cfa9e8', font: SMALL_FONT,
      });
    }
  }

  /* --------------------------------------------------------- inspector -- */

  /**
   * Everything one droplet does with the sunlight that hits it.
   *
   * The field answers "which droplets reach this observer"; this answers
   * "why that one, and where does the rest of its light go" -- for every
   * order in DROP_ORDERS, not just the one the field is highlighting.
   * Nothing here is positioned by hand: each exit direction is
   * rainbowGeometry's own scattering angle rotated off the incoming
   * sunlight, so the ray that lands in the eye lands there because the
   * numbers put it there.
   */
  function drawInspector(ctx, v) {
    const { sel, anti, sun, P, o, w, h, s } = v;
    const { dir, phiSeen, bands, hit } = dropReport(sel);
    if (!dir) return;
    const toEye = { x: -dir.x, y: -dir.y };
    const q = P(sel);
    const maxLen = Math.min(s * 0.45, 300);
    // The hint stack owns the bottom of the canvas; a caption placed by the
    // optics will otherwise sit on top of it, which this project has now had
    // to fix twice in two different views.
    const bottom = h - (state.show.labels ? 74 : 10);
    // Arc radii follow how far apart the eye and the droplet actually are on
    // screen. At full canvas width they need room to read; for a droplet a
    // few pixels from the eye, two fixed-radius arcs land on top of each
    // other and on the observer's own label.
    const gap = Math.hypot(q.x - o.x, q.y - o.y);

    // the incoming sunlight, drawn back towards the Sun until it leaves the
    // canvas -- parallel light, so this segment is a copy of the dashed axis
    const sd = SD(sun);
    const inLen = Math.min(edgeDist(q, sd, w, h), maxLen);
    if (inLen > 12) {
      const from = { x: q.x + sd.x * inLen, y: q.y + sd.y * inLen };
      strokePath(ctx, [from, q], 'rgba(255,242,196,0.9)', 1.6);
      arrowHead(ctx, from, q, 'rgba(255,242,196,0.95)', 7);
      if (state.show.labels) {
        tip(ctx, t('dropIncoming'), from.x - sd.x * 4, from.y - sd.y * 4 - 12, w, h, {
          color: '#ffe9a8', bottom,
        });
      }
    }

    for (const band of bands) {
      const ref = band.angles.find((a) => a.lambda === 650) || band.angles[0];
      const refDirs = exitDirs(anti, ref.phi);
      // Which of the two cross-section rays points at the observer's side of
      // the axis. Both are drawn; only this one can ever end in the eye.
      const nearSide = dot(refDirs[0], toEye) >= dot(refDirs[1], toEye) ? 0 : 1;

      for (const a of band.angles) {
        const dirs = exitDirs(anti, a.phi);
        const reaches = Math.abs(phiSeen - a.phi) <= BOW_MATCH_DEG;
        for (let i = 0; i < 2; i++) {
          const away = i !== nearSide;
          const sdir = SD(dirs[i]);
          if (reaches && !away) {
            // drawn to the eye itself, not to a nominal length: the whole
            // claim is that this ray ends there
            strokePath(ctx, [q, o], colorFor(a.lambda, 0.95), 1.8);
            continue;
          }
          const L = Math.min(edgeDist(q, sdir, w, h), maxLen);
          if (L < 6) continue;
          strokePath(ctx, [q, { x: q.x + sdir.x * L, y: q.y + sdir.y * L }],
            colorFor(a.lambda, away ? 0.3 : 0.55, away ? 0.7 : 0.45), 1,
            away ? [3, 4] : null);
        }
      }

      if (state.show.labels) {
        const sdir = SD(refDirs[nearSide]);
        const L = Math.min(edgeDist(q, sdir, w, h), maxLen);
        tip(ctx, `k=${band.k} · φ ${deg(ref.phi, 1)}`,
          q.x + sdir.x * (L - 18), q.y + sdir.y * (L - 18), w, h,
          { color: hit && hit.k === band.k ? '#ffdca0' : '#9fb4d8', bottom });
      }
    }

    // The two angles, each drawn where it is actually measured. Theta is the
    // turn the droplet puts into the light, so it belongs at the droplet;
    // phi is how far from the antisolar point the OBSERVER has to look, so
    // it belongs at the eye. Drawing either one at the other's vertex is the
    // mistake this project has already had to fix once.
    if (state.show.angles) {
      const antiAng = Math.atan2(SD(anti).y, SD(anti).x);
      const band = hit || bands[0];
      if (band) {
        const ref = band.angles.find((a) => a.lambda === 650) || band.angles[0];
        const dirs = exitDirs(anti, ref.phi);
        const nearSide = dot(dirs[0], toEye) >= dot(dirs[1], toEye) ? 0 : 1;
        const exitAng = Math.atan2(SD(dirs[nearSide]).y, SD(dirs[nearSide]).x);
        arcBetween(ctx, q.x, q.y, O.clamp(gap * 0.26, 16, 34), antiAng, exitAng,
          'rgba(224,168,63,0.85)', `Θ ${deg(180 - ref.phi, 1)}`);
      }
      const losAng = Math.atan2(SD(dir).y, SD(dir).x);
      arcBetween(ctx, o.x, o.y, O.clamp(gap * 0.42, 24, 46), antiAng, losAng,
        hit ? 'rgba(224,168,63,0.95)' : 'rgba(143,164,200,0.8)', `φ ${deg(phiSeen, 1)}`);
    }

    // the droplet itself, and the verdict
    ctx.save();
    ctx.strokeStyle = hit ? colorFor(hit.nearest.lambda, 0.95) : 'rgba(207,169,232,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(q.x, q.y, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(q.x, q.y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    if (state.show.labels) {
      const text = hit
        ? t('dropHits', { angle: deg(phiSeen, 1) })
        : t('dropMisses', { angle: deg(phiSeen, 1) });
      tip(ctx, text, q.x, q.y + 26, w, h, { color: hit ? '#ffdca0' : '#cfa9e8', bottom });
    }
  }

  function groundY() {
    // Observer height in metres, mapped onto the scene purely for legibility.
    // Anchored in WORLD coordinates, not to the observer: tying it to the
    // observer made the ground ride upwards with them, which buried the very
    // thing rising is supposed to reveal -- rain below eye level. The ground
    // is a fixed plane and the observer moves relative to it, which is also
    // why OBS_RANGE cannot let them descend past it.
    const hm = state.observerHeight;
    return -Math.min(0.55, 0.06 + Math.log10(1 + hm) * 0.16);
  }

  function fmt(n) {
    return n >= 1000 ? `${num(n / 1000, n >= 10000 ? 0 : 1)}k` : String(n);
  }

  /** Grow the droplet field towards the target while animating. */
  function tick() {
    if (state.scene !== 'drops' || !state.dropsAnimate) return false;
    if (drops.length >= state.dropCount) return false;
    const add = Math.max(1, Math.ceil(drops.length * 0.25));
    const target = Math.min(state.dropCount, drops.length + add);
    while (drops.length < target) {
      const depth = 0.12 + Math.pow(Math.random(), 0.6) * 0.88;
      const spread = state.show.rainBelow ? 1 : 0.62;
      drops.push({ x: depth, y: (Math.random() * 2 - 1) * spread * depth * 1.25 });
    }
    seedKey = makeKey();
    return true;
  }

  function reset() {
    drops = [];
    seedKey = '';
    if (state.selectedDrop) set({ selectedDrop: null });
  }

  /* ------------------------------------------------------- interaction -- */

  /** Screen position of a world point, from the last frame's layout. */
  function proj(p) {
    return { x: layout.ox + p.x * layout.s, y: layout.oy - p.y * layout.s };
  }

  function obsScreen() {
    return proj(layout.obs);
  }

  function obsFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      dropsObserverX: O.clamp((e.clientX - rect.left - layout.ox) / layout.s, ...OBS_RANGE.x),
      dropsObserverY: O.clamp((layout.oy - (e.clientY - rect.top)) / layout.s, ...OBS_RANGE.y),
    };
  }

  function near(e, p, r) {
    const rect = canvas.getBoundingClientRect();
    return Math.hypot(e.clientX - rect.left - p.x, e.clientY - rect.top - p.y) < r;
  }

  /** The droplet under the pointer, if any -- nearest wins. */
  function dropUnder(e) {
    if (!layout) return null;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    let best = null;
    let bestD = PICK_RADIUS;
    for (const d of drops) {
      const q = proj(d);
      const dd = Math.hypot(q.x - px, q.y - py);
      if (dd < bestD) {
        bestD = dd;
        best = d;
      }
    }
    return best;
  }

  // Only the observer glyph is a drag handle -- a click anywhere else stays a
  // plain click. Teleporting the observer to wherever the canvas happened to
  // be tapped would make the readout jump for reasons the user did not ask
  // for, and the sliders in the control column cover precise placement.
  let dragging = false;
  canvas.addEventListener('pointerdown', (e) => {
    if (layout && near(e, obsScreen(), 18)) {
      dragging = true;
      grabbing = true;
      capture(canvas, e);
      return;
    }
    // A click on a droplet is an inspection request; a click on empty sky
    // puts the panel back to the explanation, which is where it was.
    const d = dropUnder(e);
    set(d ? { selectedDrop: { x: d.x, y: d.y }, panel: 'ray' } : { selectedDrop: null, panel: 'guide' });
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!layout) return;
    if (dragging) {
      set(obsFromEvent(e));
      return;
    }
    const over = near(e, obsScreen(), 18);
    if (over !== grabbing) {
      grabbing = over;
      draw();
    }
    canvas.style.cursor = over ? 'grab' : dropUnder(e) ? 'pointer' : 'default';
  });
  const stopDrag = () => {
    dragging = false;
  };
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  return { draw, tick, reset };
}

function rotate(v, a) {
  const c = Math.cos(a);
  const s = Math.sin(a);
  return { x: v.x * c - v.y * s, y: v.x * s + v.y * c };
}

/** Distance from p to the canvas edge along the unit screen direction d. */
function edgeDist(p, d, w, h) {
  let best = Infinity;
  if (d.x > 1e-6) best = Math.min(best, (w - p.x) / d.x);
  if (d.x < -1e-6) best = Math.min(best, -p.x / d.x);
  if (d.y > 1e-6) best = Math.min(best, (h - p.y) / d.y);
  if (d.y < -1e-6) best = Math.min(best, -p.y / d.y);
  return Number.isFinite(best) ? Math.max(0, best) : 0;
}

/**
 * The arc between two screen angles, taking the short way round so the sweep
 * always shows the angle actually being named.
 */
function arcBetween(ctx, cx, cy, r, a0, a1, color, text) {
  let delta = (a1 - a0) % (Math.PI * 2);
  if (delta > Math.PI) delta -= Math.PI * 2;
  if (delta < -Math.PI) delta += Math.PI * 2;
  angleArc(ctx, cx, cy, r, a0, a0 + delta, color, text);
}

/**
 * A centred caption clamped onto the canvas. Everything the inspector labels
 * is placed by the optics, so any of these can land past an edge -- which is
 * a class of bug this project has already shipped twice.
 */
function tip(ctx, text, x, y, w, h, opts = {}) {
  ctx.save();
  ctx.font = opts.font || SMALL_FONT;
  const half = ctx.measureText(text).width / 2 + 6;
  ctx.restore();
  const bottom = opts.bottom ?? h - 10;
  label(ctx, text, O.clamp(x, half + 2, Math.max(half + 2, w - half - 2)),
    O.clamp(y, 10, Math.max(10, bottom)), { align: 'center', font: SMALL_FONT, ...opts });
}

/* ============ src/skyView.js ============ */

/**
 * skyView.js -- Mode C: the 3-D geometry.
 *
 * The observer sits at the origin. Every direction is a unit vector, so the
 * "sky" is the unit sphere and the bow is literally the set of directions at
 * angle phi from the antisolar direction. The ground is a plane below the
 * observer, which is what produces the horizon -- the arc is never drawn as
 * an arc, it is a circle with part of it cut away.
 *
 * A small hand-written perspective camera keeps the whole app dependency-free.
 */





const NEAR = 0.02;

/** Where the traced droplet sits, in the unit-sphere world of this scene. */
const DROP_DIST = 1;
const SUN_LEN = 0.55;
// The orders that miss run PAST the observer rather than stopping short: the
// gap between such a ray and the eye is then the miss angle drawn to scale,
// the ray visibly sails by, and its caption lands clear of the observer's own
// label instead of on top of it.
const OUT_LEN = DROP_DIST * 1.55;
/** Where along a missing ray its caption sits. */
const OUT_LABEL_AT = 0.95;
const ARC_DROP = 0.2;
const ARC_EYE = 0.36;

/** Screen distance at which a click counts as landing on a bow. */
const PICK_PX = 13;
/** Rolls sampled around each bow when hit-testing a click: 1-degree steps. */
const PICK_STEPS = 360;

const MONO_FONT = '10px "IBM Plex Mono", ui-monospace, monospace';

/** Reflection order -> chrome colour, the same convention drawCone() uses. */
const ORDER_COLOR = {
  1: 'rgba(111,211,164,0.75)',
  2: 'rgba(155,140,240,0.75)',
  3: 'rgba(240,136,93,0.7)',
};

/** A caption clamped onto the canvas -- projected labels land anywhere. */
function capLabel(ctx, text, x, y, w, h, color) {
  ctx.save();
  ctx.font = MONO_FONT;
  const half = ctx.measureText(text).width / 2 + 6;
  ctx.restore();
  label(ctx, text, O.clamp(x, half + 2, Math.max(half + 2, w - half - 2)),
    O.clamp(y, 10, Math.max(10, h - 10)), { align: 'center', color, font: MONO_FONT });
}

/* ------------------------------------------------------------- camera ---- */

function makeCamera(eye, forward, fovDeg, w, h) {
  const zA = O.vnorm(O.vneg(forward));
  let upHint = O.vec(0, 1, 0);
  if (Math.abs(O.vdot(zA, upHint)) > 0.999) upHint = O.vec(0, 0, 1);
  const xA = O.vnorm(O.vcross(upHint, zA));
  const yA = O.vcross(zA, xA);
  const f = 1 / Math.tan((fovDeg * O.RAD) / 2);
  const scale = (h / 2) * f;
  return {
    eye,
    project(p) {
      const d = O.vsub(p, eye);
      const cx = O.vdot(d, xA);
      const cy = O.vdot(d, yA);
      const cz = -O.vdot(d, zA);
      return { x: w / 2 + (cx / cz) * scale, y: h / 2 - (cy / cz) * scale, z: cz };
    },
    /** Camera-space depth only, used for near-plane clipping. */
    depth(p) {
      return -O.vdot(O.vsub(p, eye), zA);
    },
  };
}

/** Project a world polyline, splitting it wherever it crosses the near plane. */
function clipPolyline(cam, pts) {
  const out = [];
  let run = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const z = cam.depth(p);
    if (z > NEAR) {
      run.push(cam.project(p));
    } else {
      if (run.length > 1) out.push(run);
      run = [];
      // enter/exit points keep the line touching the edge instead of jumping
      const prev = pts[i - 1];
      if (prev && cam.depth(prev) > NEAR) {
        run.push(cam.project(lerpToNear(cam, prev, p)));
        out.push(run);
        run = [];
      }
      const next = pts[i + 1];
      if (next && cam.depth(next) > NEAR) run.push(cam.project(lerpToNear(cam, next, p)));
    }
  }
  if (run.length > 1) out.push(run);
  return out;
}

function lerpToNear(cam, inside, outside) {
  const zi = cam.depth(inside);
  const zo = cam.depth(outside);
  const tt = (zi - NEAR) / (zi - zo);
  return O.vadd(inside, O.vmul(O.vsub(outside, inside), Math.max(0, Math.min(1, tt))));
}

/* --------------------------------------------------- cached bow profile -- */

let profileCache = { key: '', profile: null };

function bowProfile() {
  const key = `${state.dispersion}|${state.indexMode}|${state.indexScale}|${state.show.primary}|${state.show.secondary}|${state.show.higher}`;
  if (profileCache.key === key) return profileCache.profile;
  const orders = [];
  if (state.show.primary) orders.push(1);
  if (state.show.secondary) orders.push(2);
  const profile = orders.length
    ? O.spectralProfile({
        indexModel: indexModel(),
        orders,
        minDeg: 34,
        maxDeg: 60,
        bins: 260,
        rays: 5000,
      })
    : null;
  profileCache = { key, profile };
  return profile;
}

/* ------------------------------------------------------------- the view -- */

function createSkyView(canvas) {
  let cam = null;
  let size = { w: 0, h: 0 };

  function groundDepth() {
    // observer height, compressed logarithmically so 1.7 m and 1000 m both fit
    return Math.min(0.62, 0.05 + Math.log10(1 + state.observerHeight) * 0.16);
  }

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    size = { w, h };
    ctx.clearRect(0, 0, w, h);

    const anti = O.antisolarDirection(state.sunElevation, state.sunAzimuth);
    const sun = O.sunDirection(state.sunElevation, state.sunAzimuth);
    const gh = groundDepth();
    const dip = O.horizonDipDeg(state.observerHeight);

    if (state.view === 'eye') {
      const az = state.sunAzimuth + 180 + state.eyeAzimuth;
      const fwd = O.sunDirection(state.eyeElevation, az);
      cam = makeCamera(O.vec(0, 0, 0), fwd, state.fov, w, h);
      drawSkyBackdrop(ctx, w, h, sun);
    } else {
      const eye = O.vmul(O.sunDirection(state.camPitch, state.camYaw), state.camDist);
      const target = O.vmul(anti, 0.33);
      cam = makeCamera(eye, O.vnorm(O.vsub(target, eye)), 42, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#070a12');
      g.addColorStop(1, '#0c1020');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    if (state.show.ground) drawGround(ctx, gh, w, h);
    if (state.show.horizon) drawHorizon(ctx, dip);
    if (state.show.sky && state.view === 'orbit') drawSphereGuides(ctx);

    if (state.show.renderedBow) drawRenderedBow(ctx, anti, dip);
    drawBowCircles(ctx, anti, dip);
    if (state.show.alexander) drawAlexander(ctx, anti, dip);
    if (state.show.cone) drawCone(ctx, anti);

    drawPickedBeam(ctx, anti, sun, w, h, dip);

    drawSunAndAntisolar(ctx, sun, anti, w, h);
    if (state.view === 'orbit') drawObserver(ctx);
    drawReadout(ctx, w, h, dip);
    if (state.show.labels) {
      const hintFont = '10px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif';
      label(ctx, t('skyHint'), 12, h - 30, { color: '#8ea3c6', font: hintFont });
      label(ctx, t(state.skyPick ? 'skyClearHint' : 'skyClickHint'), 12, h - 14, {
        color: '#cfa9e8', font: hintFont,
      });
    }
  }

  /* ------------------------------------------------------------ elements */

  function visibleDir(d, dip) {
    if (state.show.rainBelow) return true;
    if (!state.show.horizon && !state.show.ground) return true;
    return Math.asin(O.clamp(d.y, -1, 1)) * O.DEG > -dip;
  }

  function drawSkyBackdrop(ctx, w, h, sun) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0a1730');
    g.addColorStop(0.55, '#12294d');
    g.addColorStop(1, '#1d3a63');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  function drawGround(ctx, gh, w, h) {
    const y0 = -gh;
    const isEye = state.view === 'eye';
    if (isEye) {
      // fill everything below the projected horizon line
      const horizonY = horizonScreenY();
      if (horizonY !== null && horizonY < h) {
        const g = ctx.createLinearGradient(0, horizonY, 0, h);
        g.addColorStop(0, 'rgba(26,42,32,0.98)');
        g.addColorStop(1, 'rgba(8,14,11,1)');
        ctx.fillStyle = g;
        ctx.fillRect(0, Math.max(0, horizonY), w, h - Math.max(0, horizonY));
      }
    }
    const col = state.show.rainBelow ? 'rgba(120,170,140,0.16)' : 'rgba(120,170,140,0.3)';
    for (let r = 0.5; r <= 6.001; r += 0.5) {
      const pts = [];
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2;
        pts.push(O.vec(Math.cos(a) * r, y0, Math.sin(a) * r));
      }
      for (const run of clipPolyline(cam, pts)) strokePath(ctx, run, col, r % 2 === 0 ? 0.9 : 0.5);
    }
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const pts = [
        O.vec(0, y0, 0),
        O.vec(Math.cos(a) * 6, y0, Math.sin(a) * 6),
      ];
      for (const run of clipPolyline(cam, pts)) strokePath(ctx, run, col, 0.5);
    }
  }

  function horizonScreenY() {
    // the horizon in eye view: direction with elevation -dip, straight ahead
    const az = state.sunAzimuth + 180 + state.eyeAzimuth;
    const d = O.sunDirection(-O.horizonDipDeg(state.observerHeight), az);
    const p = cam.project(O.vmul(d, 50));
    return cam.depth(O.vmul(d, 50)) > NEAR ? p.y : null;
  }

  function drawHorizon(ctx, dip) {
    const pts = [];
    for (let i = 0; i <= 180; i++) {
      const a = (i / 180) * Math.PI * 2;
      const el = -dip * O.RAD;
      pts.push(O.vec(Math.cos(el) * Math.cos(a), Math.sin(el), Math.cos(el) * Math.sin(a)));
    }
    for (const run of clipPolyline(cam, pts)) {
      strokePath(ctx, run, 'rgba(150,200,170,0.55)', 1.3, [7, 4]);
    }
  }

  function drawSphereGuides(ctx) {
    for (const el of [30, 60]) {
      const pts = [];
      for (let i = 0; i <= 120; i++) {
        const a = (i / 120) * Math.PI * 2;
        const e = el * O.RAD;
        pts.push(O.vec(Math.cos(e) * Math.cos(a), Math.sin(e), Math.cos(e) * Math.sin(a)));
      }
      for (const run of clipPolyline(cam, pts)) {
        strokePath(ctx, run, 'rgba(120,150,200,0.13)', 0.8);
      }
    }
  }

  function drawCone(ctx, anti) {
    const idx = indexModel();
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    if (state.show.higher) orders.push(3);
    for (const k of orders) {
      const geo = O.rainbowGeometry(idx(state.wavelength === 'white' ? 650 : state.wavelength), k);
      if (!geo) continue;
      const col = k === 1 ? 'rgba(111,211,164,0.5)' : k === 2 ? 'rgba(155,140,240,0.45)' : 'rgba(240,136,93,0.35)';
      const dash = k === 1 ? null : k === 2 ? [6, 4] : [2, 4];
      const circle = O.rainbowCircle(anti, geo.antisolarDeg, 128);
      for (let i = 0; i < circle.length - 1; i += 8) {
        const seg = [O.vec(0, 0, 0), circle[i]];
        for (const run of clipPolyline(cam, seg)) strokePath(ctx, run, col, 0.7, dash);
      }
      for (const run of clipPolyline(cam, circle)) strokePath(ctx, run, col, 1.1, dash);
      // the cone axis
      for (const run of clipPolyline(cam, [O.vec(0, 0, 0), O.vmul(anti, 1.15)])) {
        strokePath(ctx, run, 'rgba(160,180,220,0.5)', 1, [4, 4]);
      }
    }
  }

  function drawBowCircles(ctx, anti, dip) {
    const idx = indexModel();
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    if (state.show.higher) orders.push(3);
    const lambdas =
      state.wavelength === 'white' ? O.NAMED_COLORS.map((c) => c.lambda) : [state.wavelength];

    for (const k of orders) {
      for (const lam of lambdas) {
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const circle = O.rainbowCircle(anti, geo.antisolarDeg, 220);
        // split into runs of visible directions, so the horizon does the cutting
        let run = [];
        const runs = [];
        for (const d of circle) {
          if (visibleDir(d, dip)) run.push(d);
          else {
            if (run.length > 1) runs.push(run);
            run = [];
          }
        }
        if (run.length > 1) runs.push(run);
        for (const r of runs) {
          for (const seg of clipPolyline(cam, r)) {
            strokePath(ctx, seg, colorFor(lam, k === 1 ? 0.95 : 0.7), k === 1 ? 2 : 1.4);
          }
        }
      }
    }

    if (state.show.wavelengthLabels && orders.length) {
      for (const k of orders) {
        const lam = lambdas[0];
        const geo = O.rainbowGeometry(idx(lam), k);
        if (!geo) continue;
        const top = topOfBow(anti, geo.antisolarDeg);
        if (top && cam.depth(top) > NEAR) {
          const p = cam.project(top);
          label(ctx, `k=${k} · φ=${deg(geo.antisolarDeg, 2)}`, p.x, p.y - 14, {
            align: 'center', color: colorFor(lam),
          });
        }
      }
    }
  }

  function topOfBow(anti, phiDeg) {
    let best = null;
    for (const d of O.rainbowCircle(anti, phiDeg, 128)) {
      if (!best || d.y > best.y) best = d;
    }
    return best;
  }

  function drawAlexander(ctx, anti, dip) {
    if (!state.show.primary || !state.show.secondary) return;
    const band = O.alexandersBand(indexModel());
    if (!(band.outerDeg > band.innerDeg)) return;
    const steps = 8;
    for (let i = 0; i <= steps; i++) {
      const phi = band.innerDeg + ((band.outerDeg - band.innerDeg) * i) / steps;
      const circle = O.rainbowCircle(anti, phi, 160).filter((d) => visibleDir(d, dip));
      if (circle.length < 2) continue;
      for (const seg of clipPolyline(cam, circle)) {
        strokePath(ctx, seg, 'rgba(0,0,0,0.22)', 6);
      }
    }
  }

  function drawRenderedBow(ctx, anti, dip) {
    const prof = bowProfile();
    if (!prof) return;
    const maxR = prof.maxRadiance || 1;
    for (let i = 0; i < prof.bins; i++) {
      const c = prof.rgb[i];
      const m = Math.max(c.r, c.g, c.b) / maxR;
      if (m < 0.012) continue;
      const gain = Math.pow(m, 0.55);
      const col = `rgba(${Math.round((255 * c.r) / Math.max(c.r, c.g, c.b, 1e-9))},${Math.round(
        (255 * c.g) / Math.max(c.r, c.g, c.b, 1e-9)
      )},${Math.round((255 * c.b) / Math.max(c.r, c.g, c.b, 1e-9))},${(gain * 0.85).toFixed(3)})`;
      const circle = O.rainbowCircle(anti, prof.phi[i], 150);
      let run = [];
      const runs = [];
      for (const d of circle) {
        if (visibleDir(d, dip)) run.push(d);
        else {
          if (run.length > 1) runs.push(run);
          run = [];
        }
      }
      if (run.length > 1) runs.push(run);
      for (const r of runs) {
        for (const seg of clipPolyline(cam, r)) strokePath(ctx, seg, col, 3.2);
      }
    }
  }

  function drawSunAndAntisolar(ctx, sun, anti, w, h) {
    const sp = O.vmul(sun, 1.25);
    if (cam.depth(sp) > NEAR) {
      const p = cam.project(sp);
      const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, 26);
      g.addColorStop(0, 'rgba(255,240,190,0.95)');
      g.addColorStop(1, 'rgba(255,215,110,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff2c4';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      if (state.show.labels) {
        label(ctx, `${t('sunLabel')} · ${deg(state.sunElevation, 0)}`, p.x, p.y - 30, {
          align: 'center', color: '#ffe9a8',
        });
      }
    }
    if (state.show.antisolar) {
      const ap = O.vmul(anti, 1.0);
      if (cam.depth(ap) > NEAR) {
        const p = cam.project(ap);
        ctx.strokeStyle = '#8fd7ff';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x - 11, p.y);
        ctx.lineTo(p.x + 11, p.y);
        ctx.moveTo(p.x, p.y - 11);
        ctx.lineTo(p.x, p.y + 11);
        ctx.stroke();
        if (state.show.labels) {
          label(ctx, t('antisolarLabelLong'), p.x, p.y + 24, { align: 'center', color: '#8fd7ff' });
        }
      }
    }
  }

  function drawObserver(ctx) {
    const p = cam.project(O.vec(0, 0, 0));
    if (cam.depth(O.vec(0, 0, 0)) <= NEAR) return;
    ctx.fillStyle = '#e8eefc';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    if (state.show.labels) {
      label(ctx, `${t('observerLabel')} · ${num(state.observerHeight, state.observerHeight < 10 ? 1 : 0)} ${t('metres')}`,
        p.x, p.y + 18, { align: 'center', color: '#e8eefc' });
    }
  }

  function drawReadout(ctx, w, h, dip) {
    const idx = indexModel();
    const geo = O.rainbowGeometry(idx(650), 1);
    const vis = O.visibleFraction(state.sunElevation, geo.antisolarDeg, dip);
    let y = 16;
    const put = (s, color) => {
      label(ctx, s, 12, y, { color });
      y += 19;
    };
    put(`${t('coneAngle')} (k=1): ${deg(geo.antisolarDeg, 2)} — ${t('derivedFromSim')}`, '#6fd3a4');
    if (state.show.secondary) {
      put(`${t('coneAngle')} (k=2): ${deg(O.rainbowGeometry(idx(650), 2).antisolarDeg, 2)}`, '#9b8cf0');
    }
    put(`${t('bowTopElevation')}: ${deg(vis.topElevationDeg, 1)}`, '#cfe0ff');
    put(`${t('visibleAbove')}: ${num(vis.fraction * 100, 0)} %`, '#cfe0ff');
    put(`${t('horizonDip')}: ${deg(dip, 3)}`, '#8ea3c6');
    if (vis.fraction <= 0) {
      label(ctx, t('bowBelowHorizon'), 12, y + 4, { color: '#ff9a8a' });
    }
  }

  /* ------------------------------------------------------- traced beam -- */

  /**
   * Every bow line currently on screen, as {k, lambda, phi}.
   *
   * Shared by the drawing and the click test, so a reader can only ever pick
   * a line that is actually there -- and picks exactly the one they aimed at,
   * wavelength included.
   */
  function bowLines() {
    const idx = indexModel();
    const orders = [];
    if (state.show.primary) orders.push(1);
    if (state.show.secondary) orders.push(2);
    if (state.show.higher) orders.push(3);
    const lambdas =
      state.wavelength === 'white' ? O.NAMED_COLORS.map((c) => c.lambda) : [state.wavelength];
    const out = [];
    for (const k of orders) {
      for (const lambda of lambdas) {
        const geo = O.rainbowGeometry(idx(lambda), k);
        if (geo) out.push({ k, lambda, phi: geo.antisolarDeg });
      }
    }
    return out;
  }

  /**
   * The picked point, resolved against the CURRENT engine numbers.
   *
   * state.skyPick stores a roll around the antisolar axis, not a direction,
   * so moving the Sun or changing the index model slides the pick along with
   * its bow instead of leaving it stranded in empty sky.
   */
  function resolvePick(anti) {
    const pick = state.skyPick;
    if (!pick) return null;
    const geo = O.rainbowGeometry(indexModel()(pick.lambda), pick.k);
    if (!geo) return null;
    const dir = O.bowDirection(anti, geo.antisolarDeg, pick.roll);
    return { ...pick, geo, phi: geo.antisolarDeg, dir };
  }

  /** A world polyline, drawn through the near-plane clipper. */
  function line3(ctx, pts, color, width, dash) {
    for (const run of clipPolyline(cam, pts)) strokePath(ctx, run, color, width, dash);
  }

  /** A great-circle arc from `axis` out to `angleDeg`, centred on `at`. */
  function arc3(ctx, at, gen, angleDeg, radius, color, text) {
    const pts = [];
    for (let i = 0; i <= 24; i++) pts.push(O.vadd(at, O.vmul(gen((angleDeg * i) / 24), radius)));
    line3(ctx, pts, color, 1);
    const mid = O.vadd(at, O.vmul(gen(angleDeg / 2), radius * 1.12));
    if (text && cam.depth(mid) > NEAR) {
      const p = cam.project(mid);
      label(ctx, text, p.x, p.y, { align: 'center', color, font: MONO_FONT });
    }
  }

  /**
   * One beam, traced from the Sun to the eye through a single droplet sitting
   * in the picked direction -- plus what that same droplet does with the
   * other reflection orders.
   *
   * The point of drawing the other orders is that they come from the SAME
   * droplet and leave in the wrong directions: order k concentrates its light
   * on a cone of half-angle Theta_k about the incoming sunlight, and only one
   * of those cones has an element that ends at the eye. That is why a given
   * droplet contributes to exactly one bow for a given observer, and why the
   * secondary bow you see is made of entirely different droplets from the
   * primary. Every direction here comes from directionAtAngle() fed with
   * rainbowGeometry()'s own scattering angle; the ray that lands in the eye
   * lands there because the numbers put it there (unit-tested to 1e-12).
   */
  function drawPickedBeam(ctx, anti, sun, w, h, dip) {
    const pick = resolvePick(anti);
    if (!pick) return;
    // The bow circle is cut by the horizon, so the trace has to be cut with
    // it: raising the Sun can carry a picked point below the ground, and a
    // beam still drawn to a droplet in a direction whose circle has just
    // vanished contradicts the very thing that vanishing is teaching. The
    // pick itself survives, so lowering the Sun brings it back.
    if (!visibleDir(pick.dir, dip)) return;
    const idx = indexModel();
    const P = O.vmul(pick.dir, DROP_DIST);
    const toEye = O.vneg(pick.dir);

    // sunlight in, along the one direction all of it travels
    const from = O.vadd(P, O.vmul(sun, SUN_LEN));
    line3(ctx, [from, P], 'rgba(255,242,196,0.9)', 1.6);
    if (cam.depth(from) > NEAR && cam.depth(P) > NEAR) {
      const a = cam.project(from);
      const b = cam.project(P);
      arrowHead(ctx, a, b, 'rgba(255,242,196,0.95)', 7);
      if (state.show.labels) {
        capLabel(ctx, t('dropIncoming'), a.x, a.y - 12, w, h, '#ffe9a8');
      }
    }

    // what this droplet does with each order
    for (const k of DROP_ORDERS) {
      const geo = O.rainbowGeometry(idx(pick.lambda), k);
      if (!geo) continue;
      const out = O.directionAtAngle(anti, toEye, geo.scatteringDeg);
      const reaches = k === pick.k;
      const end = reaches ? O.vec(0, 0, 0) : O.vadd(P, O.vmul(out, OUT_LEN));
      line3(ctx, [P, end], reaches ? colorFor(pick.lambda, 0.95) : ORDER_COLOR[k] || ORDER_COLOR[3],
        reaches ? 2.2 : 1.1, reaches ? null : [4, 4]);
      if (state.show.labels && !reaches) {
        const at = O.vadd(P, O.vmul(out, OUT_LEN * OUT_LABEL_AT));
        if (cam.depth(at) > NEAR) {
          const p = cam.project(at);
          capLabel(ctx, `k=${k} · φ ${deg(geo.antisolarDeg, 1)}`, p.x, p.y, w, h,
            ORDER_COLOR[k] || ORDER_COLOR[3]);
        }
      }
    }

    // Theta at the droplet, phi at the eye -- each at the vertex where it is
    // actually measured, the same split the many-droplets inspector uses.
    if (state.show.angles) {
      arc3(ctx, P, (a) => O.directionAtAngle(anti, toEye, a), 180 - pick.phi, ARC_DROP,
        'rgba(224,168,63,0.85)', `Θ ${deg(180 - pick.phi, 1)}`);
      arc3(ctx, O.vec(0, 0, 0), (a) => O.bowDirection(anti, a, pick.roll), pick.phi, ARC_EYE,
        'rgba(224,168,63,0.95)', `φ ${deg(pick.phi, 1)}`);
    }

    // the droplet itself
    if (cam.depth(P) > NEAR) {
      const p = cam.project(P);
      ctx.save();
      ctx.fillStyle = colorFor(pick.lambda, 0.95);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = colorFor(pick.lambda, 0.8);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      if (state.show.labels) {
        capLabel(ctx, `k=${pick.k} · ${pick.lambda} ${t('nm')}`, p.x, p.y - 20, w, h,
          colorFor(pick.lambda));
      }
    }
  }

  /* --------------------------------------------------------- interaction */

  /**
   * The bow line nearest a click, or null.
   *
   * Brute force over 1-degree rolls of every drawn line: a few thousand
   * projections once per click, which is nothing, and it means the test uses
   * exactly the projection the reader was looking at rather than an inverse
   * that would have to be kept in step with the camera by hand.
   */
  function pickAt(px, py) {
    if (!cam) return null;
    const anti = O.antisolarDirection(state.sunElevation, state.sunAzimuth);
    const dip = O.horizonDipDeg(state.observerHeight);
    let best = null;
    for (const line of bowLines()) {
      for (let i = 0; i < PICK_STEPS; i++) {
        const roll = (i / PICK_STEPS) * 360;
        const d = O.bowDirection(anti, line.phi, roll);
        if (!visibleDir(d, dip) || cam.depth(d) <= NEAR) continue;
        const p = cam.project(d);
        const gap = Math.hypot(p.x - px, p.y - py);
        if (gap < PICK_PX && (!best || gap < best.gap)) {
          best = { gap, k: line.k, lambda: line.lambda, roll };
        }
      }
    }
    return best;
  }

  let drag = null;
  let travelled = 0;
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY };
    travelled = 0;
    capture(canvas, e);
    canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    travelled += Math.hypot(dx, dy);
    drag = { x: e.clientX, y: e.clientY };
    if (state.view === 'orbit') {
      set({
        camYaw: state.camYaw + dx * 0.4,
        camPitch: O.clamp(state.camPitch + dy * 0.3, -85, 85),
      });
    } else {
      set({
        eyeAzimuth: state.eyeAzimuth - dx * 0.15,
        eyeElevation: O.clamp(state.eyeElevation + dy * 0.12, -60, 85),
      });
    }
  });
  const stop = () => {
    drag = null;
    canvas.style.cursor = 'grab';
  };
  canvas.addEventListener('pointerup', (e) => {
    // Dragging is the primary gesture here, so a click only counts as a pick
    // when the pointer essentially did not move. Without the threshold every
    // orbit would end by re-selecting whatever the cursor happened to land on.
    const wasClick = drag !== null && travelled < 5;
    stop();
    if (!wasClick) return;
    const rect = canvas.getBoundingClientRect();
    const hit = pickAt(e.clientX - rect.left, e.clientY - rect.top);
    if (hit) set({ skyPick: { k: hit.k, lambda: hit.lambda, roll: hit.roll }, panel: 'ray' });
    else if (state.skyPick) set({ skyPick: null, panel: 'guide' });
  });
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      if (state.view === 'orbit') {
        set({ camDist: O.clamp(state.camDist * (1 + Math.sign(e.deltaY) * 0.08), 1.2, 9) });
      } else {
        set({ fov: O.clamp(state.fov + Math.sign(e.deltaY) * 3, 25, 120) });
      }
    },
    { passive: false }
  );
  canvas.style.cursor = 'grab';

  return { draw, tick: () => false, reset: () => { profileCache = { key: '', profile: null }; } };
}

/**
 * panels.js -- the explanation column: tutorial, ray readout, mathematics
 * and the question set. All text comes from i18n.

 * Tutorial
 * ======================================================================== */

/**
 * The guided path. Each step owns three things:
 *
 *   apply  the state it needs on screen, pushed on entry. Every step sets
 *          `graphOpen` explicitly, true only where the step actually talks
 *          about a plot or focuses a control that lives in one -- otherwise
 *          the plots stay shut and the reader is not handed axes they have
 *          no reason for yet.
 *   focus  the control-column ids (translation keys, see ui.js) the step is
 *          actually asking the reader to move. app.js highlights them and
 *          warns to the console if a focused control is not present in the
 *          scene this step selected -- so "the step tells you to turn a knob
 *          that this scene hides" is a loud bug rather than a dead end.
 *   actions optional chips, either a patch object or a function returning one
 *          (used where the value has to come out of the engine instead of
 *          being written down as a literal).
 */
const TUTORIAL = [
  {
    title: 's1title', body: 's1body',
    apply: {
      scene: 'droplet', graph: 'exit', reflections: 0, dispersion: 0, wavelength: 'white',
      impact: 0.6, fanCount: 0, showNonRainbow: false, angleMode: 'antisolar',
      dropletZoom: 1, observerMode: 'auto', graphOpen: false,
      show: { angles: false, normals: false, labels: true, renderedBow: false },
      families: { 0: true, 1: false, 2: false, 3: false },
    },
    focus: ['impactParameter', 'wavelength'],
  },
  {
    title: 's2title', body: 's2body',
    apply: {
      scene: 'droplet', reflections: 0, graphOpen: false,
      show: { angles: true, normals: true },
      families: { 0: true, 1: false, 2: false, 3: false },
    },
    focus: ['impactParameter', 'showNormals', 'showAngles'],
    actions: [
      { label: 'b/R = 0.2', patch: { impact: 0.2 } },
      { label: 'b/R = 0.6', patch: { impact: 0.6 } },
      { label: 'b/R = 0.95', patch: { impact: 0.95 } },
    ],
  },
  {
    title: 's3title', body: 's3body',
    apply: {
      scene: 'droplet', reflections: 1, impact: 0.7, showNonRainbow: true, graphOpen: false,
      families: { 0: false, 1: true, 2: false, 3: false },
      show: { normals: false, angles: true },
    },
    focus: ['reflections', 'showNonRainbow'],
  },
  {

function applyStep(i) {
  const s = TUTORIAL[i];
  if (!s) return;
  set({ ...s.apply, step: i });
}

function renderTutorial() {
  const s = TUTORIAL[state.step];
  const nodes = [
    el('div', { class: 'step-counter' }, `${t('step')} ${state.step + 1} ${t('of')} ${TUTORIAL.length}`),
    el('h2', {}, t(s.title)),
    el('p', {}, t(s.body)),
  ];
  if (s.actions) {
    nodes.push(
      el('div', { class: 'action-row' },
        s.actions.map((a) =>
          el('button', {
            class: 'chip', type: 'button',
            // A patch may be a function when the value has to come out of the
            // engine -- a chip that jumps to the rainbow angle must not carry
            // that angle as a literal.
            onclick: () => set(typeof a.patch === 'function' ? a.patch() : a.patch),
          }, a.labelKey ? t(a.labelKey) : a.label)
        ))
    );
  }
  if (s.showRay) nodes.push(...rayInfoNodes({ compact: true }));
  if (s.note) nodes.push(el('p', { class: 'note' }, t(s.note)));

  nodes.push(
    el('div', { class: 'step-nav' },
      el('button', {
        class: 'btn', type: 'button', disabled: state.step === 0,
        onclick: () => applyStep(state.step - 1),
      }, t('prev')),
      el('button', {
        class: 'btn primary', type: 'button',
        onclick: () => {
          if (state.step < TUTORIAL.length - 1) applyStep(state.step + 1);
          else set({ mode: 'free' });
        },
      }, state.step < TUTORIAL.length - 1 ? t('next') : t('startFree'))
    ),
    el('div', { class: 'progress' },
      TUTORIAL.map((_, i) =>
        el('button', {
          class: 'dot' + (i === state.step ? ' on' : '') + (i < state.step ? ' done' : ''),
          type: 'button', title: `${t('step')} ${i + 1}`, onclick: () => applyStep(i),
        })
      ))
  );
  return nodes;
}

function renderFreeGuide() {
  const idx = indexModel();
  const p = O.rainbowGeometry(idx(650), 1);
  const s = O.rainbowGeometry(idx(650), 2);
  return [
    el('h2', {}, t('reconstructTitle')),
    el('p', { class: 'chain' }, t('reconstructBody')),
    el('div', { class: 'panel-block' },
      el('h3', {}, t('notHardCoded')),

      row('secondaryRainbow', deg(s.antisolarDeg, 2)),
      row('showAlexander', `${deg(O.alexandersBand(idx).innerDeg, 1)} – ${deg(O.alexandersBand(idx).outerDeg, 1)}`)
    ),

    el('p', { class: 'note' }, t('dropletSizeNote')),
